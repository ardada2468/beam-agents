[project]
name = "beam-agents"
version = "0.0.0"
description = "A runtime for protobuf-native, per-key-deterministic streaming agents on Apache Beam."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.13"
dependencies = [
  "apache-beam[gcp]>=2.60",
  "httpx[http2]",
  "pydantic>=2",
  "protobuf",
]

[dependency-groups]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "typecheck" },
  { include-group = "integration" },
  { include-group = "bench" },
  { include-group = "docs" },
  "pre-commit",
  "grpcio-tools",
]
test = [
  "pytest",
  "pytest-asyncio",
  "pytest-timeout",
  "pytest-cov",
  "hypothesis",
  "mutmut",
]
lint = [
  "ruff",
]
typecheck = [
  "mypy",
  "types-protobuf",
]
integration = [
  "testcontainers[kafka,redis]",
]
bench = [
  "pyperf",
]
docs = []

[tool.uv]
default-groups = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beam_agents"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Generated protobuf bindings are committed but never hand-edited or linted.
extend-exclude = ["src/beam_agents/_protos/*_pb2.py", "src/beam_agents/_protos/*_pb2.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "PL", "RUF"]
ignore = [
  "PLR0913", # too many arguments — runtime call signatures are often wide
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
enable_error_code = ["ignore-without-code"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "apache_beam.*"
ignore_missing_imports = true

# Generated protobuf stubs use bare `Mapping` in a few __init__ signatures,
# which trips strict `type-arg`. The gencode is never hand-edited, so we relax
# strict reporting for the generated package only.
[[tool.mypy.overrides]]
module = "beam_agents._protos.*"
disable_error_code = ["type-arg"]

# Apache Beam ships no type stubs, so every Beam call in a test reads as an
# untyped call under strict mode. Relax that one check for the coder tests that
# drive real pipelines; the rest of strict mode still applies.
[[tool.mypy.overrides]]
module = "tests.core.test_coders"
disable_error_code = ["no-untyped-call"]

# Beam types `Coder.from_type_hint` as `-> CoderT` (a cls-bound TypeVar), so our
# concrete override return trips the LSP `override` check — the same concrete
# pattern Beam's own subclasses (e.g. MapCoder) use. Suppress that one check for
# this module; the rest of strict mode still applies.
[[tool.mypy.overrides]]
module = "beam_agents.core.coders"
disable_error_code = ["override"]

# Beam's metrics API (`Metrics.counter(...).inc()`) ships no type annotations, so
# incrementing the soft-cap counter reads as an untyped call under strict mode.
# Suppress that one check for the facade; the rest of strict mode still applies.
[[tool.mypy.overrides]]
module = "beam_agents.memory.facade"
disable_error_code = ["no-untyped-call"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --cov=beam_agents --cov-report=term-missing --cov-report=xml"
asyncio_mode = "auto"
timeout = 30
testpaths = ["tests"]
markers = [
  "integration: requires docker compose services (Redpanda, Redis, Flink)",
  "semantics: correctness/determinism gates",
  "dataflow: nightly-only tests against real Dataflow",
  "slow: tests that take longer than 5 seconds",
]

[tool.coverage.run]
source = ["beam_agents"]
branch = true

[tool.mutmut]
# Never mutate the generated protobuf bindings, and kill mutants with the core
# test suite only. The full src/ tree is still copied (default source_paths) so
# imports resolve. Test selection is scoped for two reasons:
#   1. It keeps mutmut from running the package-surface test in
#      `tests/test_import.py`, which inspects `beam_agents/__init__.py` and
#      cannot pass while mutmut has instrumented it.
#   2. It deselects the two TestPipeline tests. mutmut reaps children with
#      os.wait(), which also reaps Beam DirectRunner worker subprocesses and
#      crashes with a KeyError on the unexpected PID. The determinism,
#      round-trip, and registration tests still cover every mutant in coders.py.
do_not_mutate = ["*/_protos/*"]
pytest_add_cli_args_test_selection = [
  "tests/core",
  "-k",
  "not shuffle_boundary and not group_by_key_key",
]
