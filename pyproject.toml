[project]
name = "beam-agents"
version = "0.0.0"
description = "A runtime for protobuf-native, per-key-deterministic streaming agents on Apache Beam."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.13"
dependencies = [
  "apache-beam[gcp]>=2.60",
  "httpx[http2]",
  "pydantic>=2",
  "protobuf",
]

# The reference effector (`beam_agents.effector`) is a separate service, not part
# of the pipeline: it runs outside Beam and needs transport/dedup clients the
# runtime itself never imports. Keeping them here means the core install — and
# the offline unit lane — stays free of all four, and the effector's adapters
# import them lazily so `import beam_agents.effector` works without any of them.
[project.optional-dependencies]
effector = [
  "aiokafka",
  "google-cloud-pubsub",
  "redis",
  "google-cloud-bigtable",
]
# The LangGraph adapter (`beam_agents.adapters.langgraph`). Core never imports
# LangGraph: `import beam_agents` must succeed without this extra, and the
# adapter package is the only module allowed to import langgraph at top level.
langgraph = [
  "langgraph>=1.0,<2",
  "langchain-core>=1.0,<2",
]
# The OTLP trace exporter (`otlp://` traces sink) builds ExportTraceServiceRequest
# messages from opentelemetry-proto's generated classes and POSTs them over the
# core httpx dependency. Pure generated protos — no OTel SDK, no grpc — but still
# optional: `DefaultSinkResolver.validate` stays import-free and only `resolve()`
# (pipeline expansion) imports it, so the core install works without the extra.
# Version floor: 1.x ships the stable/frozen trace signal.
otlp = [
  "opentelemetry-proto>=1.20",
]

# The effector is a service, so it gets a console entry point. It is the only
# executable this package ships; the runtime itself is a library embedded in a
# Beam pipeline.
[project.scripts]
beam-agents-effector = "beam_agents.effector.__main__:main"

[dependency-groups]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "typecheck" },
  { include-group = "integration" },
  { include-group = "bench" },
  { include-group = "docs" },
  { include-group = "precommit" },
]
test = [
  "pytest",
  "pytest-asyncio",
  "pytest-timeout",
  "pytest-cov",
  "hypothesis",
  "mutmut",
  # The LangGraph adapter's unit tests need the framework itself. Mirrored from
  # the `langgraph` extra (same pattern as `integration` mirroring `effector`):
  # the offline import boundary is proven by tests/adapters/test_import_isolation
  # blocking the import, not by the package's absence from the environment.
  "langgraph>=1.0,<2",
  "langchain-core>=1.0,<2",
  # The OTLP exporter's mapping/DoFn tests are plain offline unit tests (they
  # exercise generated proto classes and httpx.MockTransport, no network), so
  # they run — and are coverage-counted — in the required ci unit lane. This
  # mirrors the `otlp` extra rather than depending on it; the import-boundary
  # test proves the runtime still imports and validates without it installed.
  "opentelemetry-proto>=1.20",
]
lint = [
  "ruff",
]
typecheck = [
  "mypy",
  "types-protobuf",
]
integration = [
  "testcontainers[kafka,redis]",
  # The effector's live-broker/live-store tests need the same clients the
  # `effector` extra ships. Mirrored here (rather than depending on the extra)
  # so the `integration` lane installs them while the `ci` unit lane — which
  # syncs only lint/typecheck/test — still proves the offline import boundary.
  "aiokafka",
  "google-cloud-pubsub",
  "redis",
  "google-cloud-bigtable",
]
bench = [
  "pyperf",
]
docs = []
# pre-commit itself, plus grpcio-tools for the protobuf-drift hook (gen_proto.sh
# invokes grpc_tools.protoc).
precommit = [
  "pre-commit",
  "grpcio-tools",
]

[tool.uv]
default-groups = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beam_agents"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Generated protobuf bindings are committed but never hand-edited or linted.
extend-exclude = ["src/beam_agents/_protos/*_pb2.py", "src/beam_agents/_protos/*_pb2.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "PL", "RUF"]
ignore = [
  "PLR0913", # too many arguments — runtime call signatures are often wide
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]
# The package `__getattr__` resolves adapter classes lazily, on purpose: the
# adapters' framework dependencies are optional extras and `import beam_agents`
# must never import them. PLC0415 (imports not at top-level) is exactly what
# that design requires here.
"src/beam_agents/__init__.py" = ["PLC0415"]
# Beam's stateful-DoFn API *requires* state/timer handles to be declared as
# argument defaults (`state=beam.DoFn.StateParam(SPEC)`); B008 (no calls in
# defaults) is a false positive for this idiom.
"src/beam_agents/core/dofn.py" = ["B008"]
# DefaultSinkResolver.resolve() imports each IO client (Kafka/Pub/Sub/BigQuery)
# lazily, on purpose: AgentConfig.__post_init__ only calls validate(), which
# must stay import-free so sink-URI validation runs offline. PLC0415 (imports
# not at top-level) is exactly what that design requires here.
"src/beam_agents/core/transform.py" = ["PLC0415"]
# WriteIntents.__init__ parses/validates the outbox URI eagerly but must not
# import Kafka/Pub/Sub IO clients until expand() actually builds the writer;
# same PLC0415-is-the-point rationale as core/transform.py above.
"src/beam_agents/actions/write_intents.py" = ["PLC0415"]
# The OTLP exporter imports opentelemetry-proto (the optional `otlp` extra)
# inside the mapping/encoding functions, on purpose: sink-URI validation and
# `import beam_agents` must succeed without the extra installed, and the lazy
# import is what raises the actionable install-the-extra error at resolution.
# Same PLC0415-is-the-point rationale as core/transform.py above.
"src/beam_agents/observability/otlp.py" = ["PLC0415"]
# The effector's adapters import their client libraries (aiokafka, pubsub,
# redis, bigtable) inside the adapter constructor, on purpose: those are
# optional dependencies and `import beam_agents.effector` must succeed with
# none of them installed. Same PLC0415-is-the-point rationale as above.
"src/beam_agents/effector/sources.py" = ["PLC0415"]
"src/beam_agents/effector/sinks.py" = ["PLC0415"]
"src/beam_agents/effector/dedup.py" = ["PLC0415"]
# The e2e gate's harness: B008 is the same Beam RestrictionParam/
# WatermarkEstimatorParam-as-default idiom as core/dofn.py, and PLC0415 lazy
# aiokafka imports keep these modules importable in the offline lane (host
# side) and outside the pipeline (container side) without the client installed.
"tests/semantics/_e2e/*" = ["B008", "PLC0415"]
# The docs/errors.md failure-streak example, copied verbatim: the state handle
# is the same Beam-requires-it-as-a-default idiom as core/dofn.py, and the doc
# must show the working form rather than a lint-shaped variant of it.
"tests/examples/test_failure_streak_alarm.py" = ["B008"]
# The docs/continuous_eval.md example, copied verbatim: same state/timer
# handle-as-default idiom as above.
"tests/examples/test_continuous_eval.py" = ["B008"]
# The gate module itself: same lazy-aiokafka constraint (it is *collected* in
# the offline lane, where aiokafka is absent — deselection happens after
# import), and the single long test function is one scenario told in phases,
# not an abstraction failure.
"tests/semantics/test_effectively_once_e2e.py" = ["PLC0415", "PLR0912", "PLR0915"]
# The shared Flink-stack module: the same lazy-aiokafka constraint as the e2e
# harness it was extracted from (imported host-side in the offline lane, where
# aiokafka is absent).
"tests/semantics/_flink_stack.py" = ["PLC0415"]
# The conformance suite: lazy imports are the design — the LangGraph factory
# imports its optional framework only inside build functions (the module must
# import cleanly where the extra is absent, for clean skips), the Flink
# harness imports aiokafka lazily like the e2e harness, and the leg
# orchestration is one scenario told in phases.
"tests/conformance/*" = ["PLC0415", "PLR0915"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
enable_error_code = ["ignore-without-code"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "apache_beam.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "google.*"
ignore_missing_imports = true

# The effector's transport/dedup clients are optional dependencies (the
# `effector` extra) and are deliberately absent from the `ci` lane's environment,
# where mypy runs. Their lazy imports must not read as missing-module errors.
[[tool.mypy.overrides]]
module = ["aiokafka.*", "redis.*"]
ignore_missing_imports = true

# Generated protobuf stubs use bare `Mapping` in a few __init__ signatures,
# which trips strict `type-arg`. The gencode is never hand-edited, so we relax
# strict reporting for the generated package only.
[[tool.mypy.overrides]]
module = "beam_agents._protos.*"
disable_error_code = ["type-arg"]

# Apache Beam ships no type stubs, so every Beam call in a test reads as an
# untyped call under strict mode. Relax that one check for the coder tests that
# drive real pipelines; the rest of strict mode still applies.
[[tool.mypy.overrides]]
module = "tests.core.test_coders"
disable_error_code = ["no-untyped-call"]

# Same Beam-untyped-API relaxation for the metrics seam: Beam's metric cells
# (`inc`/`update`) and the test-side MetricsContainer/state-sampler helpers are
# all untyped.
[[tool.mypy.overrides]]
module = ["beam_agents.observability.metrics", "tests.core.test_dofn_metrics"]
disable_error_code = ["no-untyped-call"]

# Same Beam-untyped-API relaxation as beam_agents.core.transform (type-arg,
# no-any-return) for the KV-keying test helper and construction-time/sink
# tests exercising RunAgent/AgentConfig's PCollection-typed seams directly.
[[tool.mypy.overrides]]
module = "tests.core.test_transform"
disable_error_code = ["no-untyped-call", "type-arg", "no-any-return"]

# Same Beam-untyped-API relaxation, for WriteIntents' own pipeline-driving
# construction/order/dead-letter/resolver tests.
[[tool.mypy.overrides]]
module = "tests.actions.test_write_intents"
disable_error_code = ["no-untyped-call", "type-arg", "no-any-return"]

# Same Beam-untyped-API relaxation, for the live-broker Kafka round-trip test.
[[tool.mypy.overrides]]
module = "tests.actions.test_write_intents_integration"
disable_error_code = ["no-untyped-call", "type-arg", "no-any-return"]

# Same Beam-untyped-API relaxation, for the docs/errors.md failure-streak
# example: it is a plain downstream Beam pipeline (Create/Map/ParDo/assert_that)
# over the published errors format, so every call is a Beam one.
[[tool.mypy.overrides]]
module = "tests.examples.test_failure_streak_alarm"
disable_error_code = ["no-untyped-call", "type-arg", "no-any-return"]

# Same Beam-untyped-API relaxation, for the docs/continuous_eval.md example: a
# plain downstream Beam pipeline (TestStream/ParDo/WindowInto/CombinePerKey)
# over the published traces format, so every call is a Beam one.
[[tool.mypy.overrides]]
module = "tests.examples.test_continuous_eval"
disable_error_code = ["no-untyped-call", "type-arg", "no-any-return"]

# Beam types `Coder.from_type_hint` as `-> CoderT` (a cls-bound TypeVar), so our
# concrete override return trips the LSP `override` check — the same concrete
# pattern Beam's own subclasses (e.g. MapCoder) use. Suppress that one check for
# this module; the rest of strict mode still applies.
[[tool.mypy.overrides]]
module = "beam_agents.core.coders"
disable_error_code = ["override"]

# Beam's metrics API (`Metrics.counter(...).inc()`) ships no type annotations, so
# incrementing the soft-cap counter reads as an untyped call under strict mode.
# Suppress that one check for the facade; the rest of strict mode still applies.
[[tool.mypy.overrides]]
module = "beam_agents.memory.facade"
disable_error_code = ["no-untyped-call"]

# Same Beam-untyped-metrics relaxation for the LangGraph adapter's transport
# fallback counter.
[[tool.mypy.overrides]]
module = "beam_agents.adapters.langgraph.transport"
disable_error_code = ["no-untyped-call"]

# The LangGraph adapter tests drive LangGraph's four-parameter generics
# (StateGraph/CompiledStateGraph — spelling every parameter would obscure the
# scenarios) and, in the e2e module, Beam's untyped TestPipeline/TestStream/
# assert_that API — the same relaxations the other framework-driving test
# modules get. Everything else in these modules stays strictly typed.
[[tool.mypy.overrides]]
module = "tests.adapters.*"
disable_error_code = ["type-arg", "no-untyped-call"]

# The conformance matrix drives the same two untyped surfaces at once: Beam's
# TestPipeline/TestStream/assert_that API and LangGraph's unparameterized
# generics. Everything else in these modules stays strictly typed.
[[tool.mypy.overrides]]
module = "tests.conformance.*"
disable_error_code = ["type-arg", "no-untyped-call", "no-any-return"]

# Same Beam-untyped-metrics relaxation for the runtime metric recorder, which
# calls `inc`/`update` on Beam's delegating handles.
[[tool.mypy.overrides]]
module = "beam_agents.observability.metrics"
disable_error_code = ["no-untyped-call"]

# The stateful DoFn and its transform are the densest Beam surface in the repo:
# every state/timer/output call routes through Beam's untyped API, and Beam's
# generics (PTransform, TaggedOutput) ship without parameters. Relax those Beam-
# only checks for these two modules; the rest of strict mode still applies.
[[tool.mypy.overrides]]
module = "beam_agents.core.dofn"
disable_error_code = ["no-untyped-call", "type-arg"]

[[tool.mypy.overrides]]
module = "beam_agents.core.transform"
disable_error_code = ["no-untyped-call", "type-arg", "no-any-return"]

# Same Beam-untyped-API relaxation for the OTLP export DoFn/transform (ParDo,
# unparameterized PTransform/PCollection, untyped metric handles), plus the
# lazily-imported opentelemetry-proto constructors reading as Any.
[[tool.mypy.overrides]]
module = "beam_agents.observability.otlp"
disable_error_code = ["no-untyped-call", "type-arg", "no-any-return"]

# Beam's TestPipeline/Create are untyped; same relaxation the other
# pipeline-driving test modules get, for the exporter's dead-collector test.
[[tool.mypy.overrides]]
module = "tests.observability.test_otlp"
disable_error_code = ["no-untyped-call"]

# Same Beam-untyped-API relaxation as core/transform.py and core/dofn.py: every
# ParDo/PTransform/PubsubMessage call and Beam's unparameterized generics read
# as untyped/under-specified under strict mode.
[[tool.mypy.overrides]]
module = "beam_agents.actions.write_intents"
disable_error_code = ["no-untyped-call", "type-arg", "no-any-return", "no-untyped-def"]

# Beam's TestPipeline/TestStream/assert_that helpers are untyped, so every
# pipeline-driving test call reads as an untyped call under strict mode.
[[tool.mypy.overrides]]
module = [
    "tests.core.test_dofn_pipeline",
    "tests.core.test_dofn_streaming",
]
disable_error_code = ["no-untyped-call"]

# _dofn_helpers' `keyed()` returns a bare PCollection (Beam's own generic is
# unparameterized here too); same relaxation as beam_agents.core.transform.
[[tool.mypy.overrides]]
module = "tests.core._dofn_helpers"
disable_error_code = ["no-untyped-call", "type-arg", "no-any-return"]

# Same Beam-untyped-API relaxation as the stateful-DoFn pipeline/streaming
# tests, for the chaos helper's own pipeline-driving unit tests.
[[tool.mypy.overrides]]
module = "tests.testing.test_chaos"
disable_error_code = ["no-untyped-call"]

[[tool.mypy.overrides]]
module = "tests.semantics.test_retry_determinism"
disable_error_code = ["no-untyped-call"]

# The e2e gate and its harness drive Beam's untyped pipeline-construction API
# (ParDo/Map/Create/with_output_types) and generic PCollections — the same
# relaxation the other Beam-driving test modules get. Everything non-Beam in
# these modules stays strictly typed.
[[tool.mypy.overrides]]
module = "tests.semantics._e2e.*"
disable_error_code = ["no-untyped-call", "type-arg", "no-any-return"]

[[tool.mypy.overrides]]
module = "tests.semantics.test_effectively_once_e2e"
disable_error_code = ["no-untyped-call", "type-arg"]

[[tool.mypy.overrides]]
module = "tests.semantics.test_hitl_fail_closed"
disable_error_code = ["no-untyped-call"]

# Same Beam-untyped-API relaxation: this module drives `on_hitl` with fake
# state/timer handles and asserts on Beam's unparameterized TaggedOutput.
[[tool.mypy.overrides]]
module = "tests.core.test_dofn_hitl_timer"
disable_error_code = ["no-untyped-call", "type-arg"]

# The classic (non-async) Bigtable admin client used to provision the emulator's
# table ships no type annotations, so every setup call reads as untyped under
# strict mode. The store under test uses the typed async data client.
[[tool.mypy.overrides]]
module = "tests.effector.test_dedup_bigtable"
disable_error_code = ["no-untyped-call"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
timeout = 30
testpaths = ["tests"]
markers = [
  "integration: requires docker compose services (Redpanda, Redis, Flink)",
  "semantics: correctness/determinism gates",
  "dataflow: nightly-only tests against real Dataflow",
  "smoke: nightly-only real-provider smoke tests against live endpoints",
  "slow: tests that take longer than 5 seconds",
  "conformance_cell(adapter, scenario, leg): one adapter-conformance matrix cell (counted by the meta-test)",
]

[tool.coverage.run]
source = ["beam_agents"]
branch = true
# Generated protobuf bindings are never hand-edited (see the ruff/mypy
# overrides above); regenerating them shouldn't move the gated coverage number.
omit = ["*/_protos/*_pb2.py"]

[tool.coverage.report]
# Static floor under the branch-aware combined total (independent of the
# branch-rate ratchet in coverage-baseline.toml / scripts/coverage_ratchet.py):
# a hard backstop so coverage can't silently collapse if the ratchet step is
# ever skipped.
fail_under = 90

[tool.mutmut]
# Mutation scope is core/ ONLY. The killing test suite is tests/core, so a mutant
# anywhere else can only ever be reported as uncovered or survived — noise that
# costs a fork each and hides real core survivors. Extending mutation to model/,
# tools/, memory/, or actions/ requires giving each its own test selection first.
#
# source_paths deliberately stays at its default (src/): it controls both what is
# mutated AND what is copied into mutants/. Narrowing it to core/ would leave
# beam_agents.model, beam_agents.tools, etc. unimportable inside the mutant tree
# and break every core test. only_mutate filters mutation while the copied tree
# stays whole. do_not_mutate is redundant under the current only_mutate, but is
# the correct guard if that pattern ever widens.
#
# mutate_only_covered_lines is deliberately NOT set: it makes mutmut run pytest
# in-process under coverage.collect(), and apache-beam's numpy import then dies
# with "ImportError: cannot load module more than once per process". So mutants
# on lines no selected test executes are still generated and reported as
# "no tests" (currently 453, almost all in dofn.py and transform.py, whose test
# suites are deselected below). See docs/ci.md — that surface is outside
# mutation testing, and the gate ratchets the count so it cannot grow.
#
# Test selection is scoped for two reasons:
#   1. It keeps mutmut from running the package-surface test in
#      `tests/test_import.py`, which inspects `beam_agents/__init__.py` and
#      cannot pass while mutmut has instrumented it.
#   2. It deselects the Beam-pipeline tests. mutmut reaps children with
#      os.wait(), which also reaps Beam DirectRunner worker subprocesses and
#      crashes with a KeyError on the unexpected PID; the pipeline tests are also
#      far too slow to run once per mutant. The coder determinism/round-trip/
#      registration tests still cover every mutant in coders.py, and the async
#      bridge and loop driver are covered by the fast non-Beam unit tests
#      (test_bridge.py, test_loop.py). The mutation-gate tests are also excluded:
#      they exercise scripts/mutation_gate.py, which is intentionally outside
#      mutmut's copied src/ tree and cannot kill core mutants. The `-k` clause
#      drops coders.py's two TestPipeline tests; the other `--ignore`s drop the
#      stateful-DoFn pipeline, TestStream, and RunAgent-transform pipeline suites
#      for the same DirectRunner reason (test_transform.py also drives
#      TestPipeline/TestStream; its non-pipeline AgentConfig/SinkResolver unit
#      tests still cover transform.py's validation logic, just not under mutmut).
only_mutate = ["src/beam_agents/core/*"]
pytest_add_cli_args = ["--no-cov", "-p", "no:cacheprovider"]
do_not_mutate = ["*/_protos/*"]
pytest_add_cli_args_test_selection = [
  "tests/core",
  "--ignore=tests/core/test_dofn_pipeline.py",
  "--ignore=tests/core/test_dofn_streaming.py",
  "--ignore=tests/core/test_mutation_gate.py",
  "--ignore=tests/core/test_transform.py",
  "-k",
  "not shuffle_boundary and not group_by_key_key",
]
