[project]
name = "beam-agents"
version = "0.0.0"
description = "A runtime for protobuf-native, per-key-deterministic streaming agents on Apache Beam."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10,<3.13"
dependencies = [
  "apache-beam[gcp]>=2.60",
  "httpx[http2]",
  "pydantic>=2",
  "protobuf",
]

[dependency-groups]
dev = [
  { include-group = "test" },
  { include-group = "lint" },
  { include-group = "typecheck" },
  { include-group = "integration" },
  { include-group = "bench" },
  { include-group = "docs" },
  "pre-commit",
  "grpcio-tools",
]
test = [
  "pytest",
  "pytest-asyncio",
  "pytest-timeout",
  "pytest-cov",
  "hypothesis",
  "mutmut",
]
lint = [
  "ruff",
]
typecheck = [
  "mypy",
]
integration = [
  "testcontainers[kafka,redis]",
]
bench = [
  "pyperf",
]
docs = []

[tool.uv]
default-groups = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beam_agents"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "PL", "RUF"]
ignore = [
  "PLR0913", # too many arguments — runtime call signatures are often wide
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]
enable_error_code = ["ignore-without-code"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = "apache_beam.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --cov=beam_agents --cov-report=term-missing --cov-report=xml"
asyncio_mode = "auto"
timeout = 30
testpaths = ["tests"]
markers = [
  "integration: requires docker compose services (Redpanda, Redis, Flink)",
  "semantics: correctness/determinism gates",
  "dataflow: nightly-only tests against real Dataflow",
  "slow: tests that take longer than 5 seconds",
]

[tool.coverage.run]
source = ["beam_agents"]
branch = true
