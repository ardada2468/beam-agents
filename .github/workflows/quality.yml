name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen --group test --group lint --group typecheck

      - name: Run unit tests with coverage
        run: make test-unit

      - name: Coverage ratchet
        run: make coverage-ratchet

      - name: Check for core/ changes
        id: core-changed
        run: |
          if git diff --name-only origin/main...HEAD -- src/beam_agents/core | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mutation testing
        if: steps.core-changed.outputs.changed == 'true'
        run: make mutation
