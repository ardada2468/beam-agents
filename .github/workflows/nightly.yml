name: nightly

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mutation:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --group test

      - name: Mutation testing
        run: make mutation

  dataflow:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    if: vars.GCP_PROJECT_ID != ''
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install dependencies
        run: uv sync --locked --group test --group integration --group bench

      - name: Dataflow tests
        run: make test-dataflow
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

  skip-notice:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    if: vars.GCP_PROJECT_ID == ''
    steps:
      - name: No GCP project configured
        run: echo "GCP_PROJECT_ID is not set; skipping nightly Dataflow run."

  smoke:
    # secrets.* is not accessible in jobs.<job_id>.if (only github/needs/vars/inputs
    # are), so gating is done step-by-step below instead of at the job level.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: No provider credentials configured
        if: secrets.ANTHROPIC_API_KEY == '' && secrets.OPENAI_API_KEY == ''
        run: echo "Neither ANTHROPIC_API_KEY nor OPENAI_API_KEY is set; skipping nightly smoke run."

      - uses: actions/checkout@v4
        if: secrets.ANTHROPIC_API_KEY != '' || secrets.OPENAI_API_KEY != ''

      - uses: astral-sh/setup-uv@v5
        if: secrets.ANTHROPIC_API_KEY != '' || secrets.OPENAI_API_KEY != ''
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        if: secrets.ANTHROPIC_API_KEY != '' || secrets.OPENAI_API_KEY != ''
        run: uv sync --locked --group test

      - name: Real-provider smoke tests
        if: secrets.ANTHROPIC_API_KEY != '' || secrets.OPENAI_API_KEY != ''
        run: make test-smoke
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
