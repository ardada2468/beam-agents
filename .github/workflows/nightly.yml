name: nightly

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mutation:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --group test

      - name: Mutation testing
        run: make mutation

  # Release-blocking in the same sense as the mutation job: a red bench run
  # blocks tagging a release, not merging a PR. pyperf's methodology assumes a
  # quiet machine, so this never runs per-PR (design D3); `workflow_dispatch`
  # covers the on-demand "does this PR cost latency?" case. The sampling
  # parameters are the modules' pinned constants — no env knobs here, matching
  # the e2e gate's discipline.
  bench:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --group test --group bench

      - name: Benchmarks
        run: make bench

      - name: Benchmark gate
        run: make bench-gate

      # Stable artifact name: the release process attaches the most recent
      # green report (add-0-1-0-release consumes `benchmark-report`).
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: |
            bench-results/*.json
            bench-report.md
          if-no-files-found: error

  dataflow:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    if: vars.GCP_PROJECT_ID != ''
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install dependencies
        run: uv sync --locked --group test --group integration --group bench

      - name: Dataflow tests
        run: make test-dataflow
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}

  skip-notice:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    if: vars.GCP_PROJECT_ID == ''
    steps:
      - name: No GCP project configured
        run: echo "GCP_PROJECT_ID is not set; skipping nightly Dataflow run."

  smoke:
    # `secrets` is not a recognized named-value in `if:` at all (job- or
    # step-level) -- it's only usable in `env:`/`with:` mappings. Map it into
    # an env var on one step and compute a step *output* from that instead;
    # every other step gates on the output, which `if:` can reference.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Check for provider credentials
        id: creds
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -n "$ANTHROPIC_API_KEY" || -n "$OPENAI_API_KEY" ]]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No provider credentials configured
        if: steps.creds.outputs.has_creds == 'false'
        run: echo "Neither ANTHROPIC_API_KEY nor OPENAI_API_KEY is set; skipping nightly smoke run."

      - uses: actions/checkout@v4
        if: steps.creds.outputs.has_creds == 'true'

      - uses: astral-sh/setup-uv@v5
        if: steps.creds.outputs.has_creds == 'true'
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        if: steps.creds.outputs.has_creds == 'true'
        run: uv sync --locked --group test

      - name: Real-provider smoke tests
        if: steps.creds.outputs.has_creds == 'true'
        run: make test-smoke
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
