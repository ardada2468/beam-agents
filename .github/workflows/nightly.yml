name: nightly

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  mutation:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --group test

      - name: Mutation testing
        run: make mutation

  # Release-blocking in the same sense as the mutation job: a red bench run
  # blocks tagging a release, not merging a PR. pyperf's methodology assumes a
  # quiet machine, so this never runs per-PR (design D3); `workflow_dispatch`
  # covers the on-demand "does this PR cost latency?" case. The sampling
  # parameters are the modules' pinned constants — no env knobs here, matching
  # the e2e gate's discipline.
  bench:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --group test --group bench

      - name: Benchmarks
        run: make bench

      - name: Benchmark gate
        run: make bench-gate

      # Stable artifact name: the release process attaches the most recent
      # green report (add-0-1-0-release consumes `benchmark-report`).
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: |
            bench-results/*.json
            bench-report.md
          if-no-files-found: error

  # The `--update` compatibility gate (tests/dataflow/test_update_compat.py)
  # launches two sequential streaming jobs — the previous release, then head
  # replacing it in place — so the job window has to absorb two Dataflow
  # startups plus the previous release's venv provisioning. The test's own
  # budget is 35 minutes (docs/state-compat.md). The Flex Template gate
  # (tests/dataflow/test_flex_template_launch.py) adds its own 20-minute budget
  # in the same pytest run, plus the image build/push and template build below;
  # this is the outer bound over all of it.
  dataflow:
    timeout-minutes: 80
    runs-on: ubuntu-latest
    if: vars.GCP_PROJECT_ID != ''
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Install dependencies
        run: uv sync --locked --group test --group integration --group bench

      # --- the fraud-triage Flex Template: build, publish, then launch ---------
      #
      # This job already holds the only GCP credentials in CI, so the template
      # build lives here rather than behind a second credentialed surface
      # (design D6). Every artifact is addressed by the commit SHA that produced
      # it and no `latest` alias is published: nothing downstream should depend
      # on a moving nightly artifact while the package has no stable release.
      #
      # GCP_ARTIFACT_REGISTRY_REPO joins GCP_REGION and GCP_DATAFLOW_TEMP_BUCKET
      # as the variables the template half needs. Absent any of them these steps
      # are skipped and the launch test skips visibly for want of its spec — a
      # reported skip, never a deselection.
      - name: Template build configuration
        id: template
        if: vars.GCP_REGION != '' && vars.GCP_DATAFLOW_TEMP_BUCKET != '' && vars.GCP_ARTIFACT_REGISTRY_REPO != ''
        run: |
          image="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REGISTRY_REPO }}/fraud-flex:${GITHUB_SHA}"
          spec="gs://${{ vars.GCP_DATAFLOW_TEMP_BUCKET }}/templates/fraud-flex-${GITHUB_SHA}.json"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "spec=${spec}" >> "$GITHUB_OUTPUT"

      # A skipped `template` step leaves its outputs empty, so this one
      # condition covers "the template half is not configured" everywhere.
      - name: Build and push the template image
        if: steps.template.outputs.image != ''
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build \
            -f examples/fraud_triage_dataflow/Dockerfile \
            --build-arg "TEMPLATE_IMAGE=${{ steps.template.outputs.image }}" \
            -t "${{ steps.template.outputs.image }}" \
            .
          docker push "${{ steps.template.outputs.image }}"

      - name: Build the Flex Template spec
        if: steps.template.outputs.spec != ''
        run: |
          gcloud dataflow flex-template build "${{ steps.template.outputs.spec }}" \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --image="${{ steps.template.outputs.image }}" \
            --sdk-language=PYTHON \
            --metadata-file=examples/fraud_triage_dataflow/metadata.json

      # GCP_REGION and GCP_DATAFLOW_TEMP_BUCKET join GCP_PROJECT_ID as the
      # three variables the gate needs; absent any of them it skips visibly
      # (a reported skip, never a deselection — see Makefile test-dataflow).
      # The job-level `if:` still gates on GCP_PROJECT_ID alone, so a repo with
      # no GCP configuration keeps taking the skip-notice path unchanged.
      # BEAM_AGENTS_FLEX_TEMPLATE_SPEC hands the launch test the spec this run
      # just published — the gate validates *this commit's* packaging or it
      # skips, never a stale one.
      - name: Dataflow tests
        run: make test-dataflow
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_DATAFLOW_TEMP_BUCKET: ${{ vars.GCP_DATAFLOW_TEMP_BUCKET }}
          BEAM_AGENTS_FLEX_TEMPLATE_SPEC: ${{ steps.template.outputs.spec }}

  skip-notice:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    if: vars.GCP_PROJECT_ID == ''
    steps:
      - name: No GCP project configured
        run: echo "GCP_PROJECT_ID is not set; skipping nightly Dataflow run."

  smoke:
    # `secrets` is not a recognized named-value in `if:` at all (job- or
    # step-level) -- it's only usable in `env:`/`with:` mappings. Map it into
    # an env var on one step and compute a step *output* from that instead;
    # every other step gates on the output, which `if:` can reference.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Check for provider credentials
        id: creds
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [[ -n "$ANTHROPIC_API_KEY" || -n "$OPENAI_API_KEY" ]]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No provider credentials configured
        if: steps.creds.outputs.has_creds == 'false'
        run: echo "Neither ANTHROPIC_API_KEY nor OPENAI_API_KEY is set; skipping nightly smoke run."

      - uses: actions/checkout@v4
        if: steps.creds.outputs.has_creds == 'true'

      - uses: astral-sh/setup-uv@v5
        if: steps.creds.outputs.has_creds == 'true'
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        if: steps.creds.outputs.has_creds == 'true'
        run: uv sync --locked --group test

      - name: Real-provider smoke tests
        if: steps.creds.outputs.has_creds == 'true'
        run: make test-smoke
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
