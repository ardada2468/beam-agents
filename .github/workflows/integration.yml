name: integration

on:
  push:
    branches: [main]
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen --group test --group integration

      - name: Start local stack
        run: make compose-up

      - name: Integration tests
        run: make test-integration

      - name: Semantics tests
        run: make test-semantics

      - name: Stop local stack
        if: always()
        run: make compose-down
