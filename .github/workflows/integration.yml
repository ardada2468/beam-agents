name: integration

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    # The effectively-once end-to-end semantics gate runs a 10k-event chaos
    # scenario against the full compose stack (budgeted ≤ 15 min on its own),
    # on top of the integration suite.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --group test --group integration

      # `make compose-up` passes `--wait --build`: it builds the SDK-harness
      # image (which bakes in the current src/ and tests/) and blocks until
      # every service, including flink-jobserver, reports healthy.
      - name: Start local stack
        run: make compose-up

      - name: Integration tests
        run: make test-integration

      - name: Semantics tests (docker-backed)
        run: make test-semantics

      # Kept separate from test-semantics so an e2e-gate timeout and an
      # adapter-conformance failure are distinguishable in CI.
      - name: Adapter conformance matrix (Flink leg)
        run: make test-conformance-flink

      - name: Stop local stack
        if: always()
        run: make compose-down
