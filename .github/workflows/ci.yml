name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked --group lint --group typecheck --group test

      - name: Lint
        run: make lint

      - name: Type check
        run: make type

      - name: Unit tests
        run: make test-unit

      - name: Semantics tests (offline)
        run: make test-semantics-offline

      # The tier is split across two lanes (offline here, docker-backed in
      # integration.yml); this fails the build if any semantics-marked test
      # escapes both selections or either selection goes empty.
      - name: Semantics tier partition check
        run: uv run python scripts/check_semantics_partition.py
