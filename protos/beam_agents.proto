syntax = "proto3";

package beam_agents.v1;

// Wire and state message schemas for the beam-agents runtime.
//
// The top-level messages evolve together under one state_schema_version
// regime (see openspec design D1). Timestamps are int64 unix-epoch
// milliseconds (`*_ms` suffix) to match Beam's event-time representation and
// avoid well-known-type imports (D4). All enums carry an `_UNSPECIFIED = 0`
// zero value; the hottest fields occupy tag numbers 1-15 for single-byte tags.
//
// Schema evolution (the state-migration gate; see docs/state-migration.md):
// additive by default — new fields take new numbers, removals use `reserved`.
// A breaking change is permitted ONLY for the three versioned keyed-state
// messages (MemoryBlob, Continuation, LlmCacheBlob) and ONLY through the
// enforced path: bump CURRENT_STATE_SCHEMA_VERSION in
// src/beam_agents/core/migration.py, register a migration step for every
// versioned message, and freeze a golden corpus entry for the outgoing version
// (tests/core/golden/v<N>/) — CI's completeness tests are red until all three
// exist. An existing field number is never retyped or reused, at any version:
// migration runs after decode, so old bytes must always parse. The unversioned
// wire messages (ToolIntent, ToolResult, TraceEvent, AgentEnvelope,
// ActivationErrorRecord) cross service boundaries and stay additive-only with
// no bump escape hatch.

// Per-key working memory: bounded string->bytes entries with LRU metadata.
//
// Beam Python has no MapState, so bounded maps live inside this single-value
// blob. Entries are a repeated field (not a proto `map<>`) so LRU order is
// representable and encoding order is under our control. LRU eviction and the
// 100 KiB cap are enforced by runtime code, not this schema.
message MemoryBlob {
  // Single entry in the working-memory map.
  message MemoryEntry {
    string key = 1;
    bytes value = 2;
    int64 last_access_ms = 3;
  }

  uint32 state_schema_version = 1;
  repeated MemoryEntry entries = 2;
  // Cached sum of entry value sizes, for cheap 100 KiB cap checks without a
  // full re-serialize.
  int64 total_value_bytes = 3;
}

// Declarative side-effect request emitted by an activation.
//
// `intent_id` is a caller-computed uuid5 (deterministic); this schema only
// transports it and never computes or defaults it.
message ToolIntent {
  // What the effector does with this intent. Additive under
  // state_schema_version = 1: an intent written before this field existed
  // decodes as TOOL_KIND_UNSPECIFIED, which readers treat exactly like TOOL.
  // Only an explicit APPROVAL is routed to a human approval channel instead of
  // being executed.
  enum Kind {
    TOOL_KIND_UNSPECIFIED = 0;
    TOOL = 1;
    APPROVAL = 2;
  }

  // How `signature` was computed. Additive under state_schema_version = 1: an
  // intent written before the signature envelope existed decodes as
  // SIGNATURE_SCHEME_UNSPECIFIED with an empty `signature`, which readers
  // treat as unsigned (NOT as a signature that fails to verify). The enum is
  // the seam an asymmetric scheme lands on additively; a verifier that does
  // not recognize a scheme fails closed rather than ignoring it.
  enum SignatureScheme {
    SIGNATURE_SCHEME_UNSPECIFIED = 0;
    HMAC_SHA256 = 1;
  }

  string intent_id = 1;
  bytes entity_key = 2;
  int64 seq = 3;
  uint32 step_index = 4;
  string tool_name = 5;
  // Canonical JSON. The intent-ID determinism rule is defined over canonical
  // JSON, so args are transported as a string rather than google.protobuf.Struct
  // (which would mangle ints into doubles).
  string args_json = 6;
  int64 created_at_ms = 7;
  int64 expires_at_ms = 8;
  uint32 attempt = 9;
  Kind kind = 10;
  // The 16-byte trace identifier of the activation that staged this intent, so
  // the effector executes it inside the pipeline's trace. Transported, never
  // computed here — the same rule `intent_id` follows. Additive under
  // state_schema_version = 1: an intent written before this field existed
  // decodes as empty, which readers treat as "no trace correlation available".
  bytes trace_id = 11;

  // Signature envelope binding every field above to a key the pipeline holds,
  // so the effector can refuse an intent it did not mint before touching a
  // dedup store or a tool. Like `intent_id`, these are transported and never
  // computed here.
  //
  // The signature is defined over the deterministic serialization of THIS
  // message with all three signature fields cleared. That definition is what
  // makes the project's additive-evolution rule load-bearing rather than
  // merely tidy: every future `ToolIntent` field must take a number above all
  // existing ones, so a verifier on older bindings preserves it as an unknown
  // field and re-emits it after the known fields — matching the signer's
  // sorted-by-number layout, and keeping the signing input stable across
  // schema skew. Serializing the whole message also means a field added later
  // is covered by the signature by default, rather than silently falling
  // outside it.
  SignatureScheme signature_scheme = 12;
  // Names the key in the verifier's keyring, so rotation is: add the new key
  // to the effector, switch the signer's id, retire the old key after the
  // outbox retention window.
  string signing_key_id = 13;
  bytes signature = 14;
}

// Effector outcome, re-injected on the same key as the originating intent.
message ToolResult {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    OK = 1;
    ERROR = 2;
    EXPIRED = 3;
    REJECTED = 4;
  }

  string intent_id = 1;
  bytes entity_key = 2;
  int64 seq = 3;
  Status status = 4;
  bytes payload = 5;
  string error_message = 6;
  int64 completed_at_ms = 7;
}

// One observability record per activation step, aligned with OTel GenAI
// semantic-convention attribute names.
message TraceEvent {
  enum EventType {
    EVENT_TYPE_UNSPECIFIED = 0;
    ACTIVATION_START = 1;
    LLM_CALL = 2;
    TOOL_CALL = 3;
    INTENT_EMITTED = 4;
    ACTIVATION_END = 5;
    ERROR = 6;
    // Additive under state_schema_version = 1: proto3 enums are open, so a
    // reader that predates this value decodes it as the unrecognized number 7
    // rather than failing. `ACTIVATION_END` also carries the outcome as a
    // `beam_agents.activation.status` attribute, so such a reader still sees
    // that the activation suspended.
    SUSPENDED = 7;
  }

  // 16 bytes; `span_id`/`parent_span_id` are 8, matching the W3C
  // trace-context and OTel wire formats so an exporter passes them through
  // untranslated.
  bytes trace_id = 1;
  bytes span_id = 2;
  bytes parent_span_id = 3;
  bytes entity_key = 4;
  int64 seq = 5;
  uint32 step_index = 6;
  EventType event_type = 7;
  // Keyed by OTel GenAI semantic-convention names (e.g. `gen_ai.request.model`,
  // `gen_ai.usage.input_tokens`). Deterministic serialization sorts map entries.
  map<string, string> attributes = 8;
  int64 start_ms = 9;
  int64 end_ms = 10;
}

// The single keyed element type entering RunAgent. External events, tool
// results, and approvals are Flattened into one stream via the payload oneof.
message AgentEnvelope {
  // Human/automated approval decision for a pending intent (HITL).
  message Approval {
    string intent_id = 1;
    bool approved = 2;
    string approver = 3;
    int64 decided_at_ms = 4;
  }

  // An operator's in-band request for a `StateSnapshot` of this key. Handled
  // read-only by the stateful DoFn: it observes state at a well-defined point
  // in the key's serial history (no activation runs, no state is mutated, SEQ
  // is not incremented) and emits one snapshot on `.snapshots`.
  //
  // `request_id` is opaque and operator-chosen; the runtime only echoes it
  // into the emitted snapshot so a request can be correlated with its answer.
  message StateExportRequest {
    string request_id = 1;
  }

  bytes entity_key = 1;
  int64 event_time_ms = 2;
  oneof payload {
    // Opaque bytes: the runtime imposes no schema on external events.
    bytes external_event = 3;
    ToolResult tool_result = 4;
    Approval approval = 5;
    // Additive under state_schema_version = 1: an envelope written before this
    // variant existed decodes unchanged, and a reader that predates it sees an
    // unknown field rather than a parse failure.
    StateExportRequest export_request = 6;
  }
}

// A point-in-time image of one key's runtime state, emitted on `.snapshots` in
// answer to an `AgentEnvelope.StateExportRequest`.
//
// A wire message, not keyed state: it is never stored in a state cell, so it
// stays additive-only like the other wire messages (no bump escape hatch). Its
// own `state_schema_version` records the version of the *exporting* binary; the
// embedded blobs carry their own stamps verbatim as committed, because
// migration belongs to the loader (docs/replay.md), never to the export path.
message StateSnapshot {
  uint32 state_schema_version = 1;
  bytes entity_key = 2;
  // The key's SEQ counter at export: the seq the next activation would run at.
  int64 seq = 3;
  // The export request's `event_time_ms` — replay-deterministic, never a
  // wall-clock reading, so a retried bundle re-emits identical bytes.
  int64 snapshot_at_ms = 4;
  MemoryBlob memory = 5;
  LlmCacheBlob llm_cache = 6;
  // Present only when the key is suspended; absence (not a zero-valued
  // placeholder) is what distinguishes "not suspended" from "suspended at
  // step 0".
  Continuation continuation = 7;
  repeated ToolIntent pending = 8;
  // Echoed from the originating StateExportRequest.
  string request_id = 9;
}

// A `.errors` dead letter on the wire: the triage fields a downstream consumer
// needs without re-deriving them from the pipeline.
//
// For a message-bus errors sink this travels inside `AgentEnvelope.external_event`
// as deterministically serialized bytes, which makes the errors topic a valid
// RunAgent input stream. That wrapping is a convention of the errors sink, not a
// constraint on `AgentEnvelope`: `external_event` stays opaque bytes, and the
// runtime imposes no schema on it (see openspec design D1/D2 of
// add-errors-sink-encoding).
//
// `detail` is free-form, matching the `.errors` dataclass field it carries: the
// reason vocabulary is open-ended, and per-reason submessages would couple this
// schema to every future dead-letter source. Structured context (e.g. an intent
// dead letter's identifying fields) is JSON inside `detail`.
message ActivationErrorRecord {
  bytes entity_key = 1;
  // The dead-letter reason, e.g. `activation_error`, `activation_timeout`,
  // `orphaned_result`, `intent_dead_letter`.
  string reason = 2;
  string detail = 3;
  // Replay-deterministic: the element's event time, or a timer's scheduled
  // firing time. Never a wall-clock reading, so a retried bundle re-emits a
  // byte-identical record.
  int64 event_time_ms = 4;
}

// Persisted resume-state for a suspended activation. `snapshot` is opaque:
// adapters own their checkpoint format; the runtime only guarantees durable
// storage and correlation.
message Continuation {
  uint32 state_schema_version = 1;
  int64 seq = 2;
  uint32 step_index = 3;
  repeated string pending_intent_ids = 4;
  // Discriminator for the checkpoint format, e.g. "langgraph".
  string adapter = 5;
  bytes snapshot = 6;
  int64 suspended_at_ms = 7;
  int64 deadline_ms = 8;
  // Timeout escalations already performed for this suspension, bounding the
  // escalate route so the wait always ends. Additive under
  // state_schema_version = 1: a blob written before this field existed decodes
  // as 0.
  uint32 escalations = 9;
}

// Per-key LLM replay cache: bounded content-hash-keyed responses with LRU
// metadata, backing correctness invariant 3 (bundle retries make zero extra
// provider calls on the cached path).
//
// Like MemoryBlob, this is a single-value blob (Beam Python has no MapState).
// Entries are a repeated field, not a proto `map<>`, so LRU order is
// representable and encoding order is under our control. The 64-entry LRU
// bound, 6h TTL, and 100 KiB blob cap are enforced by runtime code, not this
// schema.
message LlmCacheBlob {
  // Single cached LLM response, keyed by a content hash of the request.
  message LlmCacheEntry {
    // 64-char lowercase hex sha256 of the canonical request material.
    string cache_key = 1;
    // Serialized provider response; empty when digest_only is set.
    bytes response = 2;
    // sha256 of the full response bytes, populated for every entry (including
    // digest-only ones) so retries can detect provider nondeterminism.
    bytes response_digest = 3;
    int64 created_at_ms = 4;
    int64 last_access_ms = 5;
    // True when the response was too large to store: the payload is dropped and
    // only response_digest is retained for divergence detection.
    bool digest_only = 6;
  }

  uint32 state_schema_version = 1;
  repeated LlmCacheEntry entries = 2;
  // Cached sum of stored response sizes, for cheap accounting without a full
  // re-serialize.
  int64 total_response_bytes = 3;
}

// One long-term memory row: the versioned envelope every MemoryStore backend
// stores byte-identically (serialized with deterministic=true), keyed by
// (entity_key, key) with entity_key carried as the backend's row/document key
// rather than inside the envelope. `seq` is additionally stored backend-
// natively (8-byte big-endian) so each backend's atomic primitive can enforce
// the "apply iff incoming seq >= stored seq" upsert guard without decoding
// this message. Additive: no existing message or field changes.
message LongTermRecord {
  uint32 state_schema_version = 1;
  // The record's name within its entity's namespace; non-empty.
  string key = 2;
  // Opaque agent-owned payload bytes.
  bytes value = 3;
  // The staging activation's per-key monotonic counter; the upsert guard.
  int64 seq = 4;
  // The staging activation's frozen clock (unix-epoch ms).
  int64 updated_at_ms = 5;
}
