services:
  redpanda:
    image: redpandadata/redpanda:v24.2.27@sha256:0dfbbae80ddb2e6d8fa4780a2adb9f8322ee38e0cc81bac1e6feac4345d56a13
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      # Two listeners: `internal` for clients on the compose network (the e2e
      # gate's outbox DoFn runs inside the beam-sdk-harness container and
      # reaches the broker as redpanda:9092), `external` for host-side clients
      # (tests connect to localhost:19092, unchanged).
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  pubsub-emulator:
    image: google/cloud-sdk@sha256:5fa0e7f1a6eadda7144614c3c6c737651e69fbd9b547a7e1372006ee5cc5e005
    command:
      - gcloud
      - beta
      - emulators
      - pubsub
      - start
      - --host-port=0.0.0.0:8085
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8085"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # The effector's Bigtable dedup store is exercised against the emulator: it
  # implements CheckAndMutateRow and the filter set the conditional claim
  # depends on, which is the part that has to be atomic for real.
  bigtable-emulator:
    image: google/cloud-sdk@sha256:5fa0e7f1a6eadda7144614c3c6c737651e69fbd9b547a7e1372006ee5cc5e005
    command:
      - gcloud
      - beta
      - emulators
      - bigtable
      - start
      - --host-port=0.0.0.0:8086
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8086"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # The long-term MemoryStore's Firestore backend is exercised against the
  # emulator: transactions are the backend's atomic upsert guard, which is the
  # part that has to hold for real.
  firestore-emulator:
    image: google/cloud-sdk@sha256:5fa0e7f1a6eadda7144614c3c6c737651e69fbd9b547a7e1372006ee5cc5e005
    command:
      - gcloud
      - beta
      - emulators
      - firestore
      - start
      - --host-port=0.0.0.0:8087
    ports:
      - "8087:8087"
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8087"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  flink-jobmanager:
    image: flink:1.19-scala_2.12-java17@sha256:5d55cb672e95515a671058fb6806455c1f748bb566da694a57564cdbb05b2733
    command: jobmanager
    ports:
      - "18081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/overview"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  flink-taskmanager:
    image: flink:1.19-scala_2.12-java17@sha256:5d55cb672e95515a671058fb6806455c1f748bb566da694a57564cdbb05b2733
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 2560m
        taskmanager.memory.jvm-metaspace.size: 1024m
    # The default 256m metaspace is not enough: every portable job submission
    # loads a fresh set of Beam/user classes into this TaskManager, and the
    # semantics gate submits and recovers jobs repeatedly. At the default the
    # TM dies with `OutOfMemoryError: Metaspace` after a handful of jobs, which
    # surfaces to the client as an unrelated-looking gRPC "Connection closing
    # while performing protocol negotiation" — a symptom worth not re-debugging.
    volumes:
      - beam-artifact-staging:/tmp/beam-artifact-staging
    deploy:
      resources:
        limits:
          memory: 3g

  # Beam's Flink job server: translates a portable Python pipeline and submits
  # it to the JobManager above. Nothing but the effectively-once end-to-end
  # semantics gate uses it; the rest of the suite never starts a Beam job.
  flink-jobserver:
    image: apache/beam_flink1.19_job_server:2.72.0@sha256:bc1606524053720f04db4298198c840be0fce33854e9778592f620b29ac18fef
    command:
      - --flink-master=flink-jobmanager:8081
      - --job-host=0.0.0.0
      - --job-port=8099
      - --artifact-port=8098
      - --expansion-port=8097
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    ports:
      - "18099:8099"
      - "18098:8098"
      - "18097:8097"
    # Staged artifacts are handed to the TaskManager as local file paths, so the
    # two must see the same directory or artifact retrieval fails with
    # "failed to retrieve chunk".
    volumes:
      - beam-artifact-staging:/tmp/beam-artifact-staging
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8099"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 2g

  # The Python SDK harness, run as an external worker pool.
  #
  # `network_mode: service:flink-taskmanager` is load-bearing, not incidental:
  # Beam hands the worker pool the TaskManager's endpoints as `localhost:<port>`,
  # so the pool only works inside the TaskManager's network namespace. A
  # consequence the chaos injectors must respect: killing the TaskManager
  # destroys the namespace this container borrows, so a TM kill has to restart
  # this service too.
  #
  # Built rather than pulled because the stock image cannot import this repo's
  # protobuf bindings (see docker/sdk-harness.Dockerfile), and because baking
  # the dependencies in avoids a pip install on every worker restart — which,
  # in a gate that kills workers on purpose, would be a flakiness source.
  beam-sdk-harness:
    build:
      context: ..
      dockerfile: docker/sdk-harness.Dockerfile
    image: beam-agents-sdk-harness:2.72.0
    command: ["--worker_pool"]
    network_mode: "service:flink-taskmanager"
    depends_on:
      flink-taskmanager:
        condition: service_started
    volumes:
      - beam-artifact-staging:/tmp/beam-artifact-staging
      # The e2e gate's ingest spool (design D9): the test process drains Kafka
      # into segment files here (host side), and the spool SDF replays them
      # from inside this container. Bind mount, not a named volume, because
      # the writer is the host-side pytest process.
      - ./e2e-spool:/var/beam-agents/spool
    deploy:
      resources:
        limits:
          memory: 2g

volumes:
  # Shared by flink-jobserver, flink-taskmanager, and beam-sdk-harness: the job
  # server writes staged artifacts here and hands the TaskManager local paths.
  beam-artifact-staging:
