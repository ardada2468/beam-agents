services:
  redpanda:
    image: redpandadata/redpanda:v24.2.27@sha256:0dfbbae80ddb2e6d8fa4780a2adb9f8322ee38e0cc81bac1e6feac4345d56a13
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:19092
    ports:
      - "19092:9092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  flink-jobmanager:
    image: flink:1.19-scala_2.12-java17@sha256:5d55cb672e95515a671058fb6806455c1f748bb566da694a57564cdbb05b2733
    command: jobmanager
    ports:
      - "18081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/overview"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  flink-taskmanager:
    image: flink:1.19-scala_2.12-java17@sha256:5d55cb672e95515a671058fb6806455c1f748bb566da694a57564cdbb05b2733
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
