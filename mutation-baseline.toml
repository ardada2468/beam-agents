# add-runtime-metrics moved dofn.py 267 -> 3, by far the largest move this file
# has seen. The metrics work needed the DoFn's *element* path driven outside a
# pipeline (a metric recorded on the async bridge thread is silently dropped by
# Beam, so the tally has to be staged and recorded on the Beam thread, and that
