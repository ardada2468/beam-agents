# 621 -> 624 over the same diff.
# Merge resolution (add-trace-events vs add-runtime-metrics): both changes
# independently drove `process`/`_start`/`_resume`/`_commit` with fake handles
# from inside the mutation selection — trace-events via
# test_dofn_failure_traces.py/test_dofn_commit.py, runtime-metrics via
