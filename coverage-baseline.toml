# Branch-coverage rate to beat, from coverage.xml's branch-rate attribute
# (generated protobuf omitted -- see [tool.coverage.run] omit in pyproject.toml).
# Ratcheted by hand: scripts/coverage_ratchet.py tells you to raise this when
# coverage improves, so a gain is locked in deliberately rather than silently.
#
# Merge resolution (add-reference-effector 0.9346 vs fix-hitl-ttl-preemption
# 0.9275): neither side's number survives the merge. Each was measured against
# its own tree, and the rate is a ratio over the whole project, so the combined
# tree has to be re-measured rather than have one side picked. 402/430 branches.
#
# Merge resolution (add-trace-events 0.9397 vs add-runtime-metrics 0.9369):
# same rule as above — the combined tree is re-measured, not picked from a
# side. The two changes' fake-handle DoFn suites overlap heavily (both drove
# `process`/`_start`/`_resume`/`_commit` for the first time), so the union is
# not additive. Measured on the combined tree: 0.9416.
#
# add-failure-context: 0.9418 (the wrapper and the enriched DoFn route are
# fully branch-covered by the loop and fake-handle suites).
#
# add-errors-sink-encoding: 0.9424 (the errors encoders are branch-free and
# fully covered, and threading `event_time_ms` through every `_dead_letter`
# call site brought core/dofn.py's remaining failure-exit branches in).
#
# add-langgraph-adapter: 0.9433 (the adapter package lands at 96% branch
# coverage — its remaining partials are contextvar/isinstance guards exercised
# only one way per test — pulling the project rate up).
#
# add-trace-exporters: 0.9491 (the OTLP mapping/DoFn, the sink-URI grammar,
# and the schema'd BigQuery writer arm are exercised by offline unit tests in
# the ci lane).
#
# Merge resolution (add-errors-sink-encoding 0.9424, add-langgraph-adapter
# 0.9433, add-trace-exporters 0.9491): same rule as the merges above — each
# number was measured against its own tree and the rate is a ratio over the
# whole project, so the combined tree is re-measured rather than having one
# side picked. Measured on the combined tree: 0.9484.
#
# add-state-schema-migration: 0.9497 (core/migration.py lands fully branch-
# covered by the registry suite, and routing the seven keyed-state reads
# through the hook added no uncovered branches).
#
# Merge resolution (the M2 batch: add-vllm-provider, add-longterm-memory-stores,
# add-adk-adapter, add-pydantic-ai-adapter, add-compaction-strategies,
# add-hot-key-sharding-guidance and the rest): same rule as every merge above —
# each number was measured against its own tree and the rate is a ratio over the
# whole project, so the combined tree is re-measured rather than having a side
# picked. Measured on the combined tree: 0.9015.
#
# This one moves DOWN, which no previous entry did, so the reason is recorded
# explicitly rather than left to be rediscovered. add-longterm-memory-stores
# ships four MemoryStore backends; three of them — memory/stores/{redis,
# bigtable,firestore}.py — sit at 0.00 branch coverage in THIS lane because
# every branch they own is inside a live-client call path. Their tests exist and
# are `integration`-marked (docker/emulator-backed), so the offline unit lane
# that produces this coverage.xml cannot reach them by construction; the
# in-memory and SQLAlchemy backends, which offline tests can drive, are covered.
# Together those three files contribute 16 uncovered branches, which is the
# whole of the 0.9497 -> 0.9015 move.
#
# Deliberately NOT worked around by omitting those modules from
# [tool.coverage.run]: the omit list is for generated protobuf only, and hiding
# hand-written backends would make their coverage permanently unmeasurable
# instead of merely lane-specific. Re-measure and raise this number when the
# integration lane's coverage is folded in, or when those backends gain offline
# call-shape tests that reach their branches.
#
# add-yaml-provider: 0.9028 (the YAML provider's reference grammar, config
# mapping, and row conversion are fully exercised by offline unit tests).
#
# add-adaptive-batching: 0.9066 (core/batching.py's flush predicates and
# resolution land fully branch-covered, and the buffer/flush/timer routes
# through core/dofn.py are driven by the fake-handle and TestStream suites).
#
# add-replay-cli: 0.9070 (the replay package's bundle/provider/diff/CLI paths and
# the DoFn's read-only export route are fully exercised by offline unit tests).
#
# Merge resolution (add-adaptive-batching 0.9066 vs add-replay-cli 0.9070): the
# standing rule above — each was measured against its own tree, so the combined
# tree is re-measured rather than having a side picked. Measured on the
# combined tree: 0.9103.
#
# add-token-budgets: the budget meter, BudgetExceeded routing, and the two new
# usage distributions are fully exercised by offline unit tests. Measured on
# the combined tree with add-replay-cli: 0.9118.
#
# add-effector-security: the signing/verification paths, the redaction helpers,
# and the effector's phase-zero dead-letter route are fully exercised by
# offline unit tests. Measured on the combined tree: 0.9164.
# THIS NUMBER IS SCOPED TO THE OFFLINE LANE. Do not raise it to a full-lane
# measurement.
#
# `.github/workflows/quality.yml` runs `make test-unit` and then
# `make coverage-ratchet`. `make test-unit` selects
# `not integration and not semantics and not dataflow and not smoke`, so the
# coverage.xml the ratchet reads NEVER contains integration coverage.
# scripts/coverage_ratchet.py compares that file's branch-rate against the value
# below. Raising this to a full-lane number therefore does not tighten the gate —
# it breaks it, permanently, with `branch coverage dropped from <full> to
# <offline>` on every subsequent run, for no defect.
#
# Measured on the full lane (offline + integration, i.e.
# `not semantics and not dataflow and not smoke and not spark`) during the
# verify-live-infrastructure run on 2026-07-31: **0.9358**. That is ~1.9 points
# above the offline lane, and it is the number the three live-client memory-store
# backends contribute once they are reachable — the movement the comment above
# anticipated ("Re-measure and raise this number when the integration lane's
# coverage is folded in"). Folding it in requires the ratcheted coverage.xml to
# come from the full lane, which is a workflow change: the quality job would need
# the compose services the integration lane depends on. Until that happens, this
# baseline stays offline-scoped and 0.9358 is recorded here as informational.
#
# close-core-mutation-gaps: 0.9180, still offline-scoped. The change adds no
# `src/`, so the gain is purely reached branches: the flush path's three failure
# exits, the store-lifecycle and summarizer wiring in `_activate`, `migrate_to_
# current`'s multi-step chain walk, and the construction-time rejections in
# `ActivationContext` were all previously reachable only from suites this lane
# deselects, or from no test at all.
#
# Merge resolution (add-console vs main, both 0.9180 measured on their own
# trees): the same rule as the two merge entries above — the rate is a ratio
# over the whole project, so neither side's number survives and the combined
# tree is re-measured rather than picked from a side. Measured on the merged
# tree: **0.9096**.
#
# The movement is dilution, not regression. No existing module lost a covered
# branch. The console is a large subsystem — 522 branches, and its own branch
# coverage is 88.7%, below the project mean the pre-merge number described. For
# scale that sits above `memory` (78.2%) and `model` (87.7%), both of which have
# been in this baseline for releases. A whole-project ratio moves when you add a
# well-tested component that is nonetheless below its average, and re-measuring
# is the only honest reading of that.
#
# The uncovered remainder is concentrated in the ingest sources and the HTTP
# sink's drop-and-count paths, which branch on transport failures the offline
# lane cannot produce — the same shape as the live-client memory-store gap
# described above, and it closes the same way: by folding the integration lane
# into the ratcheted coverage.xml.
branch_rate = 0.9096
