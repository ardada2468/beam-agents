<svg xmlns="http://www.w3.org/2000/svg" width="780" height="551" viewBox="0 0 600 424" role="img" aria-labelledby="dg-two-paths-through-runagent-title dg-two-paths-through-runagent-desc" preserveAspectRatio="xMidYMid meet"><style>svg{--paper:#ffffff;--paper-2:#f6f6f4;--paper-3:#edede9;--ink:#0b0c0e;--ink-2:#4a4e54;--ink-3:#63676d;--rule:#e2e2dd;--rule-2:#8e8e87;--s-output:#0b0c0e;--s-intents:#8a5205;--s-traces:#3c5c78;--s-errors:#9e2a18;--font-sans:'Instrument Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;--font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}.dg-line{fill: none; stroke: var(--rule-2); stroke-width: 1.25; marker-end: var(--dg-marker);}.dg-line--open{marker-end: none;}.dg-line--dashed{stroke-dasharray: 4 3;}.dg-node{fill: var(--paper); stroke: var(--ink); stroke-width: 1.25;}.dg-node--soft{fill: var(--paper-2); stroke: var(--rule-2); stroke-width: 1;}.dg-arrow{fill: var(--rule-2);}.dg-label{font-family: var(--font-mono); font-size: 11px; fill: var(--ink-2); letter-spacing: 0.01em;}.dg-label--title{font-family: var(--font-sans); font-size: 15px; font-weight: 600; fill: var(--ink); letter-spacing: -0.01em;}.dg-label--faint{font-family: var(--font-mono); font-size: 9.5px; fill: var(--ink-3); letter-spacing: 0.06em;}.dg-line--output{stroke: var(--s-output);}.dg-line--intents{stroke: var(--s-intents);}.dg-line--traces{stroke: var(--s-traces);}.dg-line--errors{stroke: var(--s-errors);}.dg-label--output{fill: var(--s-output);}.dg-label--intents{fill: var(--s-intents);}.dg-label--traces{fill: var(--s-traces);}.dg-label--errors{fill: var(--s-errors);}</style><rect x="0" y="0" width="600.0" height="424.0" fill="var(--paper)"/><title id="dg-two-paths-through-runagent-title">Two paths through RunAgent</title><desc id="dg-two-paths-through-runagent-desc">Two tracks. On the fast path a single activation of RunAgent at sequence number n consumes the event and runs to completion inside one process() call, emitting .output. On the re-injection path the first activation, also at sequence number n, stages a ToolIntent and suspends: it persists a Continuation into keyed state and yields, so the worker moves on. The intent leaves on .intents to the outbox topic, an effector running outside the pipeline executes it and deduplicates on the intent id, and the resulting tool result re-enters on the same key. A second activation rehydrates the continuation and runs with ctx.is_resume true and the same sequence number n, then emits .output. The sequence number is unchanged across the suspension, which is what keeps the replay-cache keys and the deterministic intent ids of the resumed activation continuing the first one&#x27;s numbering instead of colliding with it.</desc><defs><marker id="dg-two-paths-through-runagent-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L7,4 L0,7 z" class="dg-arrow"></path></marker></defs><g style="--dg-marker:url(#dg-two-paths-through-runagent-arrow)"><text x="16" y="40" text-anchor="start" class="dg-label--title">Fast path</text><text x="16" y="58" text-anchor="start" class="dg-label--faint">ONE ACTIVATION · ONE process() CALL</text><g><rect x="16" y="76" width="104" height="40" rx="2" class="dg-node dg-node--soft"></rect><text x="68" y="100" text-anchor="middle" class="dg-label">event</text></g><g><path d="M120,96 H144" class="dg-line"></path></g><g><rect x="148" y="72" width="160" height="48" rx="2" class="dg-node"></rect><text x="228" y="95" text-anchor="middle" class="dg-label">RunAgent</text><text x="228" y="109" text-anchor="middle" class="dg-label--faint">SEQ = N</text></g><g><path d="M308,96 H540" class="dg-line dg-line--output"></path></g><text x="424" y="88" text-anchor="middle" class="dg-label--faint">RUNS TO COMPLETION</text><text x="548" y="100" text-anchor="start" class="dg-label dg-label--output">.output</text><text x="16" y="166" text-anchor="start" class="dg-label--title">Re-injection path</text><text x="16" y="184" text-anchor="start" class="dg-label--faint">TWO ACTIVATIONS, ONE UNIT OF WORK</text><g><rect x="148" y="204" width="160" height="40" rx="2" class="dg-node dg-node--soft"></rect><text x="228" y="223" text-anchor="middle" class="dg-label">Continuation</text><text x="228" y="237" text-anchor="middle" class="dg-label--faint">KEYED STATE</text></g><g><rect x="16" y="276" width="104" height="40" rx="2" class="dg-node dg-node--soft"></rect><text x="68" y="300" text-anchor="middle" class="dg-label">event</text></g><g><path d="M120,296 H144" class="dg-line"></path></g><g><rect x="148" y="272" width="160" height="48" rx="2" class="dg-node"></rect><text x="228" y="295" text-anchor="middle" class="dg-label">RunAgent</text><text x="228" y="309" text-anchor="middle" class="dg-label--faint">SEQ = N · SUSPENDS</text></g><g><path d="M180,272 V248" class="dg-line"></path></g><text x="188" y="262" text-anchor="start" class="dg-label--faint">PERSISTS</text><g><path d="M308,224 H408 Q424,224 424,240 V268" class="dg-line"></path></g><text x="366" y="216" text-anchor="start" class="dg-label--faint">REHYDRATED</text><g><rect x="356" y="272" width="160" height="48" rx="2" class="dg-node"></rect><text x="436" y="295" text-anchor="middle" class="dg-label">RunAgent</text><text x="436" y="309" text-anchor="middle" class="dg-label--faint">SEQ = N · IS_RESUME</text></g><g><path d="M516,296 H540" class="dg-line dg-line--output"></path></g><text x="548" y="300" text-anchor="start" class="dg-label dg-label--output">.output</text><g><path d="M228,320 V352" class="dg-line dg-line--dashed dg-line--intents"></path></g><text x="236" y="342" text-anchor="start" class="dg-label dg-label--intents">.intents</text><text x="16" y="382" text-anchor="start" class="dg-label--faint">OUTSIDE THE PIPELINE</text><g><rect x="148" y="356" width="160" height="44" rx="2" class="dg-node"></rect><text x="228" y="377" text-anchor="middle" class="dg-label">outbox topic</text><text x="228" y="391" text-anchor="middle" class="dg-label--faint">KAFKA / PUB-SUB</text></g><g><path d="M308,378 H344" class="dg-line dg-line--dashed dg-line--intents"></path></g><g><rect x="356" y="356" width="160" height="44" rx="2" class="dg-node"></rect><text x="436" y="377" text-anchor="middle" class="dg-label">effector</text><text x="436" y="391" text-anchor="middle" class="dg-label--faint">DEDUPES ON INTENT_ID</text></g><g><path d="M436,356 V324" class="dg-line dg-line--dashed"></path></g><text x="428" y="342" text-anchor="end" class="dg-label">tool result</text></g></svg>
