<svg xmlns="http://www.w3.org/2000/svg" width="806" height="598" viewBox="0 0 620 460" role="img" aria-labelledby="dg-what-a-dead-letter-looks-like-on-the-errors-topic-title dg-what-a-dead-letter-looks-like-on-the-errors-topic-desc" preserveAspectRatio="xMidYMid meet"><style>svg{--paper:#0c0d0f;--paper-2:#141618;--paper-3:#1c1f22;--ink:#ededea;--ink-2:#a7abb0;--ink-3:#8f949a;--rule:#262a2e;--rule-2:#5f666d;--s-output:#ededea;--s-intents:#e0a458;--s-traces:#9bbcdd;--s-errors:#ee9683;--font-sans:'Instrument Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;--font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}.dg-line{fill: none; stroke: var(--rule-2); stroke-width: 1.25; marker-end: var(--dg-marker);}.dg-line--open{marker-end: none;}.dg-line--dashed{stroke-dasharray: 4 3;}.dg-node{fill: var(--paper); stroke: var(--ink); stroke-width: 1.25;}.dg-node--soft{fill: var(--paper-2); stroke: var(--rule-2); stroke-width: 1;}.dg-arrow{fill: var(--rule-2);}.dg-label{font-family: var(--font-mono); font-size: 11px; fill: var(--ink-2); letter-spacing: 0.01em;}.dg-label--title{font-family: var(--font-sans); font-size: 15px; font-weight: 600; fill: var(--ink); letter-spacing: -0.01em;}.dg-label--faint{font-family: var(--font-mono); font-size: 9.5px; fill: var(--ink-3); letter-spacing: 0.06em;}.dg-line--output{stroke: var(--s-output);}.dg-line--intents{stroke: var(--s-intents);}.dg-line--traces{stroke: var(--s-traces);}.dg-line--errors{stroke: var(--s-errors);}.dg-label--output{fill: var(--s-output);}.dg-label--intents{fill: var(--s-intents);}.dg-label--traces{fill: var(--s-traces);}.dg-label--errors{fill: var(--s-errors);}</style><rect x="0" y="0" width="620.0" height="460.0" fill="var(--paper)"/><title id="dg-what-a-dead-letter-looks-like-on-the-errors-topic-title">What a dead letter looks like on the errors topic</title><desc id="dg-what-a-dead-letter-looks-like-on-the-errors-topic-desc">One record on the errors topic is a key-value pair. The key is the failing entity_key, so one key&#x27;s dead letters keep their order through a single partition; the value is a serialized AgentEnvelope. That envelope carries three fields: entity_key, the failing key; event_time_ms, the record&#x27;s event time; and external_event, which holds a serialized ActivationErrorRecord. The nested record carries four fields of its own: entity_key, again the failing key; reason, one of the reasons listed below; detail, free-form context for the reason; and event_time_ms, which is the element&#x27;s event time or a timer&#x27;s scheduled firing time, never a wall clock.</desc><defs><marker id="dg-what-a-dead-letter-looks-like-on-the-errors-topic-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L7,4 L0,7 z" class="dg-arrow"></path></marker></defs><g style="--dg-marker:url(#dg-what-a-dead-letter-looks-like-on-the-errors-topic-arrow)"><text x="18" y="22" text-anchor="start" class="dg-label--faint">ONE RECORD ON THE ERRORS TOPIC</text><g><rect x="18" y="32" width="180" height="44" rx="2" class="dg-node dg-node--soft"></rect><text x="108" y="53" text-anchor="middle" class="dg-label">key</text><text x="108" y="67" text-anchor="middle" class="dg-label--faint">ENTITY_KEY</text></g><g><rect x="216" y="32" width="180" height="44" rx="2" class="dg-node dg-node--soft"></rect><text x="306" y="53" text-anchor="middle" class="dg-label">value</text><text x="306" y="67" text-anchor="middle" class="dg-label--faint">PROTOBUF BYTES</text></g><g><path d="M306,76 V106" class="dg-line"></path></g><g><rect x="216" y="110" width="180" height="48" rx="2" class="dg-node"></rect><text x="306" y="138" text-anchor="middle" class="dg-label">AgentEnvelope</text></g><g><path d="M306,158 V180" class="dg-line dg-line--open"></path></g><g><path d="M108,180 H504" class="dg-line dg-line--open"></path></g><g><path d="M108,180 V206" class="dg-line"></path></g><g><path d="M306,180 V206" class="dg-line"></path></g><g><path d="M504,180 V206" class="dg-line"></path></g><g><rect x="18" y="210" width="180" height="44" rx="2" class="dg-node dg-node--soft"></rect><text x="108" y="231" text-anchor="middle" class="dg-label">entity_key</text><text x="108" y="245" text-anchor="middle" class="dg-label--faint">THE FAILING KEY</text></g><g><rect x="216" y="210" width="180" height="44" rx="2" class="dg-node dg-node--soft"></rect><text x="306" y="231" text-anchor="middle" class="dg-label">event_time_ms</text><text x="306" y="245" text-anchor="middle" class="dg-label--faint">THE RECORD&#x27;S EVENT TIME</text></g><g><rect x="414" y="210" width="180" height="44" rx="2" class="dg-node"></rect><text x="504" y="231" text-anchor="middle" class="dg-label">external_event</text><text x="504" y="245" text-anchor="middle" class="dg-label--faint">SERIALIZED RECORD</text></g><g><path d="M504,254 V302 Q504,318 488,318 H416" class="dg-line dg-line--errors"></path></g><g><rect x="200" y="294" width="212" height="48" rx="2" class="dg-node"></rect><text x="306" y="322" text-anchor="middle" class="dg-label dg-label--errors">ActivationErrorRecord</text></g><g><path d="M306,342 V364" class="dg-line dg-line--open"></path></g><g><path d="M86,364 H527" class="dg-line dg-line--open"></path></g><g><path d="M86,364 V390" class="dg-line"></path></g><g><path d="M233,364 V390" class="dg-line"></path></g><g><path d="M380,364 V390" class="dg-line"></path></g><g><path d="M527,364 V390" class="dg-line"></path></g><g><rect x="18" y="394" width="136" height="44" rx="2" class="dg-node dg-node--soft"></rect><text x="86" y="415" text-anchor="middle" class="dg-label">entity_key</text><text x="86" y="429" text-anchor="middle" class="dg-label--faint">THE FAILING KEY</text></g><g><rect x="165" y="394" width="136" height="44" rx="2" class="dg-node dg-node--soft"></rect><text x="233" y="415" text-anchor="middle" class="dg-label">reason</text><text x="233" y="429" text-anchor="middle" class="dg-label--faint">ONE OF THE REASONS</text></g><g><rect x="312" y="394" width="136" height="44" rx="2" class="dg-node dg-node--soft"></rect><text x="380" y="415" text-anchor="middle" class="dg-label">detail</text><text x="380" y="429" text-anchor="middle" class="dg-label--faint">MAY BE EMPTY</text></g><g><rect x="459" y="394" width="136" height="44" rx="2" class="dg-node dg-node--soft"></rect><text x="527" y="415" text-anchor="middle" class="dg-label">event_time_ms</text><text x="527" y="429" text-anchor="middle" class="dg-label--faint">NEVER A WALL CLOCK</text></g></g></svg>
