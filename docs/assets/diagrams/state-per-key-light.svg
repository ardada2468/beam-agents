<svg xmlns="http://www.w3.org/2000/svg" width="780" height="751" viewBox="0 0 600 578" role="img" aria-labelledby="dg-what-one-entity-key-holds-title dg-what-one-entity-key-holds-desc" preserveAspectRatio="xMidYMid meet"><style>svg{--paper:#ffffff;--paper-2:#f6f6f4;--paper-3:#edede9;--ink:#0b0c0e;--ink-2:#4a4e54;--ink-3:#63676d;--rule:#e2e2dd;--rule-2:#8e8e87;--s-output:#0b0c0e;--s-intents:#8a5205;--s-traces:#3c5c78;--s-errors:#9e2a18;--font-sans:'Instrument Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;--font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}.dg-line{fill: none; stroke: var(--rule-2); stroke-width: 1.25; marker-end: var(--dg-marker);}.dg-line--open{marker-end: none;}.dg-line--dashed{stroke-dasharray: 4 3;}.dg-node{fill: var(--paper); stroke: var(--ink); stroke-width: 1.25;}.dg-node--soft{fill: var(--paper-2); stroke: var(--rule-2); stroke-width: 1;}.dg-arrow{fill: var(--rule-2);}.dg-label{font-family: var(--font-mono); font-size: 11px; fill: var(--ink-2); letter-spacing: 0.01em;}.dg-label--title{font-family: var(--font-sans); font-size: 15px; font-weight: 600; fill: var(--ink); letter-spacing: -0.01em;}.dg-label--faint{font-family: var(--font-mono); font-size: 9.5px; fill: var(--ink-3); letter-spacing: 0.06em;}.dg-line--output{stroke: var(--s-output);}.dg-line--intents{stroke: var(--s-intents);}.dg-line--traces{stroke: var(--s-traces);}.dg-line--errors{stroke: var(--s-errors);}.dg-label--output{fill: var(--s-output);}.dg-label--intents{fill: var(--s-intents);}.dg-label--traces{fill: var(--s-traces);}.dg-label--errors{fill: var(--s-errors);}</style><rect x="0" y="0" width="600.0" height="578.0" fill="var(--paper)"/><title id="dg-what-one-entity-key-holds-title">What one entity key holds</title><desc id="dg-what-one-entity-key-holds-desc">The runtime is a single Beam stateful DoFn. Each entity key owns five state cells: MEMORY, a read-modify-write cell holding working memory as one MemoryBlob; CONTINUATION, a read-modify-write cell holding where a suspended activation resumes; LLM_CACHE, a read-modify-write cell holding the bounded replay cache; PENDING, a bag of tool intents waiting for an answer; and SEQ, a combining sum counting activations committed on that key. Two timers hang off the same key, and they run on different clocks. TTL_TIMER is in the event-time (watermark) domain, is re-armed on every commit, fires when the watermark passes its mark, and wipes all five cells for that key. HITL_TIMER is in the real-time (processing-time) domain, is set when a key suspends, fires when real time passes the suspension deadline, and hands the wait to the HITL policy.</desc><defs><marker id="dg-what-one-entity-key-holds-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L7,4 L0,7 z" class="dg-arrow"></path></marker></defs><g style="--dg-marker:url(#dg-what-one-entity-key-holds-arrow)"><text x="14" y="18" text-anchor="start" class="dg-label--faint">FIVE STATE CELLS · ONE SET PER ENTITY KEY</text><g><g><rect x="14" y="32" width="196" height="42" rx="2" class="dg-node"></rect><text x="112" y="52" text-anchor="middle" class="dg-label">MEMORY</text><text x="112" y="66" text-anchor="middle" class="dg-label--faint">READ-MODIFY-WRITE</text></g><text x="224" y="57" text-anchor="start" class="dg-label">working memory, one MemoryBlob</text></g><g><g><rect x="14" y="84" width="196" height="42" rx="2" class="dg-node"></rect><text x="112" y="104" text-anchor="middle" class="dg-label">CONTINUATION</text><text x="112" y="118" text-anchor="middle" class="dg-label--faint">READ-MODIFY-WRITE</text></g><text x="224" y="109" text-anchor="start" class="dg-label">where a suspended activation resumes</text></g><g><g><rect x="14" y="136" width="196" height="42" rx="2" class="dg-node"></rect><text x="112" y="156" text-anchor="middle" class="dg-label">LLM_CACHE</text><text x="112" y="170" text-anchor="middle" class="dg-label--faint">READ-MODIFY-WRITE</text></g><text x="224" y="161" text-anchor="start" class="dg-label">the bounded replay cache</text></g><g><g><rect x="14" y="188" width="196" height="42" rx="2" class="dg-node"></rect><text x="112" y="208" text-anchor="middle" class="dg-label">PENDING</text><text x="112" y="222" text-anchor="middle" class="dg-label--faint">BAG</text></g><text x="224" y="213" text-anchor="start" class="dg-label">tool intents waiting for an answer</text></g><g><g><rect x="14" y="240" width="196" height="42" rx="2" class="dg-node"></rect><text x="112" y="260" text-anchor="middle" class="dg-label">SEQ</text><text x="112" y="274" text-anchor="middle" class="dg-label--faint">COMBINING SUM</text></g><text x="224" y="265" text-anchor="start" class="dg-label">activations committed on this key</text></g><g><path d="M14,302 H586" class="dg-line dg-line--open"></path></g><text x="14" y="326" text-anchor="start" class="dg-label--faint">TWO TIMERS · SET FROM THE COMMIT, FIRED OUTSIDE ANY ACTIVATION</text><g><text x="14" y="348" text-anchor="start" class="dg-label">EVENT TIME</text><text x="96" y="348" text-anchor="start" class="dg-label--faint">WATERMARK DOMAIN</text><g><path d="M14,384 H586" class="dg-line"></path></g><g><rect x="14" y="362" width="200" height="44" rx="2" class="dg-node"></rect><text x="114" y="383" text-anchor="middle" class="dg-label">TTL_TIMER</text><text x="114" y="397" text-anchor="middle" class="dg-label--faint">RE-ARMED ON EVERY COMMIT</text></g><g><path d="M430,375 V393" class="dg-line dg-line--open"></path></g><text x="430" y="369" text-anchor="middle" class="dg-label--faint">TTL MARK</text><text x="14" y="424" text-anchor="start" class="dg-label--faint">fires when the watermark passes the mark</text><text x="14" y="436" text-anchor="start" class="dg-label--faint">wipes every cell above, for that key</text></g><g><text x="14" y="470" text-anchor="start" class="dg-label">REAL TIME</text><text x="96" y="470" text-anchor="start" class="dg-label--faint">PROCESSING-TIME DOMAIN</text><g><path d="M14,506 H586" class="dg-line"></path></g><g><rect x="14" y="484" width="200" height="44" rx="2" class="dg-node"></rect><text x="114" y="505" text-anchor="middle" class="dg-label">HITL_TIMER</text><text x="114" y="519" text-anchor="middle" class="dg-label--faint">SET WHEN A KEY SUSPENDS</text></g><g><path d="M430,497 V515" class="dg-line dg-line--open"></path></g><text x="430" y="491" text-anchor="middle" class="dg-label--faint">SUSPENSION DEADLINE</text><text x="14" y="546" text-anchor="start" class="dg-label--faint">fires when real time passes the deadline</text><text x="14" y="558" text-anchor="start" class="dg-label--faint">hands the wait to the HITL policy</text></g></g></svg>
