<svg xmlns="http://www.w3.org/2000/svg" width="806" height="582" viewBox="0 0 620 448" role="img" aria-labelledby="dg-how-an-element-level-failure-reaches-errors-title dg-how-an-element-level-failure-reaches-errors-desc" preserveAspectRatio="xMidYMid meet"><style>svg{--paper:#ffffff;--paper-2:#f6f6f4;--paper-3:#edede9;--ink:#0b0c0e;--ink-2:#4a4e54;--ink-3:#63676d;--rule:#e2e2dd;--rule-2:#8e8e87;--s-output:#0b0c0e;--s-intents:#8a5205;--s-traces:#3c5c78;--s-errors:#9e2a18;--font-sans:'Instrument Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;--font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}.dg-line{fill: none; stroke: var(--rule-2); stroke-width: 1.25; marker-end: var(--dg-marker);}.dg-line--open{marker-end: none;}.dg-line--dashed{stroke-dasharray: 4 3;}.dg-node{fill: var(--paper); stroke: var(--ink); stroke-width: 1.25;}.dg-node--soft{fill: var(--paper-2); stroke: var(--rule-2); stroke-width: 1;}.dg-arrow{fill: var(--rule-2);}.dg-label{font-family: var(--font-mono); font-size: 11px; fill: var(--ink-2); letter-spacing: 0.01em;}.dg-label--title{font-family: var(--font-sans); font-size: 15px; font-weight: 600; fill: var(--ink); letter-spacing: -0.01em;}.dg-label--faint{font-family: var(--font-mono); font-size: 9.5px; fill: var(--ink-3); letter-spacing: 0.06em;}.dg-line--output{stroke: var(--s-output);}.dg-line--intents{stroke: var(--s-intents);}.dg-line--traces{stroke: var(--s-traces);}.dg-line--errors{stroke: var(--s-errors);}.dg-label--output{fill: var(--s-output);}.dg-label--intents{fill: var(--s-intents);}.dg-label--traces{fill: var(--s-traces);}.dg-label--errors{fill: var(--s-errors);}</style><rect x="0" y="0" width="620.0" height="448.0" fill="var(--paper)"/><title id="dg-how-an-element-level-failure-reaches-errors-title">How an element-level failure reaches .errors</title><desc id="dg-how-an-element-level-failure-reaches-errors-desc">Two activations in the same Beam bundle. In the first, an AgentEnvelope for key k enters RunAgent, the activation fails, and the atomic commit writes nothing: no working-memory write, no .intents element, and no .output element. A single dead letter leaves on .errors instead — routed, not raised as a bundle failure. In the second, an AgentEnvelope for key j runs in the same bundle, its commit goes through, and it writes state and emits .output as usual. The failure of the first key neither fails the bundle nor affects the second.</desc><defs><marker id="dg-how-an-element-level-failure-reaches-errors-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L7,4 L0,7 z" class="dg-arrow"></path></marker></defs><g style="--dg-marker:url(#dg-how-an-element-level-failure-reaches-errors-arrow)"><g><path d="M30,42 H14 V430 H30" class="dg-line dg-line--open"></path></g><text x="14" y="32" text-anchor="start" class="dg-label--faint">ONE BUNDLE</text><g><rect x="34" y="42" width="118" height="44" rx="2" class="dg-node dg-node--soft"></rect><text x="93" y="63" text-anchor="middle" class="dg-label">AgentEnvelope</text><text x="93" y="77" text-anchor="middle" class="dg-label--faint">KEY k</text></g><g><path d="M152,64 H176" class="dg-line"></path></g><g><rect x="180" y="38" width="146" height="52" rx="2" class="dg-node"></rect><text x="253" y="63" text-anchor="middle" class="dg-label">RunAgent</text><text x="253" y="77" text-anchor="middle" class="dg-label--faint">ACTIVATION FOR KEY k</text></g><g><path d="M326,64 H386" class="dg-line"></path><text x="356" y="54" text-anchor="middle" class="dg-label--faint">FAILS</text></g><g><rect x="390" y="34" width="148" height="60" rx="2" class="dg-node"></rect><text x="464" y="63" text-anchor="middle" class="dg-label">atomic commit</text><text x="464" y="77" text-anchor="middle" class="dg-label--faint">NOTHING COMMITS</text></g><g><path d="M464,94 V150" class="dg-line dg-line--errors"></path></g><g><rect x="376" y="154" width="176" height="52" rx="2" class="dg-node"></rect><text x="464" y="179" text-anchor="middle" class="dg-label dg-label--errors">.errors</text><text x="464" y="193" text-anchor="middle" class="dg-label--faint">ONE DEAD LETTER</text></g><text x="464" y="228" text-anchor="middle" class="dg-label dg-label--errors">routed, not raised</text><g><path d="M464,118 H104 V150" class="dg-line"></path></g><g><rect x="38" y="154" width="132" height="32" rx="2" class="dg-node dg-node--soft"></rect><text x="104" y="174" text-anchor="middle" class="dg-label">no memory write</text></g><g><rect x="38" y="186" width="132" height="32" rx="2" class="dg-node dg-node--soft"></rect><text x="104" y="206" text-anchor="middle" class="dg-label">no .intents</text></g><g><rect x="38" y="218" width="132" height="32" rx="2" class="dg-node dg-node--soft"></rect><text x="104" y="238" text-anchor="middle" class="dg-label">no .output</text></g><g><rect x="34" y="298" width="118" height="44" rx="2" class="dg-node dg-node--soft"></rect><text x="93" y="319" text-anchor="middle" class="dg-label">AgentEnvelope</text><text x="93" y="333" text-anchor="middle" class="dg-label--faint">KEY j</text></g><g><path d="M152,320 H176" class="dg-line"></path></g><g><rect x="180" y="294" width="146" height="52" rx="2" class="dg-node"></rect><text x="253" y="319" text-anchor="middle" class="dg-label">RunAgent</text><text x="253" y="333" text-anchor="middle" class="dg-label--faint">ACTIVATION FOR KEY j</text></g><g><path d="M326,320 H386" class="dg-line"></path></g><g><rect x="390" y="290" width="148" height="60" rx="2" class="dg-node"></rect><text x="464" y="319" text-anchor="middle" class="dg-label">atomic commit</text><text x="464" y="333" text-anchor="middle" class="dg-label--faint">STATE AND OUTPUTS</text></g><g><path d="M464,350 V378" class="dg-line dg-line--output"></path></g><g><rect x="376" y="382" width="176" height="44" rx="2" class="dg-node"></rect><text x="464" y="403" text-anchor="middle" class="dg-label dg-label--output">.output</text><text x="464" y="417" text-anchor="middle" class="dg-label--faint">AND MEMORY WRITE</text></g></g></svg>
