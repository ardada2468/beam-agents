<svg xmlns="http://www.w3.org/2000/svg" width="780" height="702" viewBox="0 0 600 540" role="img" aria-labelledby="dg-the-dataflow-shape-title dg-the-dataflow-shape-desc" preserveAspectRatio="xMidYMid meet"><style>svg{--paper:#0c0d0f;--paper-2:#141618;--paper-3:#1c1f22;--ink:#ededea;--ink-2:#a7abb0;--ink-3:#8f949a;--rule:#262a2e;--rule-2:#5f666d;--s-output:#ededea;--s-intents:#e0a458;--s-traces:#9bbcdd;--s-errors:#ee9683;--font-sans:'Instrument Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;--font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}.dg-line{fill: none; stroke: var(--rule-2); stroke-width: 1.25; marker-end: var(--dg-marker);}.dg-line--open{marker-end: none;}.dg-line--dashed{stroke-dasharray: 4 3;}.dg-node{fill: var(--paper); stroke: var(--ink); stroke-width: 1.25;}.dg-node--soft{fill: var(--paper-2); stroke: var(--rule-2); stroke-width: 1;}.dg-arrow{fill: var(--rule-2);}.dg-label{font-family: var(--font-mono); font-size: 11px; fill: var(--ink-2); letter-spacing: 0.01em;}.dg-label--title{font-family: var(--font-sans); font-size: 15px; font-weight: 600; fill: var(--ink); letter-spacing: -0.01em;}.dg-label--faint{font-family: var(--font-mono); font-size: 9.5px; fill: var(--ink-3); letter-spacing: 0.06em;}.dg-line--output{stroke: var(--s-output);}.dg-line--intents{stroke: var(--s-intents);}.dg-line--traces{stroke: var(--s-traces);}.dg-line--errors{stroke: var(--s-errors);}.dg-label--output{fill: var(--s-output);}.dg-label--intents{fill: var(--s-intents);}.dg-label--traces{fill: var(--s-traces);}.dg-label--errors{fill: var(--s-errors);}</style><rect x="0" y="0" width="600.0" height="540.0" fill="var(--paper)"/><title id="dg-the-dataflow-shape-title">The dataflow shape</title><desc id="dg-the-dataflow-shape-desc">Three input topics — events, approvals, and tool results — arrive on Kafka or Pub/Sub and are treated identically: the same WithKeys transform keys each of them on entity_key, the three keyed streams are flattened into one, and that stream passes through an optional enrichment stage into RunAgent. RunAgent emits four streams. Three of them terminate: .output, the main terminal output; .traces, bound for an OTLP or BigQuery sink; and .errors, bound for a dead-letter sink. The fourth, .intents, is the only one that comes back. It is written to an outbox topic on Kafka or Pub/Sub, executed by an effector running as a separate service outside the pipeline that deduplicates on the intent id, and the result is published onto the tool-results topic, where it re-enters as an ordinary input on the same key. The loop therefore closes outside the pipeline, and the Beam graph itself stays acyclic.</desc><defs><marker id="dg-the-dataflow-shape-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L7,4 L0,7 z" class="dg-arrow"></path></marker></defs><g style="--dg-marker:url(#dg-the-dataflow-shape-arrow)"><text x="276" y="18" text-anchor="middle" class="dg-label--faint">KAFKA / PUB-SUB · ALL THREE ARE INPUTS</text><g><rect x="22" y="28" width="160" height="40" rx="2" class="dg-node"></rect><text x="102" y="52" text-anchor="middle" class="dg-label">events</text></g><g><rect x="196" y="28" width="160" height="40" rx="2" class="dg-node"></rect><text x="276" y="52" text-anchor="middle" class="dg-label">approvals</text></g><g><rect x="370" y="28" width="160" height="40" rx="2" class="dg-node"></rect><text x="450" y="52" text-anchor="middle" class="dg-label">tool results</text></g><g><path d="M102,68 V92" class="dg-line"></path></g><g><path d="M276,68 V92" class="dg-line"></path></g><g><path d="M450,68 V92" class="dg-line"></path></g><g><rect x="22" y="96" width="508" height="44" rx="2" class="dg-node"></rect><text x="276" y="117" text-anchor="middle" class="dg-label">WithKeys(entity_key)</text><text x="276" y="131" text-anchor="middle" class="dg-label--faint">SAME KEY FUNCTION FOR EVERY INPUT</text></g><g><path d="M102,140 V154 Q102,170 118,170 H216 Q232,170 232,186" class="dg-line"></path></g><g><path d="M276,140 V186" class="dg-line"></path></g><g><path d="M450,140 V154 Q450,170 434,170 H336 Q320,170 320,186" class="dg-line"></path></g><g><rect x="196" y="190" width="160" height="44" rx="2" class="dg-node"></rect><text x="276" y="211" text-anchor="middle" class="dg-label">Flatten</text><text x="276" y="225" text-anchor="middle" class="dg-label--faint">ONE KEYED STREAM</text></g><g><path d="M276,234 V260" class="dg-line"></path></g><g><rect x="196" y="264" width="160" height="40" rx="2" class="dg-node dg-node--soft"></rect><text x="276" y="283" text-anchor="middle" class="dg-label">enrichment</text><text x="276" y="297" text-anchor="middle" class="dg-label--faint">OPTIONAL</text></g><g><path d="M276,304 V330" class="dg-line"></path></g><g><rect x="140" y="334" width="272" height="80" rx="2" class="dg-node"></rect><text x="276" y="373" text-anchor="middle" class="dg-label">RunAgent</text><text x="276" y="387" text-anchor="middle" class="dg-label--faint">STATEFUL DOFN</text></g><g><path d="M412,350 H436" class="dg-line dg-line--output"></path></g><text x="444" y="354" text-anchor="start" class="dg-label dg-label--output">.output</text><text x="444" y="366" text-anchor="start" class="dg-label--faint">MAIN OUTPUT</text><g><path d="M412,376 H436" class="dg-line dg-line--traces"></path></g><text x="444" y="380" text-anchor="start" class="dg-label dg-label--traces">.traces</text><text x="444" y="392" text-anchor="start" class="dg-label--faint">OTLP / BIGQUERY</text><g><path d="M412,402 H436" class="dg-line dg-line--errors"></path></g><text x="444" y="406" text-anchor="start" class="dg-label dg-label--errors">.errors</text><text x="444" y="418" text-anchor="start" class="dg-label--faint">DEAD-LETTER SINK</text><g><path d="M140,390 H92 Q76,390 76,406 V484 Q76,500 92,500" class="dg-line dg-line--dashed dg-line--intents"></path></g><text x="136" y="384" text-anchor="end" class="dg-label dg-label--intents">.intents</text><g><path d="M16,440 H584" class="dg-line dg-line--open"></path></g><text x="300" y="430" text-anchor="middle" class="dg-label--faint">INSIDE THE PIPELINE · THE DAG IS ACYCLIC</text><text x="300" y="458" text-anchor="middle" class="dg-label--faint">OUTSIDE · THE LOOP CLOSES THROUGH THE BUS</text><g><rect x="96" y="478" width="160" height="44" rx="2" class="dg-node"></rect><text x="176" y="499" text-anchor="middle" class="dg-label">outbox topic</text><text x="176" y="513" text-anchor="middle" class="dg-label--faint">KAFKA / PUB-SUB</text></g><g><path d="M256,500 H286" class="dg-line dg-line--dashed dg-line--intents"></path></g><g><rect x="290" y="478" width="160" height="44" rx="2" class="dg-node"></rect><text x="370" y="499" text-anchor="middle" class="dg-label">effector</text><text x="370" y="513" text-anchor="middle" class="dg-label--faint">DEDUPES ON INTENT_ID</text></g><g><path d="M450,500 H544 Q560,500 560,484 V64 Q560,48 536,48" class="dg-line dg-line--dashed"></path></g><text x="497" y="492" text-anchor="middle" class="dg-label--faint">RE-INJECTED</text></g></svg>
