<svg xmlns="http://www.w3.org/2000/svg" width="832" height="468" viewBox="0 0 640 360" role="img" aria-labelledby="dg-failing-closed-at-both-layers-title dg-failing-closed-at-both-layers-desc" preserveAspectRatio="xMidYMid meet"><style>svg{--paper:#0c0d0f;--paper-2:#141618;--paper-3:#1c1f22;--ink:#ededea;--ink-2:#a7abb0;--ink-3:#8f949a;--rule:#262a2e;--rule-2:#5f666d;--s-output:#ededea;--s-intents:#e0a458;--s-traces:#9bbcdd;--s-errors:#ee9683;--font-sans:'Instrument Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;--font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}.dg-line{fill: none; stroke: var(--rule-2); stroke-width: 1.25; marker-end: var(--dg-marker);}.dg-line--open{marker-end: none;}.dg-line--dashed{stroke-dasharray: 4 3;}.dg-node{fill: var(--paper); stroke: var(--ink); stroke-width: 1.25;}.dg-node--soft{fill: var(--paper-2); stroke: var(--rule-2); stroke-width: 1;}.dg-arrow{fill: var(--rule-2);}.dg-label{font-family: var(--font-mono); font-size: 11px; fill: var(--ink-2); letter-spacing: 0.01em;}.dg-label--title{font-family: var(--font-sans); font-size: 15px; font-weight: 600; fill: var(--ink); letter-spacing: -0.01em;}.dg-label--faint{font-family: var(--font-mono); font-size: 9.5px; fill: var(--ink-3); letter-spacing: 0.06em;}.dg-line--output{stroke: var(--s-output);}.dg-line--intents{stroke: var(--s-intents);}.dg-line--traces{stroke: var(--s-traces);}.dg-line--errors{stroke: var(--s-errors);}.dg-label--output{fill: var(--s-output);}.dg-label--intents{fill: var(--s-intents);}.dg-label--traces{fill: var(--s-traces);}.dg-label--errors{fill: var(--s-errors);}</style><rect x="0" y="0" width="640.0" height="360.0" fill="var(--paper)"/><title id="dg-failing-closed-at-both-layers-title">Failing closed at both layers</title><desc id="dg-failing-closed-at-both-layers-desc">Two rows, one per layer, each a guard with two exits. Layer 1 runs in the pipeline: an answer arriving on the entity key meets an admission check that can fail four ways, and either resumes the activation with ctx.is_resume true or is recorded on the errors stream as an orphaned_result whose detail is one of no_continuation, unknown_intent, deadline_passed, or intent_expired. Layer 2 runs in the effector, outside the pipeline: an intent arriving from the outbox is checked against its expires_at_ms before the dedup store is touched, and either the tool runs exactly once and its result re-enters the pipeline, or an EXPIRED result is published and the tool never runs at all. A non-positive expires_at_ms reads as expired, never as unbounded. Because both guards refuse independently, a late approval can neither resume an activation the runtime has given up on nor cause an effect.</desc><defs><marker id="dg-failing-closed-at-both-layers-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L7,4 L0,7 z" class="dg-arrow"></path></marker></defs><g style="--dg-marker:url(#dg-failing-closed-at-both-layers-arrow)"><g><text x="20" y="40" text-anchor="start" class="dg-label--faint">LAYER 1 · IN THE PIPELINE</text><g><rect x="20" y="56" width="150" height="44" rx="2" class="dg-node dg-node--soft"></rect><text x="95" y="77" text-anchor="middle" class="dg-label">answer arrives</text><text x="95" y="91" text-anchor="middle" class="dg-label--faint">ON THE SAME KEY</text></g><g><path d="M170,78 H204" class="dg-line"></path></g><g><rect x="208" y="56" width="182" height="44" rx="2" class="dg-node"></rect><text x="299" y="77" text-anchor="middle" class="dg-label">admission check</text><text x="299" y="91" text-anchor="middle" class="dg-label--faint">FOUR WAYS TO FAIL</text></g><g><path d="M390,78 H408" class="dg-line dg-line--open"></path></g><g><path d="M408,78 V54 H424" class="dg-line"></path></g><g><rect x="428" y="34" width="192" height="40" rx="2" class="dg-node dg-node--soft"></rect><text x="524" y="53" text-anchor="middle" class="dg-label">resume</text><text x="524" y="67" text-anchor="middle" class="dg-label--faint">CTX.IS_RESUME TRUE</text></g><g><path d="M408,78 V104 H424" class="dg-line dg-line--errors"></path></g><g><rect x="428" y="84" width="192" height="40" rx="2" class="dg-node dg-node--soft"></rect><text x="524" y="103" text-anchor="middle" class="dg-label dg-label--errors">orphaned_result</text><text x="524" y="117" text-anchor="middle" class="dg-label--faint">ON .errors</text></g><text x="428" y="140" text-anchor="start" class="dg-label--faint">no_continuation · unknown_intent</text><text x="428" y="153" text-anchor="start" class="dg-label--faint">deadline_passed · intent_expired</text></g><g opacity="0.45"><g><path d="M20,190 H620" class="dg-line dg-line--open"></path></g></g><g><text x="20" y="230" text-anchor="start" class="dg-label--faint">LAYER 2 · IN THE EFFECTOR</text><g><rect x="20" y="246" width="150" height="44" rx="2" class="dg-node dg-node--soft"></rect><text x="95" y="267" text-anchor="middle" class="dg-label">intent arrives</text><text x="95" y="281" text-anchor="middle" class="dg-label--faint">FROM THE OUTBOX</text></g><g><path d="M170,268 H204" class="dg-line"></path></g><g><rect x="208" y="246" width="182" height="44" rx="2" class="dg-node"></rect><text x="299" y="267" text-anchor="middle" class="dg-label">expires_at_ms</text><text x="299" y="281" text-anchor="middle" class="dg-label--faint">ZERO READS AS EXPIRED</text></g><g><path d="M390,268 H408" class="dg-line dg-line--open"></path></g><g><path d="M408,268 V244 H424" class="dg-line"></path></g><g><rect x="428" y="224" width="192" height="40" rx="2" class="dg-node dg-node--soft"></rect><text x="524" y="243" text-anchor="middle" class="dg-label">tool runs once</text><text x="524" y="257" text-anchor="middle" class="dg-label--faint">RESULT RE-ENTERS</text></g><g><path d="M408,268 V294 H424" class="dg-line"></path></g><g><rect x="428" y="274" width="192" height="40" rx="2" class="dg-node dg-node--soft"></rect><text x="524" y="293" text-anchor="middle" class="dg-label">EXPIRED result</text><text x="524" y="307" text-anchor="middle" class="dg-label--faint">NOTHING RAN</text></g><text x="428" y="330" text-anchor="start" class="dg-label--faint">A LATE APPROVAL CANNOT ACT</text></g></g></svg>
