<svg xmlns="http://www.w3.org/2000/svg" width="806" height="993" viewBox="0 0 620 764" role="img" aria-labelledby="dg-where-the-runtime-metrics-are-recorded-title dg-where-the-runtime-metrics-are-recorded-desc" preserveAspectRatio="xMidYMid meet"><style>svg{--paper:#0c0d0f;--paper-2:#141618;--paper-3:#1c1f22;--ink:#ededea;--ink-2:#a7abb0;--ink-3:#8f949a;--rule:#262a2e;--rule-2:#5f666d;--s-output:#ededea;--s-intents:#e0a458;--s-traces:#9bbcdd;--s-errors:#ee9683;--font-sans:'Instrument Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;--font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}.dg-line{fill: none; stroke: var(--rule-2); stroke-width: 1.25; marker-end: var(--dg-marker);}.dg-line--open{marker-end: none;}.dg-line--dashed{stroke-dasharray: 4 3;}.dg-node{fill: var(--paper); stroke: var(--ink); stroke-width: 1.25;}.dg-node--soft{fill: var(--paper-2); stroke: var(--rule-2); stroke-width: 1;}.dg-arrow{fill: var(--rule-2);}.dg-label{font-family: var(--font-mono); font-size: 11px; fill: var(--ink-2); letter-spacing: 0.01em;}.dg-label--title{font-family: var(--font-sans); font-size: 15px; font-weight: 600; fill: var(--ink); letter-spacing: -0.01em;}.dg-label--faint{font-family: var(--font-mono); font-size: 9.5px; fill: var(--ink-3); letter-spacing: 0.06em;}.dg-line--output{stroke: var(--s-output);}.dg-line--intents{stroke: var(--s-intents);}.dg-line--traces{stroke: var(--s-traces);}.dg-line--errors{stroke: var(--s-errors);}.dg-label--output{fill: var(--s-output);}.dg-label--intents{fill: var(--s-intents);}.dg-label--traces{fill: var(--s-traces);}.dg-label--errors{fill: var(--s-errors);}</style><rect x="0" y="0" width="620.0" height="764.0" fill="var(--paper)"/><title id="dg-where-the-runtime-metrics-are-recorded-title">Where the runtime metrics are recorded</title><desc id="dg-where-the-runtime-metrics-are-recorded-desc">An activation&#x27;s path runs down the left: admission, then running the agent on the async bridge thread, then commit on the Beam worker thread. A separate rail bypasses that chain down the far left and ends at a dead-letter box, fed from admission and from the agent run, because a dead letter is an alternative outcome reached by a refusal, a failure, a timeout, or a timer rather than a step after commit. To the right of each stage is what it records. Admission records nothing: a refused resume never runs the agent, so there is no sample at all. Running the agent records activation_ms in the beam_agents.runtime namespace on every exit including failures, and soft_cap_warnings in the beam_agents.memory namespace when working memory passes its soft cap; everything else it counts accumulates in an ActivationTally, a plain object with no Beam involvement, because a metric update made off the Beam worker thread is silently discarded with no exception and no log. Commit records the rest of beam_agents.runtime in one step: the counters activations, suspensions, intents_emitted, llm_calls and tool_calls, and the distributions memory_bytes, iterations, tokens, llm_ms and overhead_ms. One further intents_emitted increment comes from a human-in-the-loop escalation, which mints an intent outside the commit path. The dead-letter site records agent_errors and orphaned_results in beam_agents.runtime, and every record on the errors output passes through that one chokepoint. Off the activation path entirely, the OTLP trace sender thread counts spans_exported, spans_dropped, export_failures and batches_sent in the beam_agents.otlp namespace, and finish_bundle records them on the Beam thread under the same rule.</desc><defs><marker id="dg-where-the-runtime-metrics-are-recorded-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L7,4 L0,7 z" class="dg-arrow"></path></marker></defs><g style="--dg-marker:url(#dg-where-the-runtime-metrics-are-recorded-arrow)"><g><rect x="40" y="44" width="180" height="44" rx="2" class="dg-node"></rect><text x="130" y="65" text-anchor="middle" class="dg-label">admission</text><text x="130" y="79" text-anchor="middle" class="dg-label--faint">FAIL-CLOSED CHECK</text></g><g><path d="M130,88 V114" class="dg-line"></path></g><g><rect x="40" y="118" width="180" height="44" rx="2" class="dg-node"></rect><text x="130" y="139" text-anchor="middle" class="dg-label">run the agent</text><text x="130" y="153" text-anchor="middle" class="dg-label--faint">ASYNC BRIDGE THREAD</text></g><g><path d="M130,162 V433" class="dg-line"></path></g><g><rect x="40" y="437" width="180" height="44" rx="2" class="dg-node"></rect><text x="130" y="458" text-anchor="middle" class="dg-label">commit</text><text x="130" y="472" text-anchor="middle" class="dg-label--faint">BEAM WORKER THREAD</text></g><g><path d="M60,88 V100 H20 V622 H36" class="dg-line"></path></g><g><path d="M80,162 V180 H20" class="dg-line dg-line--open"></path></g><g><rect x="40" y="600" width="180" height="44" rx="2" class="dg-node"></rect><text x="130" y="621" text-anchor="middle" class="dg-label dg-label--errors">dead-letter</text><text x="130" y="635" text-anchor="middle" class="dg-label--faint">ANY .errors RECORD</text></g><text x="40" y="576" text-anchor="start" class="dg-label--faint">REFUSED · FAILED · TIMED OUT,</text><text x="40" y="590" text-anchor="start" class="dg-label--faint">OR A TIMER FIRED</text><g><path d="M220,66 H248" class="dg-line"></path></g><g><rect x="252" y="44" width="352" height="44" rx="2" class="dg-node dg-node--soft"></rect><text x="428" y="65" text-anchor="middle" class="dg-label">no sample</text><text x="428" y="79" text-anchor="middle" class="dg-label--faint">A REFUSED RESUME NEVER RUNS THE AGENT</text></g><g><path d="M220,140 H236" class="dg-line dg-line--open"></path></g><g><path d="M236,140 V276" class="dg-line dg-line--open"></path></g><g><path d="M236,140 H248" class="dg-line"></path></g><g><path d="M236,211 H248" class="dg-line"></path></g><g><path d="M236,276 H248" class="dg-line"></path></g><text x="252" y="118" text-anchor="start" class="dg-label--faint">beam_agents.runtime</text><g><rect x="252" y="127" width="180" height="26" rx="2" class="dg-node dg-node--soft"></rect><text x="342" y="144" text-anchor="middle" class="dg-label">activation_ms</text></g><text x="252" y="166" text-anchor="start" class="dg-label--faint">ON EVERY EXIT, INCLUDING FAILURES</text><text x="252" y="190" text-anchor="start" class="dg-label--faint">beam_agents.memory</text><g><rect x="252" y="198" width="180" height="26" rx="2" class="dg-node dg-node--soft"></rect><text x="342" y="215" text-anchor="middle" class="dg-label">soft_cap_warnings</text></g><text x="252" y="238" text-anchor="start" class="dg-label--faint">WHEN WORKING MEMORY PASSES ITS SOFT CAP</text><g><rect x="252" y="254" width="352" height="44" rx="2" class="dg-node dg-node--soft"></rect><text x="428" y="275" text-anchor="middle" class="dg-label">ActivationTally</text><text x="428" y="289" text-anchor="middle" class="dg-label--faint">EVERYTHING ELSE WAITS FOR THE BEAM THREAD</text></g><text x="252" y="316" text-anchor="start" class="dg-label--faint">A METRIC UPDATE OFF THE BEAM THREAD IS DISCARDED</text><text x="252" y="330" text-anchor="start" class="dg-label--faint">WITH NO EXCEPTION AND NO LOG</text><g><path d="M220,459 H248" class="dg-line"></path></g><text x="252" y="352" text-anchor="start" class="dg-label--faint">beam_agents.runtime</text><text x="337" y="374" text-anchor="middle" class="dg-label--faint">COUNTERS</text><text x="519" y="374" text-anchor="middle" class="dg-label--faint">DISTRIBUTIONS</text><g><rect x="252" y="382" width="170" height="26" rx="2" class="dg-node dg-node--soft"></rect><text x="337" y="399" text-anchor="middle" class="dg-label">activations</text></g><g><rect x="252" y="414" width="170" height="26" rx="2" class="dg-node dg-node--soft"></rect><text x="337" y="431" text-anchor="middle" class="dg-label">suspensions</text></g><g><rect x="252" y="446" width="170" height="26" rx="2" class="dg-node dg-node--soft"></rect><text x="337" y="463" text-anchor="middle" class="dg-label">intents_emitted</text></g><g><rect x="252" y="478" width="170" height="26" rx="2" class="dg-node dg-node--soft"></rect><text x="337" y="495" text-anchor="middle" class="dg-label">llm_calls</text></g><g><rect x="252" y="510" width="170" height="26" rx="2" class="dg-node dg-node--soft"></rect><text x="337" y="527" text-anchor="middle" class="dg-label">tool_calls</text></g><g><rect x="434" y="382" width="170" height="26" rx="2" class="dg-node dg-node--soft"></rect><text x="519" y="399" text-anchor="middle" class="dg-label">memory_bytes</text></g><g><rect x="434" y="414" width="170" height="26" rx="2" class="dg-node dg-node--soft"></rect><text x="519" y="431" text-anchor="middle" class="dg-label">iterations</text></g><g><rect x="434" y="446" width="170" height="26" rx="2" class="dg-node dg-node--soft"></rect><text x="519" y="463" text-anchor="middle" class="dg-label">tokens</text></g><g><rect x="434" y="478" width="170" height="26" rx="2" class="dg-node dg-node--soft"></rect><text x="519" y="495" text-anchor="middle" class="dg-label">llm_ms</text></g><g><rect x="434" y="510" width="170" height="26" rx="2" class="dg-node dg-node--soft"></rect><text x="519" y="527" text-anchor="middle" class="dg-label">overhead_ms</text></g><text x="252" y="560" text-anchor="start" class="dg-label--faint">ONE STEP, ON THE BEAM THREAD, AT COMMIT</text><text x="252" y="574" text-anchor="start" class="dg-label--faint">PLUS intents_emitted FROM A HITL ESCALATION</text><g><path d="M220,622 H236" class="dg-line dg-line--open"></path></g><g><path d="M236,617 V649" class="dg-line dg-line--open"></path></g><g><path d="M236,617 H248" class="dg-line"></path></g><g><path d="M236,649 H248" class="dg-line"></path></g><text x="252" y="596" text-anchor="start" class="dg-label--faint">beam_agents.runtime</text><g><rect x="252" y="604" width="180" height="26" rx="2" class="dg-node dg-node--soft"></rect><text x="342" y="621" text-anchor="middle" class="dg-label">agent_errors</text></g><g><rect x="252" y="636" width="180" height="26" rx="2" class="dg-node dg-node--soft"></rect><text x="342" y="653" text-anchor="middle" class="dg-label">orphaned_results</text></g><text x="452" y="622" text-anchor="start" class="dg-label--faint">EVERY .errors RECORD</text><text x="452" y="636" text-anchor="start" class="dg-label--faint">PASSES THROUGH HERE</text><g><path d="M20,684 H604" class="dg-line dg-line--open"></path></g><text x="20" y="708" text-anchor="start" class="dg-label">beam_agents.otlp</text><text x="20" y="722" text-anchor="start" class="dg-label--faint">THE traces_to SENDER THREAD COUNTS,</text><text x="20" y="736" text-anchor="start" class="dg-label--faint">finish_bundle RECORDS ON THE BEAM THREAD</text><g><rect x="356" y="696" width="120" height="26" rx="2" class="dg-node dg-node--soft"></rect><text x="416" y="713" text-anchor="middle" class="dg-label">spans_exported</text></g><g><rect x="484" y="696" width="120" height="26" rx="2" class="dg-node dg-node--soft"></rect><text x="544" y="713" text-anchor="middle" class="dg-label">spans_dropped</text></g><g><rect x="356" y="726" width="120" height="26" rx="2" class="dg-node dg-node--soft"></rect><text x="416" y="743" text-anchor="middle" class="dg-label">export_failures</text></g><g><rect x="484" y="726" width="120" height="26" rx="2" class="dg-node dg-node--soft"></rect><text x="544" y="743" text-anchor="middle" class="dg-label">batches_sent</text></g></g></svg>
