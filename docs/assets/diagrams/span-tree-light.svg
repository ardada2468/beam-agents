<svg xmlns="http://www.w3.org/2000/svg" width="806" height="507" viewBox="0 0 620 390" role="img" aria-labelledby="dg-one-activations-span-tree-title dg-one-activations-span-tree-desc" preserveAspectRatio="xMidYMid meet"><style>svg{--paper:#ffffff;--paper-2:#f6f6f4;--paper-3:#edede9;--ink:#0b0c0e;--ink-2:#4a4e54;--ink-3:#63676d;--rule:#e2e2dd;--rule-2:#8e8e87;--s-output:#0b0c0e;--s-intents:#8a5205;--s-traces:#3c5c78;--s-errors:#9e2a18;--font-sans:'Instrument Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;--font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}.dg-line{fill: none; stroke: var(--rule-2); stroke-width: 1.25; marker-end: var(--dg-marker);}.dg-line--open{marker-end: none;}.dg-line--dashed{stroke-dasharray: 4 3;}.dg-node{fill: var(--paper); stroke: var(--ink); stroke-width: 1.25;}.dg-node--soft{fill: var(--paper-2); stroke: var(--rule-2); stroke-width: 1;}.dg-arrow{fill: var(--rule-2);}.dg-label{font-family: var(--font-mono); font-size: 11px; fill: var(--ink-2); letter-spacing: 0.01em;}.dg-label--title{font-family: var(--font-sans); font-size: 15px; font-weight: 600; fill: var(--ink); letter-spacing: -0.01em;}.dg-label--faint{font-family: var(--font-mono); font-size: 9.5px; fill: var(--ink-3); letter-spacing: 0.06em;}.dg-line--output{stroke: var(--s-output);}.dg-line--intents{stroke: var(--s-intents);}.dg-line--traces{stroke: var(--s-traces);}.dg-line--errors{stroke: var(--s-errors);}.dg-label--output{fill: var(--s-output);}.dg-label--intents{fill: var(--s-intents);}.dg-label--traces{fill: var(--s-traces);}.dg-label--errors{fill: var(--s-errors);}</style><rect x="0" y="0" width="620.0" height="390.0" fill="var(--paper)"/><title id="dg-one-activations-span-tree-title">One activation&#x27;s span tree</title><desc id="dg-one-activations-span-tree-desc">A trace is identified by the entity key and the activation sequence number. Its root is the activation span, which carries both the ACTIVATION_START and the ACTIVATION_END event because the two bracket one attempt and share a span id. Hanging under that root are the first attempt&#x27;s child spans: LLM_CALL, one per model call whether it reached the provider or hit the replay cache; TOOL_CALL, one per inline read-only tool; INTENT_EMITTED, one per staged ToolIntent; and SUSPENDED, which records the deadline and the pending intent ids. The resume attempt gets its own activation span nested under the first attempt&#x27;s, rather than starting a second trace, with its own children such as a further LLM_CALL made once the tool result arrives. The whole set is staged during the activation and emitted on the .traces PCollection at commit, from where AgentConfig.traces_to ships it to one sink: otlp:// over OTLP/HTTP, which is best-effort; or bigquery:// as flat rows, kafka:// as deterministic proto bytes, or pubsub:// as deterministic proto bytes, all three of which are lossless at-least-once. ACTIVATION_START alone is not exported over OTLP, because it shares its span id with ACTIVATION_END and OTLP names a span by trace id and span id.</desc><defs><marker id="dg-one-activations-span-tree-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L7,4 L0,7 z" class="dg-arrow"></path></marker></defs><g style="--dg-marker:url(#dg-one-activations-span-tree-arrow)"><text x="16" y="26" text-anchor="start" class="dg-label--faint">ONE TRACE PER (ENTITY_KEY, SEQ)</text><g><rect x="16" y="44" width="300" height="36" rx="2" class="dg-node"></rect><text x="166" y="61" text-anchor="middle" class="dg-label">activation span</text><text x="166" y="75" text-anchor="middle" class="dg-label--faint">ACTIVATION_START + ACTIVATION_END</text></g><g><path d="M28,80 V286" class="dg-line dg-line--open"></path></g><g><path d="M28,110 H52" class="dg-line"></path></g><g><path d="M28,154 H52" class="dg-line"></path></g><g><path d="M28,198 H52" class="dg-line"></path></g><g><path d="M28,242 H52" class="dg-line"></path></g><g><path d="M28,286 H52" class="dg-line"></path></g><g><rect x="56" y="92" width="260" height="36" rx="2" class="dg-node"></rect><text x="186" y="109" text-anchor="middle" class="dg-label dg-label--traces">LLM_CALL</text><text x="186" y="123" text-anchor="middle" class="dg-label--faint">ONE PER MODEL CALL, HIT OR MISS</text></g><g><rect x="56" y="136" width="260" height="36" rx="2" class="dg-node"></rect><text x="186" y="153" text-anchor="middle" class="dg-label dg-label--traces">TOOL_CALL</text><text x="186" y="167" text-anchor="middle" class="dg-label--faint">INLINE READ-ONLY TOOL</text></g><g><rect x="56" y="180" width="260" height="36" rx="2" class="dg-node"></rect><text x="186" y="197" text-anchor="middle" class="dg-label dg-label--traces">INTENT_EMITTED</text><text x="186" y="211" text-anchor="middle" class="dg-label--faint">ONE PER STAGED TOOLINTENT</text></g><g><rect x="56" y="224" width="260" height="36" rx="2" class="dg-node"></rect><text x="186" y="241" text-anchor="middle" class="dg-label dg-label--traces">SUSPENDED</text><text x="186" y="255" text-anchor="middle" class="dg-label--faint">DEADLINE + PENDING INTENT IDS</text></g><g><rect x="56" y="268" width="260" height="36" rx="2" class="dg-node"></rect><text x="186" y="285" text-anchor="middle" class="dg-label">activation span</text><text x="186" y="299" text-anchor="middle" class="dg-label--faint">THE RESUME, UNDER THE ROOT</text></g><g><path d="M72,304 V330" class="dg-line dg-line--open"></path></g><g><path d="M72,330 H96" class="dg-line"></path></g><g><rect x="100" y="312" width="216" height="36" rx="2" class="dg-node"></rect><text x="208" y="329" text-anchor="middle" class="dg-label dg-label--traces">LLM_CALL</text><text x="208" y="343" text-anchor="middle" class="dg-label--faint">AFTER THE RESULT ARRIVES</text></g><g><path d="M330,48 H342 V344 H330" class="dg-line dg-line--open"></path></g><g><path d="M342,196 H366 V62 H396" class="dg-line dg-line--traces"></path></g><text x="166" y="372" text-anchor="middle" class="dg-label--faint">STAGED DURING THE ACTIVATION, EMITTED AT COMMIT</text><g><rect x="400" y="44" width="204" height="36" rx="2" class="dg-node"></rect><text x="502" y="61" text-anchor="middle" class="dg-label dg-label--traces">.traces</text><text x="502" y="75" text-anchor="middle" class="dg-label--faint">PCOLLECTION</text></g><g><path d="M416,80 V272" class="dg-line dg-line--traces dg-line--open"></path></g><g><path d="M416,110 H440" class="dg-line dg-line--traces"></path></g><g><path d="M416,164 H440" class="dg-line dg-line--traces"></path></g><g><path d="M416,218 H440" class="dg-line dg-line--traces"></path></g><g><path d="M416,272 H440" class="dg-line dg-line--traces"></path></g><g><rect x="444" y="92" width="160" height="36" rx="2" class="dg-node"></rect><text x="524" y="109" text-anchor="middle" class="dg-label">otlp://</text><text x="524" y="123" text-anchor="middle" class="dg-label--faint">OTLP/HTTP · BEST-EFFORT</text></g><g><rect x="444" y="146" width="160" height="36" rx="2" class="dg-node"></rect><text x="524" y="163" text-anchor="middle" class="dg-label">bigquery://</text><text x="524" y="177" text-anchor="middle" class="dg-label--faint">FLAT ROWS · LOSSLESS</text></g><g><rect x="444" y="200" width="160" height="36" rx="2" class="dg-node"></rect><text x="524" y="217" text-anchor="middle" class="dg-label">kafka://</text><text x="524" y="231" text-anchor="middle" class="dg-label--faint">PROTO BYTES · LOSSLESS</text></g><g><rect x="444" y="254" width="160" height="36" rx="2" class="dg-node"></rect><text x="524" y="271" text-anchor="middle" class="dg-label">pubsub://</text><text x="524" y="285" text-anchor="middle" class="dg-label--faint">PROTO BYTES · LOSSLESS</text></g><text x="504" y="312" text-anchor="middle" class="dg-label--faint">ACTIVATION_START IS NOT</text><text x="504" y="326" text-anchor="middle" class="dg-label--faint">EXPORTED OVER OTLP</text></g></svg>
