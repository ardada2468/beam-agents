<svg xmlns="http://www.w3.org/2000/svg" width="832" height="525" viewBox="0 0 640 404" role="img" aria-labelledby="dg-what-a-bundle-retry-costs-on-the-cached-path-title dg-what-a-bundle-retry-costs-on-the-cached-path-desc" preserveAspectRatio="xMidYMid meet"><style>svg{--paper:#ffffff;--paper-2:#f6f6f4;--paper-3:#edede9;--ink:#0b0c0e;--ink-2:#4a4e54;--ink-3:#63676d;--rule:#e2e2dd;--rule-2:#8e8e87;--s-output:#0b0c0e;--s-intents:#8a5205;--s-traces:#3c5c78;--s-errors:#9e2a18;--font-sans:'Instrument Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;--font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}.dg-line{fill: none; stroke: var(--rule-2); stroke-width: 1.25; marker-end: var(--dg-marker);}.dg-line--open{marker-end: none;}.dg-line--dashed{stroke-dasharray: 4 3;}.dg-node{fill: var(--paper); stroke: var(--ink); stroke-width: 1.25;}.dg-node--soft{fill: var(--paper-2); stroke: var(--rule-2); stroke-width: 1;}.dg-arrow{fill: var(--rule-2);}.dg-label{font-family: var(--font-mono); font-size: 11px; fill: var(--ink-2); letter-spacing: 0.01em;}.dg-label--title{font-family: var(--font-sans); font-size: 15px; font-weight: 600; fill: var(--ink); letter-spacing: -0.01em;}.dg-label--faint{font-family: var(--font-mono); font-size: 9.5px; fill: var(--ink-3); letter-spacing: 0.06em;}.dg-line--output{stroke: var(--s-output);}.dg-line--intents{stroke: var(--s-intents);}.dg-line--traces{stroke: var(--s-traces);}.dg-line--errors{stroke: var(--s-errors);}.dg-label--output{fill: var(--s-output);}.dg-label--intents{fill: var(--s-intents);}.dg-label--traces{fill: var(--s-traces);}.dg-label--errors{fill: var(--s-errors);}</style><rect x="0" y="0" width="640.0" height="404.0" fill="var(--paper)"/><title id="dg-what-a-bundle-retry-costs-on-the-cached-path-title">What a bundle retry costs on the cached path</title><desc id="dg-what-a-bundle-retry-costs-on-the-cached-path-desc">A model call from inside the activation is turned into a cache key first: the sha256 of one canonical JSON document holding the model id, the messages, the tools schema, the sampling parameters, the entity key and seq. That key is looked up in the replay cache, which lives in keyed state and is bounded to 64 entries, a 6-hour TTL and a 100 KiB blob. A miss calls the provider and stages the response, which is committed to keyed state with the rest of the activation. A hit returns the stored response and makes no provider call. A retried bundle issues the same request for the same key and seq, so it recomputes the same cache key. Where that entry was already committed — by an earlier activation at the same seq, which is the cached path — the lookup hits and the provider is not called again.</desc><defs><marker id="dg-what-a-bundle-retry-costs-on-the-cached-path-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L7,4 L0,7 z" class="dg-arrow"></path></marker></defs><g style="--dg-marker:url(#dg-what-a-bundle-retry-costs-on-the-cached-path-arrow)"><g><rect x="190" y="24" width="260" height="44" rx="2" class="dg-node"></rect><text x="320" y="45" text-anchor="middle" class="dg-label">ctx.call_model(...)</text><text x="320" y="59" text-anchor="middle" class="dg-label--faint">INSIDE THE ACTIVATION</text></g><g><path d="M320,68 V92" class="dg-line"></path></g><g><rect x="170" y="92" width="300" height="52" rx="2" class="dg-node"></rect><text x="320" y="117" text-anchor="middle" class="dg-label">sha256(canonical json)</text><text x="320" y="131" text-anchor="middle" class="dg-label--faint">MODEL MESSAGES TOOLS PARAMS KEY SEQ</text></g><text x="632" y="90" text-anchor="end" class="dg-label--faint">SAME REQUEST</text><g><rect x="486" y="98" width="146" height="40" rx="2" class="dg-node dg-node--soft"></rect><text x="559" y="117" text-anchor="middle" class="dg-label">the bundle retries</text><text x="559" y="131" text-anchor="middle" class="dg-label--faint">SAME KEY, SAME SEQ</text></g><g><path d="M486,118 H470" class="dg-line"></path></g><g><path d="M320,144 V168" class="dg-line"></path></g><g><rect x="170" y="168" width="300" height="52" rx="2" class="dg-node"></rect><text x="320" y="193" text-anchor="middle" class="dg-label">replay cache</text><text x="320" y="207" text-anchor="middle" class="dg-label--faint">IN KEYED STATE</text></g><text x="480" y="190" text-anchor="start" class="dg-label--faint">LRU · 64 ENTRIES</text><text x="480" y="204" text-anchor="start" class="dg-label--faint">6h TTL · 100 KiB CAP</text><g><path d="M320,220 V240 Q320,256 304,256 H181 Q165,256 165,272 V280" class="dg-line"></path></g><text x="190" y="250" text-anchor="start" class="dg-label--faint">HIT</text><g><rect x="40" y="280" width="250" height="44" rx="2" class="dg-node"></rect><text x="165" y="301" text-anchor="middle" class="dg-label">cached response</text><text x="165" y="315" text-anchor="middle" class="dg-label--faint">NO PROVIDER CALL</text></g><text x="165" y="342" text-anchor="middle" class="dg-label--faint">WHERE A RETRY LANDS —</text><text x="165" y="356" text-anchor="middle" class="dg-label--faint">IF THE ENTRY ALREADY COMMITTED</text><g><path d="M320,220 V240 Q320,256 336,256 H459 Q475,256 475,272 V280" class="dg-line"></path></g><text x="350" y="250" text-anchor="start" class="dg-label--faint">MISS</text><g><rect x="350" y="280" width="250" height="44" rx="2" class="dg-node"></rect><text x="475" y="301" text-anchor="middle" class="dg-label">call the provider</text><text x="475" y="315" text-anchor="middle" class="dg-label--faint">THEN STAGE THE RESULT</text></g><g><path d="M475,324 V374 Q475,390 459,390 H36 Q20,390 20,374 V210 Q20,194 36,194 H170" class="dg-line"></path></g><text x="40" y="384" text-anchor="start" class="dg-label--faint">STAGED — COMMITTED WITH THE BUNDLE</text></g></svg>
