<svg xmlns="http://www.w3.org/2000/svg" width="832" height="484" viewBox="0 0 640 372" role="img" aria-labelledby="dg-how-an-activation-commits-title dg-how-an-activation-commits-desc" preserveAspectRatio="xMidYMid meet"><style>svg{--paper:#ffffff;--paper-2:#f6f6f4;--paper-3:#edede9;--ink:#0b0c0e;--ink-2:#4a4e54;--ink-3:#63676d;--rule:#e2e2dd;--rule-2:#8e8e87;--s-output:#0b0c0e;--s-intents:#8a5205;--s-traces:#3c5c78;--s-errors:#9e2a18;--font-sans:'Instrument Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;--font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}.dg-line{fill: none; stroke: var(--rule-2); stroke-width: 1.25; marker-end: var(--dg-marker);}.dg-line--open{marker-end: none;}.dg-line--dashed{stroke-dasharray: 4 3;}.dg-node{fill: var(--paper); stroke: var(--ink); stroke-width: 1.25;}.dg-node--soft{fill: var(--paper-2); stroke: var(--rule-2); stroke-width: 1;}.dg-arrow{fill: var(--rule-2);}.dg-label{font-family: var(--font-mono); font-size: 11px; fill: var(--ink-2); letter-spacing: 0.01em;}.dg-label--title{font-family: var(--font-sans); font-size: 15px; font-weight: 600; fill: var(--ink); letter-spacing: -0.01em;}.dg-label--faint{font-family: var(--font-mono); font-size: 9.5px; fill: var(--ink-3); letter-spacing: 0.06em;}.dg-line--output{stroke: var(--s-output);}.dg-line--intents{stroke: var(--s-intents);}.dg-line--traces{stroke: var(--s-traces);}.dg-line--errors{stroke: var(--s-errors);}.dg-label--output{fill: var(--s-output);}.dg-label--intents{fill: var(--s-intents);}.dg-label--traces{fill: var(--s-traces);}.dg-label--errors{fill: var(--s-errors);}</style><rect x="0" y="0" width="640.0" height="372.0" fill="var(--paper)"/><title id="dg-how-an-activation-commits-title">How an activation commits</title><desc id="dg-how-an-activation-commits-desc">Five kinds of effect — memory writes, replay-cache inserts, intents, traces and outputs — are staged inside the activation context rather than written as the agent produces them. All five meet one all-or-nothing gate. If the activation returns, the runtime writes keyed state in a fixed order — memory, LLM cache, continuation, pending intents, then seq plus one — and emits on .output, .intents and .traces, including the activation&#x27;s full set of trace spans. If it raises or times out, every staged effect is discarded: no keyed state is written, seq does not advance, and nothing reaches .output or .intents. The only two records that leave are one ActivationError on .errors and one ERROR event on .traces, both synthesized by the runtime from the key, the sequence number and the failure reason.</desc><defs><marker id="dg-how-an-activation-commits-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L7,4 L0,7 z" class="dg-arrow"></path></marker></defs><g style="--dg-marker:url(#dg-how-an-activation-commits-arrow)"><text x="320" y="26" text-anchor="middle" class="dg-label--faint">STAGED IN THE ACTIVATION CONTEXT</text><g><rect x="56" y="36" width="104" height="28" rx="2" class="dg-node dg-node--soft"></rect><text x="108" y="54" text-anchor="middle" class="dg-label">memory writes</text></g><g><rect x="172" y="36" width="150" height="28" rx="2" class="dg-node dg-node--soft"></rect><text x="247" y="54" text-anchor="middle" class="dg-label">replay-cache inserts</text></g><g><rect x="334" y="36" width="76" height="28" rx="2" class="dg-node dg-node--soft"></rect><text x="372" y="54" text-anchor="middle" class="dg-label">intents</text></g><g><rect x="422" y="36" width="70" height="28" rx="2" class="dg-node dg-node--soft"></rect><text x="457" y="54" text-anchor="middle" class="dg-label">traces</text></g><g><rect x="504" y="36" width="80" height="28" rx="2" class="dg-node dg-node--soft"></rect><text x="544" y="54" text-anchor="middle" class="dg-label">outputs</text></g><g><path d="M108,64 V80 M247,64 V80 M372,64 V80 M457,64 V80 M544,64 V80 M108,80 H544" class="dg-line dg-line--open"></path></g><g><path d="M320,80 V104" class="dg-line"></path></g><g><rect x="230" y="104" width="180" height="56" rx="2" class="dg-node"></rect><text x="320" y="131" text-anchor="middle" class="dg-label">commit gate</text><text x="320" y="145" text-anchor="middle" class="dg-label--faint">ALL OR NOTHING</text></g><g><path d="M320,160 V180 Q320,196 304,196 H180 Q164,196 164,212 V236" class="dg-line"></path></g><text x="180" y="190" text-anchor="start" class="dg-label--faint">IF IT RETURNS</text><g><path d="M320,160 V180 Q320,196 336,196 H468 Q484,196 484,212 V236" class="dg-line"></path></g><text x="340" y="190" text-anchor="start" class="dg-label--faint">IF IT RAISES OR TIMES OUT</text><g><rect x="16" y="236" width="296" height="48" rx="2" class="dg-node"></rect><text x="164" y="259" text-anchor="middle" class="dg-label">commit to keyed state</text><text x="164" y="273" text-anchor="middle" class="dg-label--faint">MEMORY LLM_CACHE CONTINUATION PENDING SEQ+1</text></g><g><path d="M60,284 V308" class="dg-line dg-line--output"></path></g><text x="60" y="322" text-anchor="middle" class="dg-label dg-label--output">.output</text><g><path d="M164,284 V308" class="dg-line dg-line--intents"></path></g><text x="164" y="322" text-anchor="middle" class="dg-label dg-label--intents">.intents</text><g><path d="M268,284 V308" class="dg-line dg-line--traces"></path></g><text x="268" y="322" text-anchor="middle" class="dg-label dg-label--traces">.traces</text><text x="268" y="336" text-anchor="middle" class="dg-label--faint">A FULL SPAN SET</text><g><rect x="336" y="236" width="296" height="48" rx="2" class="dg-node"></rect><text x="484" y="259" text-anchor="middle" class="dg-label">discard everything</text><text x="484" y="273" text-anchor="middle" class="dg-label--faint">NO STATE WRITTEN — SEQ DOES NOT ADVANCE</text></g><g><path d="M410,284 V308" class="dg-line dg-line--errors"></path></g><text x="410" y="322" text-anchor="middle" class="dg-label dg-label--errors">.errors</text><text x="410" y="336" text-anchor="middle" class="dg-label--faint">ONE ActivationError</text><g><path d="M558,284 V308" class="dg-line dg-line--traces"></path></g><text x="558" y="322" text-anchor="middle" class="dg-label dg-label--traces">.traces</text><text x="558" y="336" text-anchor="middle" class="dg-label--faint">ONE ERROR EVENT</text><text x="484" y="358" text-anchor="middle" class="dg-label--faint">NOTHING REACHES .output OR .intents</text></g></svg>
