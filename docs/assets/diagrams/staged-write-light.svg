<svg xmlns="http://www.w3.org/2000/svg" width="780" height="777" viewBox="0 0 600 598" role="img" aria-labelledby="dg-the-life-of-a-staged-write-title dg-the-life-of-a-staged-write-desc" preserveAspectRatio="xMidYMid meet"><style>svg{--paper:#ffffff;--paper-2:#f6f6f4;--paper-3:#edede9;--ink:#0b0c0e;--ink-2:#4a4e54;--ink-3:#63676d;--rule:#e2e2dd;--rule-2:#8e8e87;--s-output:#0b0c0e;--s-intents:#8a5205;--s-traces:#3c5c78;--s-errors:#9e2a18;--font-sans:'Instrument Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;--font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}.dg-line{fill: none; stroke: var(--rule-2); stroke-width: 1.25; marker-end: var(--dg-marker);}.dg-line--open{marker-end: none;}.dg-line--dashed{stroke-dasharray: 4 3;}.dg-node{fill: var(--paper); stroke: var(--ink); stroke-width: 1.25;}.dg-node--soft{fill: var(--paper-2); stroke: var(--rule-2); stroke-width: 1;}.dg-arrow{fill: var(--rule-2);}.dg-label{font-family: var(--font-mono); font-size: 11px; fill: var(--ink-2); letter-spacing: 0.01em;}.dg-label--title{font-family: var(--font-sans); font-size: 15px; font-weight: 600; fill: var(--ink); letter-spacing: -0.01em;}.dg-label--faint{font-family: var(--font-mono); font-size: 9.5px; fill: var(--ink-3); letter-spacing: 0.06em;}.dg-line--output{stroke: var(--s-output);}.dg-line--intents{stroke: var(--s-intents);}.dg-line--traces{stroke: var(--s-traces);}.dg-line--errors{stroke: var(--s-errors);}.dg-label--output{fill: var(--s-output);}.dg-label--intents{fill: var(--s-intents);}.dg-label--traces{fill: var(--s-traces);}.dg-label--errors{fill: var(--s-errors);}</style><rect x="0" y="0" width="600.0" height="598.0" fill="var(--paper)"/><title id="dg-the-life-of-a-staged-write-title">The life of a staged write</title><desc id="dg-the-life-of-a-staged-write-desc">An agent&#x27;s memory.set and memory.append calls are staged in the memory facade inside the worker process; nothing is in Beam state yet. If the activation returns, the runtime commits: MEMORY, LLM_CACHE, CONTINUATION, PENDING and SEQ are written and the timers are set or cleared, atomically with the bundle. If it raised or timed out, the staged writes vanish and a dead letter is emitted on the errors output with reason activation_error or activation_timeout; nothing reached Beam state, so there is nothing to roll back. Later, when the watermark passes the TTL mark, TTL_TIMER wipes every cell for the key unconditionally and the key holds nothing again. If a continuation was still live at that moment, the same firing also emits a record on the errors output with reason ttl_wiped_suspension: the continuation is gone, so nothing can ever answer that suspension.</desc><defs><marker id="dg-the-life-of-a-staged-write-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L7,4 L0,7 z" class="dg-arrow"></path></marker></defs><g style="--dg-marker:url(#dg-the-life-of-a-staged-write-arrow)"><text x="14" y="18" text-anchor="start" class="dg-label--faint">WHILE ONE ACTIVATION RUNS</text><g><rect x="14" y="32" width="200" height="46" rx="2" class="dg-node"></rect><text x="114" y="54" text-anchor="middle" class="dg-label">activation</text><text x="114" y="68" text-anchor="middle" class="dg-label--faint">AGENT CODE RUNS</text></g><g><path d="M114,78 V104" class="dg-line"></path><text x="176" y="96" text-anchor="middle" class="dg-label--faint">set / append</text></g><g><rect x="14" y="106" width="200" height="46" rx="2" class="dg-node dg-node--soft"></rect><text x="114" y="128" text-anchor="middle" class="dg-label">staged writes</text><text x="114" y="142" text-anchor="middle" class="dg-label--faint">NOT IN BEAM STATE YET</text></g><g><path d="M114,152 V186" class="dg-line"></path></g><g><path d="M214,129 H442 Q458,129 458,145 V186" class="dg-line"></path><text x="330" y="122" text-anchor="middle" class="dg-label--faint">RAISED OR TIMED OUT</text></g><g><rect x="14" y="188" width="200" height="46" rx="2" class="dg-node"></rect><text x="114" y="210" text-anchor="middle" class="dg-label">commit</text><text x="114" y="224" text-anchor="middle" class="dg-label--faint">ACTIVATION RETURNED</text></g><g><rect x="330" y="188" width="256" height="46" rx="2" class="dg-node"></rect><text x="458" y="210" text-anchor="middle" class="dg-label">discard</text><text x="458" y="224" text-anchor="middle" class="dg-label--faint">STAGED WRITES VANISH</text></g><g><path d="M114,234 V264" class="dg-line"></path><text x="196" y="253" text-anchor="middle" class="dg-label--faint">atomic with the bundle</text></g><g><rect x="14" y="266" width="200" height="46" rx="2" class="dg-node"></rect><text x="114" y="288" text-anchor="middle" class="dg-label">keyed state</text><text x="114" y="302" text-anchor="middle" class="dg-label--faint">DURABLE, PER KEY</text></g><text x="114" y="330" text-anchor="middle" class="dg-label--faint">MEMORY · LLM_CACHE</text><text x="114" y="342" text-anchor="middle" class="dg-label--faint">CONTINUATION · PENDING · SEQ</text><text x="114" y="354" text-anchor="middle" class="dg-label--faint">+ TIMERS SET OR CLEARED</text><g><path d="M458,234 V264" class="dg-line dg-line--errors"></path></g><g><rect x="330" y="266" width="256" height="46" rx="2" class="dg-node"></rect><text x="458" y="288" text-anchor="middle" class="dg-label dg-label--errors">.errors</text><text x="458" y="302" text-anchor="middle" class="dg-label--faint">DEAD LETTER</text></g><text x="458" y="330" text-anchor="middle" class="dg-label--faint">reason=activation_error</text><text x="458" y="342" text-anchor="middle" class="dg-label--faint">or activation_timeout</text><text x="458" y="360" text-anchor="middle" class="dg-label--faint">nothing reached Beam state,</text><text x="458" y="372" text-anchor="middle" class="dg-label--faint">so there is nothing to roll back</text><g><path d="M14,396 H586" class="dg-line dg-line--open"></path></g><text x="14" y="420" text-anchor="start" class="dg-label--faint">LATER · WHEN THE TTL MARK PASSES</text><g><rect x="14" y="436" width="150" height="46" rx="2" class="dg-node"></rect><text x="89" y="458" text-anchor="middle" class="dg-label">TTL_TIMER</text><text x="89" y="472" text-anchor="middle" class="dg-label--faint">EVENT-TIME MARK</text></g><g><path d="M164,459 H210" class="dg-line"></path></g><g><rect x="212" y="436" width="200" height="46" rx="2" class="dg-node"></rect><text x="312" y="458" text-anchor="middle" class="dg-label">wipe</text><text x="312" y="472" text-anchor="middle" class="dg-label--faint">EVERY CELL, UNCONDITIONALLY</text></g><g><path d="M412,459 H446" class="dg-line"></path></g><text x="454" y="454" text-anchor="start" class="dg-label--faint">the key holds</text><text x="454" y="466" text-anchor="start" class="dg-label--faint">nothing again</text><g><path d="M188,459 V501 Q188,517 204,517 H336" class="dg-line dg-line--errors"></path></g><text x="196" y="492" text-anchor="start" class="dg-label--faint">IF STILL SUSPENDED</text><g><rect x="338" y="494" width="248" height="46" rx="2" class="dg-node"></rect><text x="462" y="516" text-anchor="middle" class="dg-label dg-label--errors">.errors</text><text x="462" y="530" text-anchor="middle" class="dg-label--faint">DEAD LETTER</text></g><text x="462" y="552" text-anchor="middle" class="dg-label--faint">reason=ttl_wiped_suspension</text><text x="462" y="570" text-anchor="middle" class="dg-label--faint">the continuation is gone;</text><text x="462" y="582" text-anchor="middle" class="dg-label--faint">nothing can answer it now</text></g></svg>
