<svg xmlns="http://www.w3.org/2000/svg" width="806" height="785" viewBox="0 0 620 604" role="img" aria-labelledby="dg-how-an-intent-leaves-the-pipeline-and-its-result-comes-back-title dg-how-an-intent-leaves-the-pipeline-and-its-result-comes-back-desc" preserveAspectRatio="xMidYMid meet"><style>svg{--paper:#ffffff;--paper-2:#f6f6f4;--paper-3:#edede9;--ink:#0b0c0e;--ink-2:#4a4e54;--ink-3:#63676d;--rule:#e2e2dd;--rule-2:#8e8e87;--s-output:#0b0c0e;--s-intents:#8a5205;--s-traces:#3c5c78;--s-errors:#9e2a18;--font-sans:'Instrument Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;--font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}.dg-line{fill: none; stroke: var(--rule-2); stroke-width: 1.25; marker-end: var(--dg-marker);}.dg-line--open{marker-end: none;}.dg-line--dashed{stroke-dasharray: 4 3;}.dg-node{fill: var(--paper); stroke: var(--ink); stroke-width: 1.25;}.dg-node--soft{fill: var(--paper-2); stroke: var(--rule-2); stroke-width: 1;}.dg-arrow{fill: var(--rule-2);}.dg-label{font-family: var(--font-mono); font-size: 11px; fill: var(--ink-2); letter-spacing: 0.01em;}.dg-label--title{font-family: var(--font-sans); font-size: 15px; font-weight: 600; fill: var(--ink); letter-spacing: -0.01em;}.dg-label--faint{font-family: var(--font-mono); font-size: 9.5px; fill: var(--ink-3); letter-spacing: 0.06em;}.dg-line--output{stroke: var(--s-output);}.dg-line--intents{stroke: var(--s-intents);}.dg-line--traces{stroke: var(--s-traces);}.dg-line--errors{stroke: var(--s-errors);}.dg-label--output{fill: var(--s-output);}.dg-label--intents{fill: var(--s-intents);}.dg-label--traces{fill: var(--s-traces);}.dg-label--errors{fill: var(--s-errors);}</style><rect x="0" y="0" width="620.0" height="604.0" fill="var(--paper)"/><title id="dg-how-an-intent-leaves-the-pipeline-and-its-result-comes-back-title">How an intent leaves the pipeline and its result comes back</title><desc id="dg-how-an-intent-leaves-the-pipeline-and-its-result-comes-back-desc">A horizontal rule separates the Beam pipeline above from everything outside it below. Above the rule, RunAgent suspends an activation and mints an intent_id that is uuid5-derived from the entity key, the sequence number, and the step index. The .intents output crosses the rule downward into an outbox topic keyed by entity_key. Below the rule, the effector — a separate service that imports no Beam — consumes the outbox, writes a claim on intent_id into a dedup store, invokes your side-effecting tool at most one dispatch per intent_id, and writes the terminal result back into that store before publishing to a results topic, also keyed by entity_key. A redelivery carrying the same intent_id goes to the dedup store rather than to the tool, and is collapsed there once the terminal result is durable. The published result crosses the rule back upward into the pipeline and resumes the suspended activation on the same key.</desc><defs><marker id="dg-how-an-intent-leaves-the-pipeline-and-its-result-comes-back-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L7,4 L0,7 z" class="dg-arrow"></path></marker></defs><g style="--dg-marker:url(#dg-how-an-intent-leaves-the-pipeline-and-its-result-comes-back-arrow)"><text x="20" y="26" text-anchor="start" class="dg-label--faint">IN THE PIPELINE</text><g><rect x="20" y="36" width="140" height="56" rx="2" class="dg-node"></rect><text x="90" y="63" text-anchor="middle" class="dg-label">RunAgent</text><text x="90" y="77" text-anchor="middle" class="dg-label--faint">ACTIVATION SUSPENDS</text></g><g><path d="M160,64 H178" class="dg-line"></path></g><g><rect x="182" y="36" width="232" height="56" rx="2" class="dg-node dg-node--soft"></rect><text x="298" y="63" text-anchor="middle" class="dg-label">intent_id</text><text x="298" y="77" text-anchor="middle" class="dg-label--faint">UUID5(ENTITY_KEY, SEQ, STEP_INDEX)</text></g><g><path d="M0,120 H616" class="dg-line dg-line--open"></path></g><g><path d="M298,92 V154" class="dg-line dg-line--intents"></path></g><text x="310" y="112" text-anchor="start" class="dg-label dg-label--intents">.intents</text><text x="20" y="140" text-anchor="start" class="dg-label--faint">OUTSIDE THE PIPELINE</text><g><rect x="210" y="158" width="176" height="52" rx="2" class="dg-node"></rect><text x="298" y="183" text-anchor="middle" class="dg-label">outbox topic</text><text x="298" y="197" text-anchor="middle" class="dg-label--faint">KEYED BY ENTITY_KEY</text></g><g><path d="M298,210 V246" class="dg-line"></path></g><g><rect x="210" y="250" width="176" height="64" rx="2" class="dg-node"></rect><text x="298" y="281" text-anchor="middle" class="dg-label">effector</text><text x="298" y="295" text-anchor="middle" class="dg-label--faint">IMPORTS NO BEAM</text></g><g><path d="M386,282 H422" class="dg-line"></path></g><g><rect x="426" y="256" width="180" height="52" rx="2" class="dg-node"></rect><text x="516" y="281" text-anchor="middle" class="dg-label">your tool</text><text x="516" y="295" text-anchor="middle" class="dg-label--faint">SIDE EFFECT</text></g><text x="516" y="336" text-anchor="middle" class="dg-label">at most one dispatch</text><text x="516" y="352" text-anchor="middle" class="dg-label">per intent_id</text><g><path d="M256,314 V384" class="dg-line"></path><text x="226" y="352" text-anchor="middle" class="dg-label--faint">CLAIM</text></g><g><path d="M340,314 V384" class="dg-line"></path><text x="384" y="352" text-anchor="middle" class="dg-label--faint">COMPLETE</text></g><g><rect x="210" y="388" width="176" height="52" rx="2" class="dg-node"></rect><text x="298" y="413" text-anchor="middle" class="dg-label">dedup store</text><text x="298" y="427" text-anchor="middle" class="dg-label--faint">KEYED ON INTENT_ID</text></g><g><rect x="426" y="388" width="180" height="52" rx="2" class="dg-node dg-node--soft"></rect><text x="516" y="413" text-anchor="middle" class="dg-label">redelivery</text><text x="516" y="427" text-anchor="middle" class="dg-label--faint">SAME INTENT_ID</text></g><g><path d="M422,414 H390" class="dg-line"></path></g><text x="516" y="462" text-anchor="middle" class="dg-label">collapsed once the</text><text x="516" y="478" text-anchor="middle" class="dg-label">result is durable</text><g><path d="M210,270 H202 Q190,270 190,282 V494 Q190,506 202,506 H208" class="dg-line"></path></g><text x="182" y="400" text-anchor="end" class="dg-label--faint">PUBLISH</text><g><rect x="210" y="480" width="176" height="52" rx="2" class="dg-node"></rect><text x="298" y="505" text-anchor="middle" class="dg-label">results topic</text><text x="298" y="519" text-anchor="middle" class="dg-label--faint">KEYED BY ENTITY_KEY</text></g><g><path d="M298,532 V552 Q298,568 282,568 H28 Q8,568 8,552 V80 Q8,64 20,64" class="dg-line dg-line--dashed dg-line--intents"></path></g><text x="20" y="592" text-anchor="start" class="dg-label">resumes the suspended activation on the same key</text></g></svg>
