<svg xmlns="http://www.w3.org/2000/svg" width="832" height="614" viewBox="0 0 640 472" role="img" aria-labelledby="dg-where-an-intent-id-comes-from-title dg-where-an-intent-id-comes-from-desc" preserveAspectRatio="xMidYMid meet"><style>svg{--paper:#ffffff;--paper-2:#f6f6f4;--paper-3:#edede9;--ink:#0b0c0e;--ink-2:#4a4e54;--ink-3:#63676d;--rule:#e2e2dd;--rule-2:#8e8e87;--s-output:#0b0c0e;--s-intents:#8a5205;--s-traces:#3c5c78;--s-errors:#9e2a18;--font-sans:'Instrument Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;--font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}.dg-line{fill: none; stroke: var(--rule-2); stroke-width: 1.25; marker-end: var(--dg-marker);}.dg-line--open{marker-end: none;}.dg-line--dashed{stroke-dasharray: 4 3;}.dg-node{fill: var(--paper); stroke: var(--ink); stroke-width: 1.25;}.dg-node--soft{fill: var(--paper-2); stroke: var(--rule-2); stroke-width: 1;}.dg-arrow{fill: var(--rule-2);}.dg-label{font-family: var(--font-mono); font-size: 11px; fill: var(--ink-2); letter-spacing: 0.01em;}.dg-label--title{font-family: var(--font-sans); font-size: 15px; font-weight: 600; fill: var(--ink); letter-spacing: -0.01em;}.dg-label--faint{font-family: var(--font-mono); font-size: 9.5px; fill: var(--ink-3); letter-spacing: 0.06em;}.dg-line--output{stroke: var(--s-output);}.dg-line--intents{stroke: var(--s-intents);}.dg-line--traces{stroke: var(--s-traces);}.dg-line--errors{stroke: var(--s-errors);}.dg-label--output{fill: var(--s-output);}.dg-label--intents{fill: var(--s-intents);}.dg-label--traces{fill: var(--s-traces);}.dg-label--errors{fill: var(--s-errors);}</style><rect x="0" y="0" width="640.0" height="472.0" fill="var(--paper)"/><title id="dg-where-an-intent-id-comes-from-title">Where an intent id comes from</title><desc id="dg-where-an-intent-id-comes-from-desc">An intent id is derived from three values that describe where the activation is, not when it ran: the entity key, seq (how many activations have committed for that key), and step_index (the position of this step inside the activation). They are formatted into the name entity_key.hex() pipe seq pipe step_index and hashed with uuid5 against a fixed namespace — a pure function with no clock, no counter and no randomness. A retried bundle for the same key, seq and step re-derives rather than remembers, so it produces byte-identical intents. The intent leaves on .intents through the outbox topic to the effector, which claims on the intent id and gets exactly one of three answers: Claimed, meaning it owns the execution and runs it once; InFlight, meaning another worker holds a live lease and it must wait; or Done, meaning a terminal record already exists, so it republishes the stored result and does not execute.</desc><defs><marker id="dg-where-an-intent-id-comes-from-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L7,4 L0,7 z" class="dg-arrow"></path></marker></defs><g style="--dg-marker:url(#dg-where-an-intent-id-comes-from-arrow)"><text x="320" y="26" text-anchor="middle" class="dg-label--faint">PURE INPUTS — WHERE THE ACTIVATION IS, NOT WHEN</text><g><rect x="73" y="36" width="130" height="40" rx="2" class="dg-node dg-node--soft"></rect><text x="138" y="55" text-anchor="middle" class="dg-label">entity_key.hex()</text><text x="138" y="69" text-anchor="middle" class="dg-label--faint">THE BEAM KEY</text></g><g><rect x="223" y="36" width="156" height="40" rx="2" class="dg-node dg-node--soft"></rect><text x="301" y="55" text-anchor="middle" class="dg-label">seq</text><text x="301" y="69" text-anchor="middle" class="dg-label--faint">COMMITTED ACTIVATIONS</text></g><g><rect x="399" y="36" width="168" height="40" rx="2" class="dg-node dg-node--soft"></rect><text x="483" y="55" text-anchor="middle" class="dg-label">step_index</text><text x="483" y="69" text-anchor="middle" class="dg-label--faint">STEP IN THIS ACTIVATION</text></g><g><path d="M138,76 V92 M301,76 V92 M483,76 V92 M138,92 H483" class="dg-line dg-line--open"></path></g><g><path d="M320,92 V112" class="dg-line"></path></g><g><rect x="175" y="112" width="290" height="40" rx="2" class="dg-node dg-node--soft"></rect><text x="320" y="131" text-anchor="middle" class="dg-label">&quot;{entity_key.hex()}|{seq}|{step_index}&quot;</text><text x="320" y="145" text-anchor="middle" class="dg-label--faint">THE UUID5 NAME</text></g><g><path d="M320,152 V176" class="dg-line"></path></g><g><rect x="175" y="176" width="290" height="52" rx="2" class="dg-node"></rect><text x="320" y="201" text-anchor="middle" class="dg-label">uuid5(NAMESPACE, name)</text><text x="320" y="215" text-anchor="middle" class="dg-label--faint">NO CLOCK · NO COUNTER · NO RNG</text></g><text x="636" y="172" text-anchor="end" class="dg-label--faint">RE-DERIVED, NOT RECALLED</text><g><rect x="490" y="182" width="142" height="40" rx="2" class="dg-node dg-node--soft"></rect><text x="561" y="201" text-anchor="middle" class="dg-label">a retried bundle</text><text x="561" y="215" text-anchor="middle" class="dg-label--faint">SAME KEY, SEQ, STEP</text></g><g><path d="M490,202 H465" class="dg-line"></path></g><g><path d="M320,228 V252" class="dg-line"></path></g><g><rect x="175" y="252" width="290" height="52" rx="2" class="dg-node"></rect><text x="320" y="277" text-anchor="middle" class="dg-label">intent_id</text><text x="320" y="291" text-anchor="middle" class="dg-label--faint">BYTE-IDENTICAL ON A REPLAY</text></g><g><path d="M320,304 V344" class="dg-line dg-line--dashed dg-line--intents"></path></g><text x="332" y="320" text-anchor="start" class="dg-label dg-label--intents">.intents</text><text x="332" y="334" text-anchor="start" class="dg-label--faint">OUTBOX TOPIC</text><g><rect x="175" y="344" width="290" height="52" rx="2" class="dg-node"></rect><text x="320" y="369" text-anchor="middle" class="dg-label">effector</text><text x="320" y="383" text-anchor="middle" class="dg-label--faint">DEDUP BY INTENT_ID</text></g><g><path d="M320,396 V410 M114,410 H526" class="dg-line dg-line--open"></path></g><g><path d="M114,410 V420" class="dg-line"></path></g><g><path d="M320,410 V420" class="dg-line"></path></g><g><path d="M526,410 V420" class="dg-line"></path></g><g><rect x="16" y="420" width="196" height="40" rx="2" class="dg-node dg-node--soft"></rect><text x="114" y="439" text-anchor="middle" class="dg-label">Claimed</text><text x="114" y="453" text-anchor="middle" class="dg-label--faint">EXECUTES ONCE</text></g><g><rect x="222" y="420" width="196" height="40" rx="2" class="dg-node dg-node--soft"></rect><text x="320" y="439" text-anchor="middle" class="dg-label">InFlight</text><text x="320" y="453" text-anchor="middle" class="dg-label--faint">WAITS FOR THE OWNER</text></g><g><rect x="428" y="420" width="196" height="40" rx="2" class="dg-node dg-node--soft"></rect><text x="526" y="439" text-anchor="middle" class="dg-label">Done</text><text x="526" y="453" text-anchor="middle" class="dg-label--faint">REPUBLISHES, NO EXECUTION</text></g></g></svg>
