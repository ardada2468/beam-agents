<svg xmlns="http://www.w3.org/2000/svg" width="832" height="1014" viewBox="0 0 640 780" role="img" aria-labelledby="dg-the-approval-round-trip-title dg-the-approval-round-trip-desc" preserveAspectRatio="xMidYMid meet"><style>svg{--paper:#0c0d0f;--paper-2:#141618;--paper-3:#1c1f22;--ink:#ededea;--ink-2:#a7abb0;--ink-3:#8f949a;--rule:#262a2e;--rule-2:#5f666d;--s-output:#ededea;--s-intents:#e0a458;--s-traces:#9bbcdd;--s-errors:#ee9683;--font-sans:'Instrument Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;--font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}.dg-line{fill: none; stroke: var(--rule-2); stroke-width: 1.25; marker-end: var(--dg-marker);}.dg-line--open{marker-end: none;}.dg-line--dashed{stroke-dasharray: 4 3;}.dg-node{fill: var(--paper); stroke: var(--ink); stroke-width: 1.25;}.dg-node--soft{fill: var(--paper-2); stroke: var(--rule-2); stroke-width: 1;}.dg-arrow{fill: var(--rule-2);}.dg-label{font-family: var(--font-mono); font-size: 11px; fill: var(--ink-2); letter-spacing: 0.01em;}.dg-label--title{font-family: var(--font-sans); font-size: 15px; font-weight: 600; fill: var(--ink); letter-spacing: -0.01em;}.dg-label--faint{font-family: var(--font-mono); font-size: 9.5px; fill: var(--ink-3); letter-spacing: 0.06em;}.dg-line--output{stroke: var(--s-output);}.dg-line--intents{stroke: var(--s-intents);}.dg-line--traces{stroke: var(--s-traces);}.dg-line--errors{stroke: var(--s-errors);}.dg-label--output{fill: var(--s-output);}.dg-label--intents{fill: var(--s-intents);}.dg-label--traces{fill: var(--s-traces);}.dg-label--errors{fill: var(--s-errors);}</style><rect x="0" y="0" width="640.0" height="780.0" fill="var(--paper)"/><title id="dg-the-approval-round-trip-title">The approval round trip</title><desc id="dg-the-approval-round-trip-desc">A sequence diagram with four participants across the top — RunAgent, keyed state, the effector, and a human approver — and time running downwards. An external event activates RunAgent, which calls ctx.request_approval to stage an intent and returns Suspend. The commit writes a continuation holding the activation seq and snapshot, records the pending intent id, and arms HITL_TIMER at the deadline; the activation then ends. The approval intent leaves on the intents output, through the outbox, to the effector, which publishes it to the approver without executing it. The diagram then forks into two outcomes. If the approval arrives before the deadline, it re-enters as an ordinary element on the same entity key, the continuation is read back, and the agent is invoked again with ctx.is_resume true, completing on the output stream. If nobody answers, HITL_TIMER fires instead, the pure on_timeout policy runs, and its route either denies with deterministic bytes on the output stream, drops with a hitl_timeout record on the errors stream, or escalates a fresh intent on another channel; Deny and Drop clear the continuation, ending the wait.</desc><defs><marker id="dg-the-approval-round-trip-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L7,4 L0,7 z" class="dg-arrow"></path></marker></defs><g style="--dg-marker:url(#dg-the-approval-round-trip-arrow)"><text x="2" y="68" text-anchor="start" class="dg-label--faint">TIME</text><g><path d="M12,76 V750" class="dg-line"></path></g><g><rect x="52" y="20" width="118" height="40" rx="2" class="dg-node"></rect><text x="111" y="39" text-anchor="middle" class="dg-label">RunAgent</text><text x="111" y="53" text-anchor="middle" class="dg-label--faint">ONE KEY</text></g><g><rect x="196" y="20" width="118" height="40" rx="2" class="dg-node"></rect><text x="255" y="39" text-anchor="middle" class="dg-label">keyed state</text><text x="255" y="53" text-anchor="middle" class="dg-label--faint">PER ENTITY KEY</text></g><g><rect x="340" y="20" width="118" height="40" rx="2" class="dg-node"></rect><text x="399" y="39" text-anchor="middle" class="dg-label">effector</text><text x="399" y="53" text-anchor="middle" class="dg-label--faint">OUTSIDE BEAM</text></g><g><rect x="484" y="20" width="118" height="40" rx="2" class="dg-node"></rect><text x="543" y="39" text-anchor="middle" class="dg-label">approver</text><text x="543" y="53" text-anchor="middle" class="dg-label--faint">A PERSON</text></g><g opacity="0.45"><g><path d="M111,60 V756" class="dg-line dg-line--open"></path></g><g><path d="M255,60 V756" class="dg-line dg-line--open"></path></g><g><path d="M399,60 V756" class="dg-line dg-line--open"></path></g><g><path d="M543,60 V756" class="dg-line dg-line--open"></path></g></g><g><path d="M28,88 H107" class="dg-line"></path></g><text x="118" y="92" text-anchor="start" class="dg-label--faint">external event, keyed</text><g><rect x="52" y="102" width="118" height="42" rx="2" class="dg-node dg-node--soft"></rect><text x="111" y="122" text-anchor="middle" class="dg-label">request_approval</text><text x="111" y="136" text-anchor="middle" class="dg-label--faint">STAGES AN INTENT</text></g><g><path d="M117,168 H251" class="dg-line"></path><text x="184" y="160" text-anchor="middle" class="dg-label--faint">Suspend commits</text></g><g><rect x="196" y="176" width="118" height="42" rx="2" class="dg-node dg-node--soft"></rect><text x="255" y="196" text-anchor="middle" class="dg-label">continuation</text><text x="255" y="210" text-anchor="middle" class="dg-label--faint">SEQ · SNAPSHOT</text></g><g><rect x="196" y="224" width="118" height="42" rx="2" class="dg-node dg-node--soft"></rect><text x="255" y="244" text-anchor="middle" class="dg-label">pending ids</text><text x="255" y="258" text-anchor="middle" class="dg-label--faint">HITL_TIMER ARMED</text></g><g><path d="M117,286 H395" class="dg-line dg-line--dashed dg-line--intents"></path><text x="327" y="278" text-anchor="middle" class="dg-label--faint">ToolIntent · APPROVAL</text></g><text x="327" y="302" text-anchor="middle" class="dg-label--faint dg-label--intents">ON .intents</text><g><path d="M405,330 H539" class="dg-line dg-line--dashed dg-line--intents"></path><text x="471" y="322" text-anchor="middle" class="dg-label--faint">published, never run</text></g><g><path d="M22,354 H624 V512 H22 Z" class="dg-line dg-line--open"></path></g><text x="32" y="372" text-anchor="start" class="dg-label--faint">IF THE APPROVAL ARRIVES IN TIME</text><g><path d="M537,396 H115" class="dg-line dg-line--dashed"></path><text x="471" y="388" text-anchor="middle" class="dg-label--faint">Approval, same key</text></g><g><path d="M249,428 H115" class="dg-line"></path><text x="184" y="420" text-anchor="middle" class="dg-label--faint">continuation read</text></g><g><rect x="52" y="436" width="118" height="42" rx="2" class="dg-node dg-node--soft"></rect><text x="111" y="456" text-anchor="middle" class="dg-label">same activation</text><text x="111" y="470" text-anchor="middle" class="dg-label--faint">CTX.IS_RESUME</text></g><g><path d="M107,498 H28" class="dg-line dg-line--output"></path></g><text x="114" y="502" text-anchor="start" class="dg-label--faint dg-label--output">Complete on .output</text><g><path d="M22,532 H624 V756 H22 Z" class="dg-line dg-line--open"></path></g><text x="32" y="550" text-anchor="start" class="dg-label--faint">IF NOBODY ANSWERS BY deadline_ms</text><g><path d="M249,574 H115" class="dg-line"></path><text x="184" y="566" text-anchor="middle" class="dg-label--faint">HITL_TIMER fires</text></g><g><rect x="52" y="582" width="118" height="42" rx="2" class="dg-node dg-node--soft"></rect><text x="111" y="602" text-anchor="middle" class="dg-label">on_timeout</text><text x="111" y="616" text-anchor="middle" class="dg-label--faint">PURE · RETRY-SAFE</text></g><g><path d="M107,648 H28" class="dg-line dg-line--output"></path></g><text x="114" y="652" text-anchor="start" class="dg-label--faint dg-label--output">Deny: on .output</text><g><path d="M107,676 H28" class="dg-line dg-line--errors"></path></g><text x="114" y="680" text-anchor="start" class="dg-label--faint dg-label--errors">Drop: on .errors</text><g><path d="M117,704 H395" class="dg-line dg-line--dashed dg-line--intents"></path><text x="327" y="696" text-anchor="middle" class="dg-label--faint">Escalate: ask again</text></g><g><path d="M117,732 H251" class="dg-line"></path><text x="184" y="724" text-anchor="middle" class="dg-label--faint">cleared on Deny/Drop</text></g></g></svg>
