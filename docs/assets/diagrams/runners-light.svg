<svg xmlns="http://www.w3.org/2000/svg" width="780" height="863" viewBox="0 0 600 664" role="img" aria-labelledby="dg-where-a-beam-agents-pipeline-runs-title dg-where-a-beam-agents-pipeline-runs-desc" preserveAspectRatio="xMidYMid meet"><style>svg{--paper:#ffffff;--paper-2:#f6f6f4;--paper-3:#edede9;--ink:#0b0c0e;--ink-2:#4a4e54;--ink-3:#63676d;--rule:#e2e2dd;--rule-2:#8e8e87;--s-output:#0b0c0e;--s-intents:#8a5205;--s-traces:#3c5c78;--s-errors:#9e2a18;--font-sans:'Instrument Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;--font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}.dg-line{fill: none; stroke: var(--rule-2); stroke-width: 1.25; marker-end: var(--dg-marker);}.dg-line--open{marker-end: none;}.dg-line--dashed{stroke-dasharray: 4 3;}.dg-node{fill: var(--paper); stroke: var(--ink); stroke-width: 1.25;}.dg-node--soft{fill: var(--paper-2); stroke: var(--rule-2); stroke-width: 1;}.dg-arrow{fill: var(--rule-2);}.dg-label{font-family: var(--font-mono); font-size: 11px; fill: var(--ink-2); letter-spacing: 0.01em;}.dg-label--title{font-family: var(--font-sans); font-size: 15px; font-weight: 600; fill: var(--ink); letter-spacing: -0.01em;}.dg-label--faint{font-family: var(--font-mono); font-size: 9.5px; fill: var(--ink-3); letter-spacing: 0.06em;}.dg-line--output{stroke: var(--s-output);}.dg-line--intents{stroke: var(--s-intents);}.dg-line--traces{stroke: var(--s-traces);}.dg-line--errors{stroke: var(--s-errors);}.dg-label--output{fill: var(--s-output);}.dg-label--intents{fill: var(--s-intents);}.dg-label--traces{fill: var(--s-traces);}.dg-label--errors{fill: var(--s-errors);}</style><rect x="0" y="0" width="600.0" height="664.0" fill="var(--paper)"/><title id="dg-where-a-beam-agents-pipeline-runs-title">Where a beam-agents pipeline runs</title><desc id="dg-where-a-beam-agents-pipeline-runs-desc">Three bands. The first holds what is identical on every runner: your agent, the RunAgent transform, keyed state held as protobuf, and intent ids derived from key, seq and step index. It feeds the second band, what the runner must supply in return: a stateful DoFn over KV input, both event-time and processing-time timers, and bundle retry semantics matching the ones the guarantees are stated against. That feeds the third band, the three supported runners, each labelled with the evidence behind it: DirectRunner by the unit tier and the conformance matrix on every pull request, Flink by a Dockerised mini-cluster on every pull request, and Dataflow against the real service nightly. Spark is drawn below that group, unconnected, because although a weekly leg stands up the Spark stack, every conformance scenario on it is currently a declared skip and none executes.</desc><defs><marker id="dg-where-a-beam-agents-pipeline-runs-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L7,4 L0,7 z" class="dg-arrow"></path></marker></defs><g style="--dg-marker:url(#dg-where-a-beam-agents-pipeline-runs-arrow)"><text x="16" y="26" text-anchor="start" class="dg-label--title">Identical on every runner</text><g><path d="M 16,40 H 584 V 152 H 16 Z" class="dg-line dg-line--open"></path></g><g><rect x="32" y="52" width="260" height="38" rx="2" class="dg-node dg-node--soft"></rect><text x="162" y="70" text-anchor="middle" class="dg-label">your agent</text><text x="162" y="84" text-anchor="middle" class="dg-label--faint">UNCHANGED</text></g><g><rect x="308" y="52" width="260" height="38" rx="2" class="dg-node dg-node--soft"></rect><text x="438" y="70" text-anchor="middle" class="dg-label">RunAgent</text><text x="438" y="84" text-anchor="middle" class="dg-label--faint">KEYED, STATEFUL, KV INPUT</text></g><g><rect x="32" y="102" width="260" height="38" rx="2" class="dg-node dg-node--soft"></rect><text x="162" y="120" text-anchor="middle" class="dg-label">keyed state</text><text x="162" y="134" text-anchor="middle" class="dg-label--faint">PROTOBUF, NEVER PICKLE</text></g><g><rect x="308" y="102" width="260" height="38" rx="2" class="dg-node dg-node--soft"></rect><text x="438" y="120" text-anchor="middle" class="dg-label">intent ids</text><text x="438" y="134" text-anchor="middle" class="dg-label--faint">UUID5 OVER KEY, SEQ, STEP</text></g><g><path d="M 300,152 V 236" class="dg-line"></path><text x="352" y="190" text-anchor="middle" class="dg-label--faint">REQUIRES</text></g><text x="16" y="224" text-anchor="start" class="dg-label--title">Required of the runner</text><g><path d="M 16,238 H 584 V 306 H 16 Z" class="dg-line dg-line--open"></path></g><g><rect x="32" y="252" width="170" height="38" rx="2" class="dg-node dg-node--soft"></rect><text x="117" y="270" text-anchor="middle" class="dg-label">stateful DoFn</text><text x="117" y="284" text-anchor="middle" class="dg-label--faint">WITH KV INPUT</text></g><g><rect x="215" y="252" width="170" height="38" rx="2" class="dg-node dg-node--soft"></rect><text x="300" y="270" text-anchor="middle" class="dg-label">timers</text><text x="300" y="284" text-anchor="middle" class="dg-label--faint">EVENT-TIME + REAL-TIME</text></g><g><rect x="398" y="252" width="170" height="38" rx="2" class="dg-node dg-node--soft"></rect><text x="483" y="270" text-anchor="middle" class="dg-label">bundle retry</text><text x="483" y="284" text-anchor="middle" class="dg-label--faint">AS THE GUARANTEES ASSUME</text></g><g><path d="M 300,306 V 390" class="dg-line"></path></g><text x="16" y="378" text-anchor="start" class="dg-label--title">Supported runners, and their evidence</text><g><path d="M 16,392 H 584 V 568 H 16 Z" class="dg-line dg-line--open"></path></g><g><rect x="32" y="408" width="536" height="44" rx="2" class="dg-node"></rect><text x="300" y="429" text-anchor="middle" class="dg-label">DirectRunner</text><text x="300" y="443" text-anchor="middle" class="dg-label--faint">UNIT TIER + CONFORMANCE, EVERY PR</text></g><g><rect x="32" y="462" width="536" height="44" rx="2" class="dg-node"></rect><text x="300" y="483" text-anchor="middle" class="dg-label">Flink</text><text x="300" y="497" text-anchor="middle" class="dg-label--faint">MINI-CLUSTER IN DOCKER, EVERY PR</text></g><g><rect x="32" y="516" width="536" height="44" rx="2" class="dg-node"></rect><text x="300" y="537" text-anchor="middle" class="dg-label">Dataflow</text><text x="300" y="551" text-anchor="middle" class="dg-label--faint">REAL DATAFLOW, NIGHTLY ONLY</text></g><g><rect x="32" y="596" width="536" height="44" rx="2" class="dg-node dg-node--soft"></rect><text x="300" y="617" text-anchor="middle" class="dg-label">Spark</text><text x="300" y="631" text-anchor="middle" class="dg-label--faint">WEEKLY LEG — EVERY CONFORMANCE CELL CURRENTLY SKIPS</text></g></g></svg>
