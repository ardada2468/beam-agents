<svg xmlns="http://www.w3.org/2000/svg" width="780" height="411" viewBox="0 0 600 316" role="img" aria-labelledby="dg-where-an-adapter-sits-title dg-where-an-adapter-sits-desc" preserveAspectRatio="xMidYMid meet"><style>svg{--paper:#ffffff;--paper-2:#f6f6f4;--paper-3:#edede9;--ink:#0b0c0e;--ink-2:#4a4e54;--ink-3:#63676d;--rule:#e2e2dd;--rule-2:#8e8e87;--s-output:#0b0c0e;--s-intents:#8a5205;--s-traces:#3c5c78;--s-errors:#9e2a18;--font-sans:'Instrument Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;--font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}.dg-line{fill: none; stroke: var(--rule-2); stroke-width: 1.25; marker-end: var(--dg-marker);}.dg-line--open{marker-end: none;}.dg-line--dashed{stroke-dasharray: 4 3;}.dg-node{fill: var(--paper); stroke: var(--ink); stroke-width: 1.25;}.dg-node--soft{fill: var(--paper-2); stroke: var(--rule-2); stroke-width: 1;}.dg-arrow{fill: var(--rule-2);}.dg-label{font-family: var(--font-mono); font-size: 11px; fill: var(--ink-2); letter-spacing: 0.01em;}.dg-label--title{font-family: var(--font-sans); font-size: 15px; font-weight: 600; fill: var(--ink); letter-spacing: -0.01em;}.dg-label--faint{font-family: var(--font-mono); font-size: 9.5px; fill: var(--ink-3); letter-spacing: 0.06em;}.dg-line--output{stroke: var(--s-output);}.dg-line--intents{stroke: var(--s-intents);}.dg-line--traces{stroke: var(--s-traces);}.dg-line--errors{stroke: var(--s-errors);}.dg-label--output{fill: var(--s-output);}.dg-label--intents{fill: var(--s-intents);}.dg-label--traces{fill: var(--s-traces);}.dg-label--errors{fill: var(--s-errors);}</style><rect x="0" y="0" width="600.0" height="316.0" fill="var(--paper)"/><title id="dg-where-an-adapter-sits-title">Where an adapter sits</title><desc id="dg-where-an-adapter-sits-desc">Three tiers. The authoring tier holds four ways to write an agent: LangGraph, a plain async function matching the reference protocol, Google ADK, and Pydantic AI. The adapter tier holds three boxes: LangGraphAgent, which supplies the per-activation checkpointer and the tool node; AdkAgent, which supplies the per-key session service and the tool shims; and PydanticAIAgent, which supplies the runtime toolset and message history. The plain async function passes straight down past this tier, needing no adapter. The runtime tier is a single bar, the RunAgent transform, which gives keyed state, the replay cache, intents and per-key ordering to everything above it.</desc><defs><marker id="dg-where-an-adapter-sits-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L7,4 L0,7 z" class="dg-arrow"></path></marker></defs><g style="--dg-marker:url(#dg-where-an-adapter-sits-arrow)"><text x="16" y="26" text-anchor="start" class="dg-label--faint">AUTHORING</text><g><rect x="18" y="38" width="132" height="54" rx="2" class="dg-node"></rect><text x="84" y="64" text-anchor="middle" class="dg-label">LangGraph</text><text x="84" y="78" text-anchor="middle" class="dg-label--faint">IMPLEMENTED</text></g><g><rect x="162" y="38" width="132" height="54" rx="2" class="dg-node"></rect><text x="228" y="64" text-anchor="middle" class="dg-label">async function</text><text x="228" y="78" text-anchor="middle" class="dg-label--faint">REFERENCE PROTOCOL</text></g><g><rect x="306" y="38" width="132" height="54" rx="2" class="dg-node"></rect><text x="372" y="64" text-anchor="middle" class="dg-label">Google ADK</text><text x="372" y="78" text-anchor="middle" class="dg-label--faint">IMPLEMENTED</text></g><g><rect x="450" y="38" width="132" height="54" rx="2" class="dg-node"></rect><text x="516" y="64" text-anchor="middle" class="dg-label">Pydantic AI</text><text x="516" y="78" text-anchor="middle" class="dg-label--faint">IMPLEMENTED</text></g><text x="16" y="124" text-anchor="start" class="dg-label--faint">ADAPTER</text><g><path d="M 84,92 V 134" class="dg-line"></path></g><g><rect x="18" y="136" width="132" height="54" rx="2" class="dg-node"></rect><text x="84" y="162" text-anchor="middle" class="dg-label">LangGraphAgent</text><text x="84" y="176" text-anchor="middle" class="dg-label--faint">CHECKPOINTER + TOOL NODE</text></g><g><path d="M 84,190 V 232" class="dg-line"></path></g><g><path d="M 228,92 V 232" class="dg-line"></path></g><text x="238" y="180" text-anchor="start" class="dg-label--faint">NO ADAPTER NEEDED</text><g><path d="M 372,92 V 134" class="dg-line"></path></g><g><rect x="306" y="136" width="132" height="54" rx="2" class="dg-node"></rect><text x="372" y="162" text-anchor="middle" class="dg-label">AdkAgent</text><text x="372" y="176" text-anchor="middle" class="dg-label--faint">SESSION + TOOL SHIMS</text></g><g><path d="M 372,190 V 232" class="dg-line"></path></g><g><path d="M 516,92 V 134" class="dg-line"></path></g><g><rect x="450" y="136" width="132" height="54" rx="2" class="dg-node"></rect><text x="516" y="162" text-anchor="middle" class="dg-label">PydanticAIAgent</text><text x="516" y="176" text-anchor="middle" class="dg-label--faint">TOOLSET + HISTORY</text></g><g><path d="M 516,190 V 232" class="dg-line"></path></g><text x="16" y="222" text-anchor="start" class="dg-label--faint">RUNTIME</text><g><rect x="18" y="234" width="564" height="58" rx="2" class="dg-node"></rect><text x="300" y="262" text-anchor="middle" class="dg-label">RunAgent</text><text x="300" y="276" text-anchor="middle" class="dg-label--faint">KEYED STATE, REPLAY CACHE, INTENTS, PER-KEY ORDER</text></g></g></svg>
