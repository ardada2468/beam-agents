<svg xmlns="http://www.w3.org/2000/svg" width="832" height="536" viewBox="0 0 640 412" role="img" aria-labelledby="dg-the-shape-of-an-activation-title dg-the-shape-of-an-activation-desc" preserveAspectRatio="xMidYMid meet"><style>svg{--paper:#ffffff;--paper-2:#f6f6f4;--paper-3:#edede9;--ink:#0b0c0e;--ink-2:#4a4e54;--ink-3:#63676d;--rule:#e2e2dd;--rule-2:#8e8e87;--s-output:#0b0c0e;--s-intents:#8a5205;--s-traces:#3c5c78;--s-errors:#9e2a18;--font-sans:'Instrument Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;--font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}.dg-line{fill: none; stroke: var(--rule-2); stroke-width: 1.25; marker-end: var(--dg-marker);}.dg-line--open{marker-end: none;}.dg-line--dashed{stroke-dasharray: 4 3;}.dg-node{fill: var(--paper); stroke: var(--ink); stroke-width: 1.25;}.dg-node--soft{fill: var(--paper-2); stroke: var(--rule-2); stroke-width: 1;}.dg-arrow{fill: var(--rule-2);}.dg-label{font-family: var(--font-mono); font-size: 11px; fill: var(--ink-2); letter-spacing: 0.01em;}.dg-label--title{font-family: var(--font-sans); font-size: 15px; font-weight: 600; fill: var(--ink); letter-spacing: -0.01em;}.dg-label--faint{font-family: var(--font-mono); font-size: 9.5px; fill: var(--ink-3); letter-spacing: 0.06em;}.dg-line--output{stroke: var(--s-output);}.dg-line--intents{stroke: var(--s-intents);}.dg-line--traces{stroke: var(--s-traces);}.dg-line--errors{stroke: var(--s-errors);}.dg-label--output{fill: var(--s-output);}.dg-label--intents{fill: var(--s-intents);}.dg-label--traces{fill: var(--s-traces);}.dg-label--errors{fill: var(--s-errors);}</style><rect x="0" y="0" width="640.0" height="412.0" fill="var(--paper)"/><title id="dg-the-shape-of-an-activation-title">The shape of an activation</title><desc id="dg-the-shape-of-an-activation-desc">One pre-keyed element — a key and an AgentEnvelope — and the keyed state for that key, holding working memory, the LLM replay cache, any continuation and seq, are read into an AgentContext, which is the only surface the agent touches: memory, the model, read-only tools, act() for side effects and emit() for outputs. The agent runs against that context and returns an Outcome, either Complete or Suspend. Four named outputs leave: .output for terminal agent outputs, .intents for side-effect requests, .traces for observability records and .errors for dead letters. Everything the activation staged is written back to keyed state in one step, atomically with the Beam bundle; a dead letter on .errors means no outcome was produced and nothing was committed.</desc><defs><marker id="dg-the-shape-of-an-activation-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L7,4 L0,7 z" class="dg-arrow"></path></marker></defs><g style="--dg-marker:url(#dg-the-shape-of-an-activation-arrow)"><g><rect x="16" y="26" width="280" height="46" rx="2" class="dg-node"></rect><text x="156" y="48" text-anchor="middle" class="dg-label">KV[key, AgentEnvelope]</text><text x="156" y="62" text-anchor="middle" class="dg-label--faint">ONE ELEMENT, ONE KEY</text></g><g><rect x="324" y="26" width="300" height="46" rx="2" class="dg-node"></rect><text x="474" y="48" text-anchor="middle" class="dg-label">keyed state, for this key</text><text x="474" y="62" text-anchor="middle" class="dg-label--faint">MEMORY LLM CACHE CONTINUATION SEQ</text></g><g><path d="M156,72 V96 M474,72 V96 M156,96 H474" class="dg-line dg-line--open"></path></g><text x="320" y="88" text-anchor="middle" class="dg-label--faint">STATE IS READ ONCE, HERE</text><g><path d="M320,96 V124" class="dg-line"></path></g><g><rect x="170" y="124" width="300" height="52" rx="2" class="dg-node"></rect><text x="320" y="149" text-anchor="middle" class="dg-label">AgentContext</text><text x="320" y="163" text-anchor="middle" class="dg-label--faint">MEMORY MODEL TOOLS act() emit()</text></g><g><path d="M320,176 V200" class="dg-line"></path></g><g><rect x="190" y="200" width="260" height="52" rx="2" class="dg-node"></rect><text x="320" y="225" text-anchor="middle" class="dg-label">your agent</text><text x="320" y="239" text-anchor="middle" class="dg-label--faint">activate(ctx)</text></g><g><path d="M320,252 V276" class="dg-line"></path></g><g><rect x="180" y="276" width="280" height="52" rx="2" class="dg-node"></rect><text x="320" y="301" text-anchor="middle" class="dg-label">Outcome</text><text x="320" y="315" text-anchor="middle" class="dg-label--faint">COMPLETE OR SUSPEND</text></g><g><path d="M320,328 V344 M80,344 H560" class="dg-line dg-line--open"></path></g><g><path d="M80,344 V360" class="dg-line dg-line--output"></path></g><text x="80" y="374" text-anchor="middle" class="dg-label dg-label--output">.output</text><g><path d="M240,344 V360" class="dg-line dg-line--intents"></path></g><text x="240" y="374" text-anchor="middle" class="dg-label dg-label--intents">.intents</text><g><path d="M400,344 V360" class="dg-line dg-line--traces"></path></g><text x="400" y="374" text-anchor="middle" class="dg-label dg-label--traces">.traces</text><g><path d="M560,344 V360" class="dg-line dg-line--errors"></path></g><text x="560" y="374" text-anchor="middle" class="dg-label dg-label--errors">.errors</text><text x="560" y="388" text-anchor="middle" class="dg-label--faint">IF NO OUTCOME</text><text x="560" y="400" text-anchor="middle" class="dg-label--faint">NOTHING COMMITTED</text><g><path d="M460,302 H596 Q612,302 612,286 V72" class="dg-line"></path></g><text x="474" y="316" text-anchor="start" class="dg-label--faint">COMMITTED ATOMICALLY</text><text x="474" y="328" text-anchor="start" class="dg-label--faint">WITH THE BUNDLE</text></g></svg>
