<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1108" viewBox="0 0 600 852" role="img" aria-labelledby="dg-two-arrangements-of-the-same-work-title dg-two-arrangements-of-the-same-work-desc" preserveAspectRatio="xMidYMid meet"><style>svg{--paper:#ffffff;--paper-2:#f6f6f4;--paper-3:#edede9;--ink:#0b0c0e;--ink-2:#4a4e54;--ink-3:#63676d;--rule:#e2e2dd;--rule-2:#8e8e87;--s-output:#0b0c0e;--s-intents:#8a5205;--s-traces:#3c5c78;--s-errors:#9e2a18;--font-sans:'Instrument Sans', ui-sans-serif, system-ui, -apple-system, sans-serif;--font-mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;}.dg-line{fill: none; stroke: var(--rule-2); stroke-width: 1.25; marker-end: var(--dg-marker);}.dg-line--open{marker-end: none;}.dg-line--dashed{stroke-dasharray: 4 3;}.dg-node{fill: var(--paper); stroke: var(--ink); stroke-width: 1.25;}.dg-node--soft{fill: var(--paper-2); stroke: var(--rule-2); stroke-width: 1;}.dg-arrow{fill: var(--rule-2);}.dg-label{font-family: var(--font-mono); font-size: 11px; fill: var(--ink-2); letter-spacing: 0.01em;}.dg-label--title{font-family: var(--font-sans); font-size: 15px; font-weight: 600; fill: var(--ink); letter-spacing: -0.01em;}.dg-label--faint{font-family: var(--font-mono); font-size: 9.5px; fill: var(--ink-3); letter-spacing: 0.06em;}.dg-line--output{stroke: var(--s-output);}.dg-line--intents{stroke: var(--s-intents);}.dg-line--traces{stroke: var(--s-traces);}.dg-line--errors{stroke: var(--s-errors);}.dg-label--output{fill: var(--s-output);}.dg-label--intents{fill: var(--s-intents);}.dg-label--traces{fill: var(--s-traces);}.dg-label--errors{fill: var(--s-errors);}</style><rect x="0" y="0" width="600.0" height="852.0" fill="var(--paper)"/><title id="dg-two-arrangements-of-the-same-work-title">Two arrangements of the same work</title><desc id="dg-two-arrangements-of-the-same-work-desc">Two stacked panels. Beside the runtime: a queue that redelivers on failure feeds a worker process holding the agent and its framework, and the worker forks into a state store that commits separately and an external API where the effect runs. A rectangle labelled retry boundary encloses all three, so a redelivery re-runs the worker, the state write and the API call. Inside the runtime: events feed the RunAgent transform, which stages every effect and forks into keyed state that commits with the bundle and an intents output. A rectangle labelled retry boundary encloses the transform and its keyed state only. The intents output leaves that rectangle to an outbox topic that deduplicates by intent id, and then to an effector — a separate service, outside the boundary, where the effect runs. Its result re-enters on the same key.</desc><defs><marker id="dg-two-arrangements-of-the-same-work-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L7,4 L0,7 z" class="dg-arrow"></path></marker></defs><g style="--dg-marker:url(#dg-two-arrangements-of-the-same-work-arrow)"><text x="16" y="26" text-anchor="start" class="dg-label--title">Beside the runtime</text><text x="16" y="46" text-anchor="start" class="dg-label--faint">A REDELIVERY RE-RUNS EVERYTHING INSIDE THE BOUNDARY</text><g><rect x="180" y="62" width="240" height="48" rx="2" class="dg-node"></rect><text x="300" y="85" text-anchor="middle" class="dg-label">queue</text><text x="300" y="99" text-anchor="middle" class="dg-label--faint">REDELIVERS ON FAILURE</text></g><g><path d="M 24,148 H 576 V 322 H 24 Z" class="dg-line dg-line--open"></path></g><text x="34" y="164" text-anchor="start" class="dg-label--faint">RETRY BOUNDARY</text><g><path d="M 300,110 V 172" class="dg-line"></path></g><g><rect x="180" y="176" width="240" height="48" rx="2" class="dg-node"></rect><text x="300" y="199" text-anchor="middle" class="dg-label">worker process</text><text x="300" y="213" text-anchor="middle" class="dg-label--faint">AGENT AND FRAMEWORK</text></g><g><path d="M 300,224 V 242" class="dg-line dg-line--open"></path></g><g><path d="M 156,242 H 444" class="dg-line dg-line--open"></path></g><g><path d="M 156,242 V 254" class="dg-line"></path></g><g><path d="M 444,242 V 254" class="dg-line"></path></g><g><rect x="32" y="258" width="248" height="48" rx="2" class="dg-node dg-node--soft"></rect><text x="156" y="281" text-anchor="middle" class="dg-label">state store</text><text x="156" y="295" text-anchor="middle" class="dg-label--faint">SEPARATE COMMIT</text></g><g><rect x="320" y="258" width="248" height="48" rx="2" class="dg-node"></rect><text x="444" y="281" text-anchor="middle" class="dg-label">external API</text><text x="444" y="295" text-anchor="middle" class="dg-label--faint">EFFECT RUNS HERE</text></g><g><path d="M 16,352 H 584" class="dg-line dg-line--open"></path></g><text x="16" y="392" text-anchor="start" class="dg-label--title">Inside the runtime</text><text x="16" y="412" text-anchor="start" class="dg-label--faint">NOTHING INSIDE THE BOUNDARY APPLIES UNTIL THE BUNDLE COMMITS</text><g><rect x="180" y="428" width="240" height="48" rx="2" class="dg-node"></rect><text x="300" y="451" text-anchor="middle" class="dg-label">events</text><text x="300" y="465" text-anchor="middle" class="dg-label--faint">KEYED BY ENTITY</text></g><g><path d="M 24,514 H 576 V 688 H 24 Z" class="dg-line dg-line--open"></path></g><text x="34" y="530" text-anchor="start" class="dg-label--faint">RETRY BOUNDARY</text><g><path d="M 300,476 V 538" class="dg-line"></path></g><g><rect x="180" y="542" width="240" height="48" rx="2" class="dg-node"></rect><text x="300" y="565" text-anchor="middle" class="dg-label">RunAgent</text><text x="300" y="579" text-anchor="middle" class="dg-label--faint">STAGES EVERY EFFECT</text></g><g><path d="M 300,590 V 608" class="dg-line dg-line--open"></path></g><g><path d="M 156,608 H 444" class="dg-line dg-line--open"></path></g><g><path d="M 156,608 V 620" class="dg-line"></path></g><g><rect x="32" y="624" width="248" height="48" rx="2" class="dg-node dg-node--soft"></rect><text x="156" y="647" text-anchor="middle" class="dg-label">keyed state</text><text x="156" y="661" text-anchor="middle" class="dg-label--faint">COMMITS WITH THE BUNDLE</text></g><g><path d="M 444,608 V 700" class="dg-line dg-line--intents"></path></g><text x="464" y="656" text-anchor="start" class="dg-label--faint dg-label--intents">.intents</text><g><rect x="320" y="704" width="248" height="48" rx="2" class="dg-node"></rect><text x="444" y="727" text-anchor="middle" class="dg-label">outbox topic</text><text x="444" y="741" text-anchor="middle" class="dg-label--faint">DEDUP BY INTENT_ID</text></g><g><path d="M 444,752 V 774" class="dg-line"></path></g><g><rect x="320" y="778" width="248" height="48" rx="2" class="dg-node"></rect><text x="444" y="801" text-anchor="middle" class="dg-label">effector</text><text x="444" y="815" text-anchor="middle" class="dg-label--faint">EFFECT RUNS HERE</text></g><g><path d="M 568,802 H 588 V 452 H 424" class="dg-line dg-line--dashed"></path><text x="505" y="444" text-anchor="middle" class="dg-label--faint">RE-ENTERS ON THIS KEY</text></g></g></svg>
