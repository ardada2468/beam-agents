repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]

      - id: protobuf-drift
        name: protobuf generation drift
        entry: scripts/check_proto_drift.sh
        language: script
        pass_filenames: false
        files: ^protos/.*\.proto$

      - id: openspec-change-required
        name: OpenSpec change required for src/ edits
        entry: scripts/check_openspec_change.sh
        language: script
        pass_filenames: false
        always_run: true
