repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
        types: [python]

      - id: protobuf-drift
        name: protobuf generation drift
        entry: scripts/check_proto_drift.sh
        language: script
        pass_filenames: false
        files: ^protos/.*\.proto$

      - id: openspec-change-required
        name: OpenSpec change required for src/ edits
        entry: scripts/check_openspec_change.sh
        language: script
        pass_filenames: false
        always_run: true

      # Same shape and same always_run rationale as the hook above: the check
      # inspects the staged diff (or, in CI, the PR base) itself, so it must
      # run even when no file it would name is passed to it. Riding the
      # existing `pre-commit run --all-files` step in quality.yml means no new
      # required status check.
      - id: changelog-fragment-required
        name: Changelog fragment required for src/ edits
        entry: scripts/check_changelog_fragment.sh
        language: script
        pass_filenames: false
        always_run: true
