# Per-benchmark median baselines (ms) for scripts/bench_gate.py, in the same
# ratchet style as coverage-baseline.toml and mutation-baseline.toml: the gate
# fails when a median regresses beyond the tolerance band, and prints the
# lower-the-baseline instruction when one improves beyond it, so gains are
# locked in deliberately rather than silently.
#
# tolerance is the default relative band on every median comparison
# (0.25 = 25%), overridable per benchmark in [tolerance_overrides] below. It
# is a guess until nightly variance data exists; recalibrate it here, not in
# the gate. On watch: the only two hosted-runner observations of overhead_50ms
# so far are 0.8517 and 0.6358 ms — a 1.34x spread that 0.25 does not cover in
# the regression direction either. It has not gone red, and two samples are
# not a variance estimate, so the band stays put until a few more nights say
# what it should be. invariance_tolerance_ms is the absolute slack (ms) the 500/2000 ms
# overhead tiers' medians may sit above the 50 ms tier's before the gate calls
# the runtime wait-scaled (design D2/D4) — absolute, because a relative band
# on a low-single-digit-millisecond median would gate on scheduler noise.
tolerance = 0.25
invariance_tolerance_ms = 10.0

# Per-benchmark relative bands, overriding `tolerance` for the names listed.
# One band cannot serve the whole suite. Every other benchmark drives Python
# through a full activation and lands between 0.2 ms and 3 ms, where 25% is
# comfortably above hosted-runner jitter. The `encode_*` micro-benchmarks are
# a single `SerializeToString(deterministic=True)` call — 0.6 to 14 *micro*
# seconds of memcpy-bound C — so their medians track the memory bandwidth of
# whichever CPU generation `ubuntu-latest` allocated that night, not this
# repository's code.
#
# The evidence: the 2026-08-03 seed run recorded encode_64kib (0.0122) as
# *dearer* than encode_100kib (0.0103), which the code cannot do — encoding a
# strictly larger blob is strictly more work, and a local run confirms the
# curve is monotonic. Nightly run 32323110935 then measured the same two at
# 0.0085 and 0.0137 with no commit in between touching the coder, the protos,
# the harness, or the pinned protobuf: a 1.44x swing on 64 KiB and 1.33x on
# 100 KiB, from runner allocation alone. A 25% band there reports the CPU
# lottery as a code regression, and its lock-in-the-gain note is worse than
# useless — following the seed instruction that run printed for encode_64kib
# would have committed 0.0085 and made the *next* night red.
#
# 0.60 covers the observed swing with headroom while still failing anything
# that doubles: the regressions worth catching here are order-of-magnitude
# ones (protobuf falling back to the pure-Python backend, an accidental
# double-encode), not tens of percent. These four are attribution instruments
# for the `state_commit_*` curve (docs/benchmarks.md), not the gated budget.
[tolerance_overrides]
encode_1kib = 0.60
encode_16kib = 0.60
encode_64kib = 0.60
encode_100kib = 0.60

# Seeding procedure: run the nightly `bench` job (workflow_dispatch) on a
# GitHub-hosted runner, then copy each `seed medians_ms.<name> = <value>`
# instruction the red gate prints into this table, noting the runner
# generation. An entry missing here fails the gate loudly — an unseeded
# baseline is a gate that is not gating — so the first hosted-runner run after
# adding a benchmark is red by construction until its median is committed.
#
# Seeded 2026-08-03 from the scheduled nightly `bench` job run 30806138398
# (ubuntu-latest GitHub-hosted runner, main @ e5cf356). Every value below is
# the seed instruction that run's red gate printed, copied verbatim per the
# procedure above. Absolute budget on the same run: overhead_50ms p50
# 0.8517 ms (< 15 ms), p99 0.9767 ms (< 60 ms), 1000 samples.
[medians_ms]
noop_throughput = 0.2167
overhead_50ms = 0.8517
overhead_500ms = 1.3781
overhead_2000ms = 2.9010
suspension_roundtrip = 0.5172
state_commit_1kib = 0.2267
state_commit_16kib = 0.2300
state_commit_64kib = 0.2360
state_commit_100kib = 0.2462
encode_1kib = 0.0006
encode_16kib = 0.0015
# Re-seeded 2026-08-19 from nightly run 32323110935 (same runner class): the
# 2026-08-03 pair was non-monotonic in blob size and could not both be right.
# Both nights' observations fall inside both entries' 60% bands, so this
# choice is the monotonic one rather than a loosening.
encode_64kib = 0.0085
encode_100kib = 0.0137
runinference_delta = 0.6431
