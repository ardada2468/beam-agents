# Per-benchmark median baselines (ms) for scripts/bench_gate.py, in the same
# ratchet style as coverage-baseline.toml and mutation-baseline.toml: the gate
# fails when a median regresses beyond the tolerance band, and prints the
# lower-the-baseline instruction when one improves beyond it, so gains are
# locked in deliberately rather than silently.
#
# tolerance is the relative band on every median comparison (0.25 = 25%). It
# is a guess until nightly variance data exists; recalibrate it here, not in
# the gate. invariance_tolerance_ms is the absolute slack (ms) the 500/2000 ms
# overhead tiers' medians may sit above the 50 ms tier's before the gate calls
# the runtime wait-scaled (design D2/D4) — absolute, because a relative band
# on a low-single-digit-millisecond median would gate on scheduler noise.
tolerance = 0.25
invariance_tolerance_ms = 10.0

# Seeding procedure: run the nightly `bench` job (workflow_dispatch) on a
# GitHub-hosted runner, then copy each `seed medians_ms.<name> = <value>`
# instruction the red gate prints into this table, noting the runner
# generation. An entry missing here fails the gate loudly — an unseeded
# baseline is a gate that is not gating — so the first hosted-runner run after
# adding a benchmark is red by construction until its median is committed.
#
# Seeded 2026-08-03 from the scheduled nightly `bench` job run 30806138398
# (ubuntu-latest GitHub-hosted runner, main @ e5cf356). Every value below is
# the seed instruction that run's red gate printed, copied verbatim per the
# procedure above. Absolute budget on the same run: overhead_50ms p50
# 0.8517 ms (< 15 ms), p99 0.9767 ms (< 60 ms), 1000 samples.
[medians_ms]
noop_throughput = 0.2167
overhead_50ms = 0.8517
overhead_500ms = 1.3781
overhead_2000ms = 2.9010
suspension_roundtrip = 0.5172
state_commit_1kib = 0.2267
state_commit_16kib = 0.2300
state_commit_64kib = 0.2360
state_commit_100kib = 0.2462
encode_1kib = 0.0006
encode_16kib = 0.0015
encode_64kib = 0.0122
encode_100kib = 0.0103
runinference_delta = 0.6431
