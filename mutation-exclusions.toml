# `typing.cast(typ, val)` returns `val` untouched and never inspects `typ` --
# it exists for the type checker and is erased at runtime. Every mutation of a
# `cast` call's FIRST argument is therefore equivalent by construction, and the
# type checker (which is the only consumer that could tell them apart) does not
# see the generated mutant tree at all. The seven below are exactly the `cast`
# first-argument mutants in migration.py; `mypy --strict` remains the gate on
# the real annotations.
"beam_agents.core.migration.x_migrate_to_current__mutmut_28" = "`cast(None, step(migrated))` returns the same object as `cast(\"_M\", ...)`: `typing.cast` ignores its type argument at runtime."
"beam_agents.core.migration.x_migrate_to_current__mutmut_32" = "`cast(\"XX_MXX\", ...)` returns the same object as `cast(\"_M\", ...)`: the type argument is a string the runtime never resolves."
"beam_agents.core.migration.x_migrate_to_current__mutmut_33" = "`cast(\"_m\", ...)` returns the same object as `cast(\"_M\", ...)`: the type argument is a string the runtime never resolves."
"beam_agents.core.migration.x_migration__mutmut_7" = "`cast(None, step)` stores the same callable in `_REGISTRY` as `cast(\"Callable[[Message], Message]\", step)`: `typing.cast` ignores its type argument at runtime."
"beam_agents.core.migration.x_migration__mutmut_11" = "`cast(\"XXCallable[[Message], Message]XX\", step)` stores the identical callable: the type argument is a string the runtime never resolves."
"beam_agents.core.migration.x_migration__mutmut_12" = "`cast(\"callable[[message], message]\", step)` stores the identical callable: the type argument is a string the runtime never resolves."
"beam_agents.core.migration.x_migration__mutmut_13" = "`cast(\"CALLABLE[[MESSAGE], MESSAGE]\", step)` stores the identical callable: the type argument is a string the runtime never resolves."
# `if version > current: raise` is guarded by the `if version == current:
# return` immediately above it, so the comparison is only ever evaluated when
# `version != current` -- the one input that distinguishes `>` from `>=` cannot
# reach this line. The strict operator stays in the source because it is what
# the line means on its own terms; the equality fast path is an optimization
# (identity, no copy), not the raise's precondition.
"beam_agents.core.migration.x_migrate_to_current__mutmut_6" = "`version >= current` is identical to `version > current` here: the preceding `if version == current: return message` makes equality unreachable at this line."
