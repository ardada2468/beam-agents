# The four below all flip `SerializeToString(deterministic=...)` on the errors
# encoding. Protobuf's `deterministic` flag governs exactly one thing: the
# encoding order of `map<>` fields. Neither `ActivationErrorRecord` nor
# `AgentEnvelope` has a map field, so all three values produce byte-identical
# output today and no assertion can distinguish them. The flag stays in the
# source as a guard for additive schema evolution -- the day either message
# gains a map, these mutants become killable by the existing byte-stability
# tests, which is the point of keeping it.
"beam_agents.core.error_records.x_serialize_error_envelope__mutmut_8" = "`record.SerializeToString(deterministic=None)` is byte-identical to `deterministic=True`: the flag only orders `map<>` fields and ActivationErrorRecord has none."
