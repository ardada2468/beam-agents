# Mutants that no test can kill because they are *equivalent* to the original
# code -- the mutation produces no observable behavioural difference. Typical
# cases: an identity-preserving arithmetic change, reordered operands of a
# commutative operator, or a mutation confined to a __repr__.
#
# This file is the ONLY sanctioned way to stop a surviving mutant from failing
# `make mutation`. Weakening an assertion or deselecting a test to make a mutant
# pass is forbidden (openspec/project.md: "Never weaken a test to make an
# implementation pass"). Every entry here is diff-visible and reviewable.
#
# The reason is mandatory -- it is the value, so an entry cannot exist without
# one. Say why the mutant is unkillable, not that it is inconvenient. "No test
# covers this" is a test gap, not an equivalent mutant, and does not belong here.
#
# scripts/mutation_gate.py fails if an entry names a mutant that no longer
# exists, so this list cannot silently accumulate stale suppressions.
#
# Format:
#   [mutants]
#   "beam_agents.core.loop.xǁLoopDriverǁ_advance__mutmut_12" = "Reorders operands of a commutative `and`; identical semantics."

[mutants]
"beam_agents.core.context.xǁAgentContextǁ__init____mutmut_39" = "Initial `_drained = None` is observably identical to `False`: both are private, falsy sentinels and the first drain replaces either with `True`."
"beam_agents.core.context.xǁAgentContextǁact__mutmut_12" = "`json.dumps(ensure_ascii=None)` is identical to `ensure_ascii=False` because the option is consumed only by truth-value testing."
"beam_agents.core.context.xǁAgentContextǁact__mutmut_13" = "`json.dumps(allow_nan=None)` is identical to `allow_nan=False` because the option is consumed only by truth-value testing."
"beam_agents.core.context.xǁActivationContextǁcall_model__mutmut_35" = "Passing `cache_hit=None` is identical to `False`: `_stage_llm_trace` only selects `true` for truthy values and emits `false` for both."
"beam_agents.core.context.xǁActivationContextǁact__mutmut_18" = "For a protobuf scalar constructor field, `attempt=None` is treated as omitted and produces the same default integer value `0` and wire bytes."
"beam_agents.core.context.xǁActivationContextǁact__mutmut_27" = "Omitting protobuf scalar field `attempt` produces the same default integer value `0` and wire bytes as explicitly passing `attempt=0`."
