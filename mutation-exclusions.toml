# Mutants that no test can kill because they are *equivalent* to the original
# code -- the mutation produces no observable behavioural difference. Typical
# cases: an identity-preserving arithmetic change, reordered operands of a
# commutative operator, or a mutation confined to a __repr__.
#
# This file is the ONLY sanctioned way to stop a surviving mutant from failing
# `make mutation`. Weakening an assertion or deselecting a test to make a mutant
# pass is forbidden (openspec/project.md: "Never weaken a test to make an
# implementation pass"). Every entry here is diff-visible and reviewable.
#
# The reason is mandatory -- it is the value, so an entry cannot exist without
# one. Say why the mutant is unkillable, not that it is inconvenient. "No test
# covers this" is a test gap, not an equivalent mutant, and does not belong here.
#
# scripts/mutation_gate.py fails if an entry names a mutant that no longer
# exists, so this list cannot silently accumulate stale suppressions.
#
# POSITIONAL DRIFT -- read before editing core/ and before trusting an entry.
# Mutant names are POSITIONAL (`__mutmut_<n>` is an index, not an identity), so
# inserting a statement into a mutated function silently re-points every entry
# below the insertion at a DIFFERENT mutant while leaving its reason text
# untouched. The entry keeps reading plausibly and now guards the wrong thing.
#
# This is not hypothetical. The verify-live-infrastructure run (2026-07-31) was
# the first execution of `make mutation` on this tree, and it found exactly two
# drifted entries, both in functions `add-token-budgets` inserted statements
# into:
#
#   * `call_model__mutmut_45` -- reason described `cache_hit=None`; the mutant at
#     that index had become `self._tally.llm_calls += 1` -> `+= 2`. That is a
#     real off-by-one in the LLM call tally, and the stale entry would have
#     suppressed it under a justification about something else entirely. The
#     `cache_hit=None` mutant it was written for had moved to index 51.
#   * `AgentContext.__init____mutmut_51` -- reason described `_drained = None`;
#     the mutant at that index had become `_completion_tokens = 0` -> `None`.
#     The intended mutant had moved to index 56.
#
# Both were repaired by RENUMBERING to the mutant the reason actually describes,
# not by deletion: the described mutants are still live, still equivalent, and
# still need exempting. Deleting them would have surfaced two genuinely
# unkillable mutants as permanent survivors.
#
# When you edit a function that has an entry here, re-verify the entry against
# `mutants/src/.../<module>.py` and confirm the mutation at that index still
# matches its reason. The gate's "may exempt only live survivors" check catches
# the case where drift lands on a KILLED mutant; it cannot catch drift that
# lands on another surviving one.
#
# Format:
#   [mutants]
#   "beam_agents.core.loop.xǁLoopDriverǁ_advance__mutmut_12" = "Reorders operands of a commutative `and`; identical semantics."

[mutants]
